name: Setup cached Gearsystem tools
description: Restore or build the pinned Gearsystem 3.9.16 native verification tool bundle.

runs:
  using: composite
  steps:
    - name: Compute Gearsystem cache key
      id: gearsystem-key
      shell: bash
      run: |
        set -euo pipefail
        files=(
          tools/build_gearsystem_tools.sh
          tools/libretro_runner.cpp
          tools/gearsystem_core_runner_native.cpp
          tools/tilesector_profile_runner.cpp
          tools/tilesector_write_trace.cpp
          tools/polar_raw_profile_runner.cpp
          tools/polar_function_profile_runner.cpp
          tools/tilesector_state_capture.cpp
          tools/polar_mode_cycle_profile.cpp
          tools/frame/frame_timeline.cpp
        )
        src_hash="$(sha256sum "${files[@]}" | sha256sum | cut -d' ' -f1)"
        compiler="$(g++ -dumpfullversion -dumpversion)"
        arch="$(uname -m)"
        echo "key=gearsystem-tools-v3-${RUNNER_OS}-${arch}-gcc${compiler}-3.9.16-${src_hash}" >> "$GITHUB_OUTPUT"

    - name: Restore Gearsystem tool bundle
      id: gearsystem-cache
      uses: actions/cache@v4
      with:
        path: |
          .toolchain/Gearsystem
          build/coredbg
          build/libretro_runner
          build/gearsystem_core_runner
          build/tilesector_profile_runner
          build/tilesector_write_trace
          build/polar_raw_profile_runner
          build/polar_function_profile_runner
          build/tilesector_state_capture
          build/polar_mode_cycle_profile
          build/frame_timeline
        key: ${{ steps.gearsystem-key.outputs.key }}

    - name: Build Gearsystem tool bundle
      if: steps.gearsystem-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .toolchain
        rm -rf .toolchain/Gearsystem
        git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
        tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"

    - name: Validate Gearsystem tool bundle
      shell: bash
      run: |
        set -euo pipefail
        test -f .toolchain/Gearsystem/platforms/libretro/gearsystem_libretro.so
        test -f build/coredbg/libgearsystem_core.a
        for exe in           build/libretro_runner           build/gearsystem_core_runner           build/tilesector_profile_runner           build/tilesector_write_trace           build/polar_raw_profile_runner           build/polar_function_profile_runner           build/tilesector_state_capture           build/polar_mode_cycle_profile           build/frame_timeline; do
          test -x "$exe"
        done
        echo "GEARSYSTEM_TOOLS_READY cache_hit=${{ steps.gearsystem-cache.outputs.cache-hit }}"
