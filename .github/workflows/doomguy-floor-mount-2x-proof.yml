name: Doomguy floor-mount 2x proof

on:
  push:
    branches:
      - temp/doomguy-material-form-v2
    paths:
      - ".github/workflows/doomguy-floor-mount-2x-proof.yml"
      - "tools/room_bundle_poc_gen.c"
      - "tools/room_mesh_bake.c"
      - "tools/polar_baked_composite.c"
  workflow_dispatch:

jobs:
  floor-mount-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ASSET: assets/gg-hero/FullDoomguyclassic-single-notex.glb
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user pillow
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Import Doomguy
        run: |
          set -euo pipefail
          mkdir -p build/floor-mount tools/generated
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --height 19 --up z \
            --visual-tris 5200 --shadow-tris 200 --recess-radius 0.5 \
            > build/floor-mount/import.json

      - name: Default (plinth) build stays byte-identical
        run: |
          set -euo pipefail
          # ROOM_BUNDLE_DOOMGUY_FLOOR_MOUNT defaults to 0 specifically so this
          # opt-in feature cannot regress the pre-existing plinth/1.35-scale
          # behaviour every other Doomguy proof depends on. Confirm it here
          # rather than trusting the default silently.
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/floor-mount/bake-default
          mkdir -p build/floor-mount/default-playable
          ROOM_BUNDLE_PLAYABLE=1 \
            build/floor-mount/bake-default build/floor-mount/default-playable \
            | tee build/floor-mount/default-playable.txt
          grep -q '^DOOM_PLAYABLE_PASS positions=38 states=608 ' \
            build/floor-mount/default-playable.txt

      - name: Build floor-mount 2x host baker
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -DROOM_BUNDLE_DOOMGUY_FLOOR_MOUNT=1 \
            -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/floor-mount/bake

      - name: Sanitized floor-mount build
        run: |
          set -euo pipefail
          cc -std=c99 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -DROOM_BUNDLE_DOOMGUY_FLOOR_MOUNT=1 \
            -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/floor-mount/bake-sanitized
          mkdir -p build/floor-mount/sanitized
          # Scoped to the doomguy chamber alone: the 2x-scaled statue needs
          # more scheduler search room than the other, unrelated bundles'
          # default budget allows (see the "exceeds configured upload search
          # limit" note on the route bake step below).
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
          ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=512 \
            build/floor-mount/bake-sanitized build/floor-mount/sanitized

      - name: Mesh bounds probe
        run: |
          set -euo pipefail
          # Flush-to-floor is a construction guarantee (apply_xf scales before
          # it translates, and the importer anchors the mesh's own minimum
          # bound at local Z=0), not just an observed number -- this asserts
          # it stays true rather than only reporting it, and prints the top
          # Z the min-clearance/orbit-radius constants in room_bundle_poc_gen.c
          # were derived from.
          ROOM_BUNDLE_MESH_BOUNDS_PROBE=1 \
            build/floor-mount/bake build/floor-mount \
            | tee build/floor-mount/bounds.txt
          python3 - <<'PY'
          import re
          line = open("build/floor-mount/bounds.txt").read()
          m = re.search(r"min=\(([-\d.]+),([-\d.]+),([-\d.]+)\)", line)
          min_z = float(m.group(3))
          assert min_z < 0.1, f"statue base is not flush with the floor: min.z={min_z}"
          print(f"min.z={min_z} (flush)")
          PY

      - name: Route bake + review capture
        run: |
          set -euo pipefail
          mkdir -p build/floor-mount/capture
          # The strict DOOM_PLAY_* walkable-grid pack is a KNOWN, documented
          # limitation at this scale with this placeholder asset (see the
          # comment on ROOM_BUNDLE_DOOMGUY_MIN_CLEARANCE) -- it is not run
          # here. The route bake and its review video are unaffected:
          # doomguy_quality_clamp pushes the camera out rather than excluding
          # positions, so it cannot disconnect.
          ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=512 \
          ROOM_BUNDLE_CAPTURE_REVIEW=1 \
            build/floor-mount/bake build/floor-mount/capture \
            | tee build/floor-mount/route.txt
          grep -q '^ROOM_BUNDLE_POC_PASS ' build/floor-mount/route.txt
          test "$(find build/floor-mount/capture -name 'review-doomguy-detail-*.ppm' | wc -l)" -eq 120

      - name: Encode orbit video and contact sheet
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -framerate 15 -i build/floor-mount/capture/review-doomguy-detail-%03d.ppm \
            -vf "scale=320:288:flags=neighbor,setpts=2.0*PTS" -r 15 \
            -c:v libx264 -crf 15 -preset medium -pix_fmt yuv420p \
            -movflags +faststart \
            build/floor-mount/doomguy-floor-2x-orbit.mp4
          test -s build/floor-mount/doomguy-floor-2x-orbit.mp4

          python3 - <<'PY'
          from PIL import Image
          import pathlib
          src = pathlib.Path("build/floor-mount/capture")
          idx = [i * 15 for i in range(8)]
          frames = [Image.open(src / f"review-doomguy-detail-{i:03d}.ppm").convert("RGB")
                    for i in idx]
          big = [f.resize((f.width * 2, f.height * 2), Image.NEAREST) for f in frames]
          cols = 4
          w, h = big[0].size
          sheet = Image.new("RGB", (w * cols, h * ((len(idx) + cols - 1) // cols)))
          for k, im in enumerate(big):
              sheet.paste(im, ((k % cols) * w, (k // cols) * h))
          out = pathlib.Path("build/floor-mount/doomguy-floor-2x-contact-sheet.png")
          sheet.save(out)
          print(f"wrote {out}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doomguy-floor-mount-2x-proof
          path: |
            build/floor-mount/import.json
            build/floor-mount/default-playable.txt
            build/floor-mount/bounds.txt
            build/floor-mount/route.txt
            build/floor-mount/doomguy-floor-2x-orbit.mp4
            build/floor-mount/doomguy-floor-2x-contact-sheet.png
            build/floor-mount/capture/review-doomguy-detail-000.ppm
            build/floor-mount/capture/review-doomguy-detail-030.ppm
            build/floor-mount/capture/review-doomguy-detail-060.ppm
            build/floor-mount/capture/review-doomguy-detail-090.ppm
          if-no-files-found: error
