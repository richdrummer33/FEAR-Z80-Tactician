name: Materialize TileSector Stage 7 raster context

on:
  push:
    branches:
      - feature/gg-tilesector-visibility-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply persistent raster context
        run: python3 tools/apply_stage7_raster_ctx.py
      - name: Commit materialized renderer
        shell: bash
        run: |
          if git diff --quiet -- src/tilesector_core.c; then
            echo "No renderer changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tilesector_core.c
          git commit -m "renderer: use persistent Z80 raster context"
          git push
