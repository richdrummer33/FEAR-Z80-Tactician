name: Hero dense view corpus

on:
  push:
    branches:
      - temp/hero-codec-v1-contrast-anchor-lab
      - temp/hero-codec-v2-dense-corpus
      - temp/hero-nested-distance-codec-lab
      - feature/gg-hero-view-codec-v1-continued
    paths:
      - ".github/workflows/hero-dense-corpus.yml"
      - "tools/room_bundle_poc_gen.c"
      - "tools/polar_baked_composite.*"
      - "tools/room_mesh_bake.*"
      - "tools/hero_corpus_analyze.c"
      - "tools/analyze_doomguy_dense_corpus.py"
      - "tools/analyze_nested_distance_codec.py"
      - "tools/nested_lod_core.py"
      - "tools/iterative_solver.py"
      - "tools/solve_nested_distance_codec.py"
      - "tools/sweep_nested_distance_codec.py"
      - "tools/resident_tile_dictionary.py"
      - "tools/analyze_resident_lod_dictionary.py"
      - "tools/resident_tile_lloyd.py"
      - "tools/analyze_resident_lod_learning.py"
      - "tools/render_dense_corpus_sheets.py"
      - "tools/glb_rmb/**"
      - "tests/test_dense_corpus_reader.py"
      - "tests/test_nested_lod_core.py"
      - "tests/test_iterative_solver.py"
      - "tests/test_nested_distance_sweep.py"
      - "tests/test_resident_tile_dictionary.py"
      - "tests/test_resident_tile_lloyd.py"
  workflow_dispatch:

jobs:
  dense-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ASSET: assets/gg-hero/FullDoomguyclassic-single-notex.glb
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: |
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Import Doomguy
        run: |
          set -euo pipefail
          mkdir -p build/corpus/host tools/generated
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --height 19 --up z \
            --visual-tris 5200 --shadow-tris 200 --recess-radius 0.5 \
            | tee build/corpus/IMPORT.json

      - name: Python unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_dense_corpus_reader.py' -v
          python3 -m unittest discover -s tests -p 'test_nested_lod_core.py' -v
          python3 -m unittest discover -s tests -p 'test_iterative_solver.py' -v
          python3 -m unittest discover -s tests -p 'test_nested_distance_sweep.py' -v
          python3 -m unittest discover -s tests -p 'test_resident_tile_dictionary.py' -v
          python3 -m unittest discover -s tests -p 'test_resident_tile_lloyd.py' -v

      - name: Warning-clean host build
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/corpus/corpus-bake
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -Itools \
            tools/hero_corpus_analyze.c -lm -o build/corpus/corpus-analyze

      - name: Sanitized corpus slice
        run: |
          set -euo pipefail
          cc -std=c99 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/corpus/corpus-bake-sanitized
          cc -std=c99 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Itools \
            tools/hero_corpus_analyze.c -lm -o build/corpus/corpus-analyze-sanitized
          mkdir -p build/corpus/slice
          # LeakSanitizer cannot inspect /proc on the hosted runner. Address and
          # undefined-behaviour checks remain enabled and halt on first error.
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1
          ROOM_BUNDLE_HERO_CORPUS=1 HERO_CORPUS_ANGLES=32 \
          HERO_CORPUS_BANDS=24,36 HERO_CORPUS_PREVIEW_EVERY=0 \
            build/corpus/corpus-bake-sanitized build/corpus/slice \
            | tee build/corpus/slice-bake.txt
          grep -q '^DOOM_DENSE_CORPUS_PASS samples=64 angles=32 bands=2 ' \
            build/corpus/slice-bake.txt
          build/corpus/corpus-analyze-sanitized \
            build/corpus/slice/doomguy_dense_corpus.dhc > /dev/null

      - name: Bake the dense corpus
        run: |
          set -euo pipefail
          ROOM_BUNDLE_HERO_CORPUS=1 HERO_CORPUS_PREVIEW_EVERY=32 \
            build/corpus/corpus-bake build/corpus/host \
            | tee build/corpus/bake.txt
          grep -q '^DOOM_DENSE_CORPUS_PASS samples=1024 angles=256 bands=4 ' \
            build/corpus/bake.txt

      - name: Structural read
        run: |
          set -euo pipefail
          python3 tools/analyze_doomguy_dense_corpus.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --dump-dir build/corpus/normalized --dump-every 32 \
            | tee build/corpus/read.txt
          # The reader raises if a band's placement anchor is not constant,
          # which is the guarantee every downstream error figure rests on.
          grep -q 'angular_step_deg=1.4062' build/corpus/read.txt
          test "$(grep -c '^band=' build/corpus/read.txt)" = 4

      - name: Nested distance codec lab
        run: |
          set -euo pipefail
          python3 tools/analyze_nested_distance_codec.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --angle 0 --refine-passes 1 --refine-candidates 64 \
            --rank-refine-passes 1 --rank-refine-candidates 16 \
            --dump-dir build/corpus/nested-distance \
            | tee build/corpus/nested-distance.txt
          grep -q '^NESTED_DISTANCE_CODEC v1$' build/corpus/nested-distance.txt
          grep -q '^NESTED_DISTANCE_CODEC_PASS$' build/corpus/nested-distance.txt
          test "$(grep -c 'model=pattern_phase ' build/corpus/nested-distance.txt)" = 3

      - name: Stable nested co-design solver
        run: |
          set -euo pipefail
          python3 tools/solve_nested_distance_codec.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --angle 0 --iterations 2 --patience 1 \
            --proposal-limit 12 --near-budget 192 --near-lambda 4 \
            --escape-probes 1 --escape-steps 6 \
            --status-every 3 \
            --status-json build/corpus/nested-solver-status.json \
            --trace-ndjson build/corpus/nested-solver-trace.ndjson \
            --dump-dir build/corpus/nested-solver \
            | tee build/corpus/nested-solver.txt
          grep -q '^NESTED_DISTANCE_SOLVER_PASS$' build/corpus/nested-solver.txt
          grep -q '^NESTED_DISTANCE_SOLVER_SUMMARY ' build/corpus/nested-solver.txt
          test -s build/corpus/nested-solver-status.json
          test -s build/corpus/nested-solver-trace.ndjson

      - name: Rate-distortion sweep
        run: |
          set -euo pipefail
          python3 tools/sweep_nested_distance_codec.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --angles 0,64,128,192 \
            --budgets 0,64,128,192,320 \
            --iterations 2 --patience 1 \
            --proposal-limit 12 --escape-probes 1 --escape-steps 4 \
            --summary-json build/corpus/nested-rd-summary.json \
            --table-tsv build/corpus/nested-rd-table.tsv \
            --trace-dir build/corpus/nested-rd-traces \
            | tee build/corpus/nested-rd.txt
          grep -q '^RD_SWEEP_PASS$' build/corpus/nested-rd.txt
          grep -q '^RD_SWEEP_SUMMARY ' build/corpus/nested-rd.txt
          test -s build/corpus/nested-rd-summary.json
          test -s build/corpus/nested-rd-table.tsv
          test "$(grep -c '^RD_SWEEP_RESULT ' build/corpus/nested-rd.txt)" = 20

      - name: Resident LOD dictionary microscope
        run: |
          set -euo pipefail
          python3 tools/analyze_resident_lod_dictionary.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --angles 0,64,128,192 --additions 32 \
            --checkpoints 0,4,8,16,32 \
            --summary-json build/corpus/resident-lod-dictionary.json \
            | tee build/corpus/resident-lod-dictionary.txt
          grep -q '^RESIDENT_LOD_DICTIONARY_PASS$' build/corpus/resident-lod-dictionary.txt
          grep -q '^RESIDENT_LOD_DICTIONARY_SUMMARY ' build/corpus/resident-lod-dictionary.txt
          test "$(grep -c '^RESIDENT_LOD_DICTIONARY_RESULT ' build/corpus/resident-lod-dictionary.txt)" = 4
          test -s build/corpus/resident-lod-dictionary.json

      - name: Learned resident LOD dictionary
        run: |
          set -euo pipefail
          python3 tools/analyze_resident_lod_learning.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --angles 0,64,128,192 --additions 4,8,16,32 \
            --lloyd-iterations 4 \
            --summary-json build/corpus/learned-resident-lod.json \
            | tee build/corpus/learned-resident-lod.txt
          grep -q '^LEARNED_RESIDENT_LOD_PASS$' build/corpus/learned-resident-lod.txt
          grep -q '^LEARNED_RESIDENT_LOD_SUMMARY ' build/corpus/learned-resident-lod.txt
          test "$(grep -c '^LEARNED_RESIDENT_LOD_RESULT ' build/corpus/learned-resident-lod.txt)" = 4
          test -s build/corpus/learned-resident-lod.json

      - name: Report card
        run: |
          set -euo pipefail
          build/corpus/corpus-analyze \
            build/corpus/host/doomguy_dense_corpus.dhc \
            | tee build/corpus/report.txt
          # Four bands times five predictors, on adjacent steps and on both
          # anchor placements. If a predictor stops being measured the report
          # is no longer a comparison.
          test "$(grep -c ' adjacent mask_pct_mean=' build/corpus/report.txt)" = 20
          test "$(grep -c 'placement=greedy' build/corpus/report.txt)" = 220
          test "$(grep -c 'placement=uniform' build/corpus/report.txt)" = 220
          # The farthest band must still rotate inside one VBlank's worth of
          # pattern uploads; that is the headroom the playable ROM depends on.
          grep -q '^band=3 adjacent_step .* steps_over_vblank_budget=0/256 ' \
            build/corpus/report.txt

      - name: Contact sheets
        run: |
          set -euo pipefail
          python3 tools/render_dense_corpus_sheets.py \
            build/corpus/host/doomguy_dense_corpus.dhc build/corpus/sheets

      - uses: actions/upload-artifact@v4
        with:
          name: hero-dense-corpus
          path: |
            build/corpus/bake.txt
            build/corpus/read.txt
            build/corpus/report.txt
            build/corpus/nested-distance.txt
            build/corpus/nested-distance/**
            build/corpus/nested-solver.txt
            build/corpus/nested-solver-status.json
            build/corpus/nested-solver-trace.ndjson
            build/corpus/nested-solver/**
            build/corpus/nested-rd.txt
            build/corpus/nested-rd-summary.json
            build/corpus/nested-rd-table.tsv
            build/corpus/nested-rd-traces/**
            build/corpus/resident-lod-dictionary.txt
            build/corpus/resident-lod-dictionary.json
            build/corpus/learned-resident-lod.txt
            build/corpus/learned-resident-lod.json
            build/corpus/sheets/**
            build/corpus/normalized/**
            build/corpus/host/doomguy_dense_corpus_manifest.txt
            build/corpus/host/corpus-*.ppm
          if-no-files-found: error
