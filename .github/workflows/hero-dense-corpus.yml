name: Hero dense view corpus

on:
  push:
    branches:
      - temp/hero-codec-v1-contrast-anchor-lab
      - temp/hero-codec-v2-dense-corpus
      - feature/gg-hero-view-codec-v1-continued
    paths:
      - ".github/workflows/hero-dense-corpus.yml"
      - "tools/room_bundle_poc_gen.c"
      - "tools/polar_baked_composite.*"
      - "tools/room_mesh_bake.*"
      - "tools/hero_corpus_analyze.c"
      - "tools/analyze_doomguy_dense_corpus.py"
      - "tools/render_dense_corpus_sheets.py"
      - "tools/glb_rmb/**"
      - "tests/test_dense_corpus_reader.py"
  workflow_dispatch:

jobs:
  dense-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ASSET: assets/gg-hero/FullDoomguyclassic-single-notex.glb
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: |
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Import Doomguy
        run: |
          set -euo pipefail
          mkdir -p build/corpus/host tools/generated
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --height 19 --up z \
            --visual-tris 5200 --shadow-tris 200 --recess-radius 0.5 \
            | tee build/corpus/IMPORT.json

      - name: Reader unit tests
        run: python3 -m unittest discover -s tests -p 'test_dense_corpus_reader.py' -v

      - name: Warning-clean host build
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/corpus/corpus-bake
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -Itools \
            tools/hero_corpus_analyze.c -lm -o build/corpus/corpus-analyze

      - name: Sanitized corpus slice
        run: |
          set -euo pipefail
          cc -std=c99 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/corpus/corpus-bake-sanitized
          cc -std=c99 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Itools \
            tools/hero_corpus_analyze.c -lm -o build/corpus/corpus-analyze-sanitized
          mkdir -p build/corpus/slice
          # LeakSanitizer cannot inspect /proc on the hosted runner. Address and
          # undefined-behaviour checks remain enabled and halt on first error.
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1
          ROOM_BUNDLE_HERO_CORPUS=1 HERO_CORPUS_ANGLES=32 \
          HERO_CORPUS_BANDS=24,36 HERO_CORPUS_PREVIEW_EVERY=0 \
            build/corpus/corpus-bake-sanitized build/corpus/slice \
            | tee build/corpus/slice-bake.txt
          grep -q '^DOOM_DENSE_CORPUS_PASS samples=64 angles=32 bands=2 ' \
            build/corpus/slice-bake.txt
          build/corpus/corpus-analyze-sanitized \
            build/corpus/slice/doomguy_dense_corpus.dhc > /dev/null

      - name: Bake the dense corpus
        run: |
          set -euo pipefail
          ROOM_BUNDLE_HERO_CORPUS=1 HERO_CORPUS_PREVIEW_EVERY=32 \
            build/corpus/corpus-bake build/corpus/host \
            | tee build/corpus/bake.txt
          grep -q '^DOOM_DENSE_CORPUS_PASS samples=1024 angles=256 bands=4 ' \
            build/corpus/bake.txt

      - name: Structural read
        run: |
          set -euo pipefail
          python3 tools/analyze_doomguy_dense_corpus.py \
            build/corpus/host/doomguy_dense_corpus.dhc \
            --dump-dir build/corpus/normalized --dump-every 32 \
            | tee build/corpus/read.txt
          # The reader raises if a band's placement anchor is not constant,
          # which is the guarantee every downstream error figure rests on.
          grep -q 'angular_step_deg=1.4062' build/corpus/read.txt
          test "$(grep -c '^band=' build/corpus/read.txt)" = 4

      - name: Report card
        run: |
          set -euo pipefail
          build/corpus/corpus-analyze \
            build/corpus/host/doomguy_dense_corpus.dhc \
            | tee build/corpus/report.txt
          # Four bands times five predictors, on adjacent steps and on both
          # anchor placements. If a predictor stops being measured the report
          # is no longer a comparison.
          test "$(grep -c ' adjacent mask_pct_mean=' build/corpus/report.txt)" = 20
          test "$(grep -c 'placement=greedy' build/corpus/report.txt)" = 220
          test "$(grep -c 'placement=uniform' build/corpus/report.txt)" = 220
          # The farthest band must still rotate inside one VBlank's worth of
          # pattern uploads; that is the headroom the playable ROM depends on.
          grep -q '^band=3 adjacent_step .* steps_over_vblank_budget=0/256 ' \
            build/corpus/report.txt

      - name: Contact sheets
        run: |
          set -euo pipefail
          python3 tools/render_dense_corpus_sheets.py \
            build/corpus/host/doomguy_dense_corpus.dhc build/corpus/sheets

      - uses: actions/upload-artifact@v4
        with:
          name: hero-dense-corpus
          path: |
            build/corpus/bake.txt
            build/corpus/read.txt
            build/corpus/report.txt
            build/corpus/sheets/**
            build/corpus/normalized/**
            build/corpus/host/doomguy_dense_corpus_manifest.txt
            build/corpus/host/corpus-*.ppm
          if-no-files-found: error
