name: Normal seam lighting + giant bonsai proof

on:
  push:
    branches: [experiment/gg-normal-seam-lighting]
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOOMGUY: assets/gg-hero/FullDoomguyclassic-single-notex.glb
      BONSAI: assets/gg-hero/Purple-Prism-single-notex.glb
      GG_UPLOAD_CEILING: 48
    steps:
      - uses: actions/checkout@v4

      - name: Install GLB tooling
        run: cd tools/glb_rmb && npm install --no-audit --no-fund

      - name: Find highest-detail safe 135-percent Doomguy shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/normal-seam tools/generated
          summary=build/normal-seam/VISUAL-BASELINE.tsv
          printf "visual_target\tactual_visual\tbudget_0to1\tbudget_1to0\tmax_budget\tchanged_0to1\tchanged_1to0\tpatch_0to1\tpatch_1to0\ttileloads_0to1\ttileloads_1to0\n" > "$summary"
          for target in 5200 4600 4000 3400 2800 2200; do
            out="build/normal-seam/base-v$target"; mkdir -p "$out"
            node tools/glb_rmb/convert.mjs "$DOOMGUY" tools/generated/doomguy_mesh.inc \
              --name doomguy --height 19 --up z --visual-tris "$target" --lighting-tris 8 --shadow-tris 200 \
              > "$out/import.json"
            actual=$(node -e "const j=require('./$out/import.json');console.log(j.visual.triangles)")
            cc -std=c99 -O2 -Wall -Wextra -Wpedantic \
              -DROOM_BUNDLE_DOOMGUY_GENERATED -DROOM_BUNDLE_DOOMGUY_SHADE_LEVELS=1 -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=0 \
              -Isrc -Itools tools/room_bundle_poc_gen.c tools/polar_baked_composite.c tools/room_mesh_bake.c -lm -o "$out/gen"
            ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=255 "$out/gen" "$out"
            m="$out/room_bundle_poc_manifest.txt"; a=$(grep '^bundle=11 route=0->1 frames=' "$m"); b=$(grep '^bundle=11 route=1->0 frames=' "$m")
            field(){ printf '%s\n' "$1" | tr ' ' '\n' | sed -n "s/^$2=//p"; }
            b01=$(field "$a" scheduled_budget); b10=$(field "$b" scheduled_budget); maxb=$(( b01>b10?b01:b10 ))
            c01=$(field "$a" changed_words); c10=$(field "$b" changed_words)
            p01=$(field "$a" patch_bytes); p10=$(field "$b" patch_bytes)
            t01=$(field "$a" tile_loads); t10=$(field "$b" tile_loads)
            printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" "$target" "$actual" "$b01" "$b10" "$maxb" "$c01" "$c10" "$p01" "$p10" "$t01" "$t10" | tee -a "$summary"
          done
          awk -F '\t' -v cap="$GG_UPLOAD_CEILING" 'NR>1&&$5<=cap{if($2>best){best=$2;line=$0}}END{if(line)print line}' "$summary" > build/normal-seam/SELECTED-VISUAL.tsv
          if [ ! -s build/normal-seam/SELECTED-VISUAL.tsv ]; then
            awk -F '\t' 'NR==2||$5<best{best=$5;line=$0}END{print line}' "$summary" > build/normal-seam/SELECTED-VISUAL.tsv
          fi
          cut -f1 build/normal-seam/SELECTED-VISUAL.tsv > build/normal-seam/SELECTED-VISUAL-TARGET.txt
          cat "$summary"
          echo "selected visual: $(cat build/normal-seam/SELECTED-VISUAL.tsv)"

      - name: Extract source-mesh seams at selected shell density
        shell: bash
        run: |
          set -euo pipefail
          visual=$(cat build/normal-seam/SELECTED-VISUAL-TARGET.txt)
          node tools/glb_rmb/analyze_seams.mjs "$DOOMGUY" tools/generated/doomguy_seams.inc \
            --name doomguy --height 19 --up z --visual-tris "$visual" --shadow-tris 200 \
            --max-components 12 --model-scale 1.35 --model-offset 78,24,3 --light-world 62,-96,18 \
            | tee build/normal-seam/DOOMGUY-SEAMS.json
          node tools/glb_rmb/analyze_seams.mjs "$BONSAI" tools/generated/bonsai_seams.inc \
            --name bonsai --height 64 --up y --visual-tris 5200 --shadow-tris 2500 \
            --max-components 12 --model-scale 1 --model-offset 78,24,0 --light-world 78,24,78 \
            | tee build/normal-seam/BONSAI-SEAMS.json

      - name: Batch lighting versus seam competition
        shell: bash
        run: |
          set -euo pipefail
          visual=$(cat build/normal-seam/SELECTED-VISUAL-TARGET.txt)
          summary=build/normal-seam/SWEEP.tsv
          printf "lighting_target\tactual_lighting\tseam_components\tbudget_0to1\tbudget_1to0\tmax_budget\tchanged_0to1\tchanged_1to0\tpatch_0to1\tpatch_1to0\ttileloads_0to1\ttileloads_1to0\n" > "$summary"
          for lighting in 0 8 12 20; do
            genlight=$lighting; if [ "$genlight" -eq 0 ]; then genlight=8; fi
            node tools/glb_rmb/convert.mjs "$DOOMGUY" tools/generated/doomguy_mesh.inc \
              --name doomguy --height 19 --up z --visual-tris "$visual" --lighting-tris "$genlight" --shadow-tris 200 \
              > "build/normal-seam/import-l$lighting.json"
            actual=$(node -e "const j=require('./build/normal-seam/import-l$lighting.json');console.log(j.lighting.triangles)")
            for seams in 0 1 2 4; do
              out="build/normal-seam/l$lighting-s$seams"; mkdir -p "$out"
              defs="-DROOM_BUNDLE_DOOMGUY_GENERATED -DROOM_BUNDLE_DOOMGUY_SHADE_LEVELS=1 -DROOM_BUNDLE_DOOMGUY_SEAMS -DROOM_BUNDLE_DOOMGUY_SEAM_COMPONENTS=$seams"
              if [ "$lighting" -eq 0 ]; then defs="$defs -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=0"; else defs="$defs -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=1"; fi
              cc -std=c99 -O2 -Wall -Wextra -Wpedantic $defs -Isrc -Itools \
                tools/room_bundle_poc_gen.c tools/polar_baked_composite.c tools/room_mesh_bake.c -lm -o "$out/gen"
              ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=255 "$out/gen" "$out"
              m="$out/room_bundle_poc_manifest.txt"; a=$(grep '^bundle=11 route=0->1 frames=' "$m"); b=$(grep '^bundle=11 route=1->0 frames=' "$m")
              field(){ printf '%s\n' "$1" | tr ' ' '\n' | sed -n "s/^$2=//p"; }
              b01=$(field "$a" scheduled_budget); b10=$(field "$b" scheduled_budget); maxb=$(( b01>b10?b01:b10 ))
              c01=$(field "$a" changed_words); c10=$(field "$b" changed_words)
              p01=$(field "$a" patch_bytes); p10=$(field "$b" patch_bytes)
              t01=$(field "$a" tile_loads); t10=$(field "$b" tile_loads)
              printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" "$lighting" "$actual" "$seams" "$b01" "$b10" "$maxb" "$c01" "$c10" "$p01" "$p10" "$t01" "$t10" | tee -a "$summary"
            done
          done
          # Select two numerical extremes under the real cap. If none survive,
          # still choose the lowest-budget row so media/proof is never skipped.
          awk -F '\t' -v cap="$GG_UPLOAD_CEILING" 'NR>1&&$6<=cap{if($3>bs||($3==bs&&$2>bl)){bs=$3;bl=$2;line=$0}}END{if(line)print line}' "$summary" > build/normal-seam/SELECTED-SEAMS.tsv
          awk -F '\t' -v cap="$GG_UPLOAD_CEILING" 'NR>1&&$6<=cap{if($2>bl||($2==bl&&$3>bs)){bl=$2;bs=$3;line=$0}}END{if(line)print line}' "$summary" > build/normal-seam/SELECTED-LIGHTING.tsv
          # Fixed 135% art scale currently pushes even the flat control
          # slightly above 48. If no strict-cap winner exists, still capture
          # useful representatives instead of two identical flat controls:
          # seam-heavy = most seams within +1 upload of the flat minimum;
          # light-heavy = cheapest positive lighting proxy.
          if [ ! -s build/normal-seam/SELECTED-SEAMS.tsv ]; then
            base=$(awk -F '\t' 'NR>1&&$1==0&&$3==0{print $6;exit}' "$summary")
            awk -F '\t' -v lim=$((base+1)) 'NR>1&&$1==0&&$6<=lim{if($3>best){best=$3;line=$0}}END{if(line)print line}' "$summary" > build/normal-seam/SELECTED-SEAMS.tsv
          fi
          if [ ! -s build/normal-seam/SELECTED-LIGHTING.tsv ]; then
            awk -F '\t' 'NR>1&&$1>0{if(!line||$6<best||($6==best&&$2>bl)){best=$6;bl=$2;line=$0}}END{if(line)print line}' "$summary" > build/normal-seam/SELECTED-LIGHTING.tsv
          fi
          cat "$summary"
          echo "seam-heavy: $(cat build/normal-seam/SELECTED-SEAMS.tsv)"
          echo "light-heavy: $(cat build/normal-seam/SELECTED-LIGHTING.tsv)"

      - name: Capture two Doomguy representatives
        shell: bash
        run: |
          set -euo pipefail
          visual=$(cat build/normal-seam/SELECTED-VISUAL-TARGET.txt)
          for kind in SEAMS LIGHTING; do
            line=$(cat "build/normal-seam/SELECTED-$kind.tsv"); lighting=$(printf '%s\n' "$line"|cut -f1); seams=$(printf '%s\n' "$line"|cut -f3)
            genlight=$lighting; if [ "$genlight" -eq 0 ]; then genlight=8; fi
            node tools/glb_rmb/convert.mjs "$DOOMGUY" tools/generated/doomguy_mesh.inc --name doomguy --height 19 --up z --visual-tris "$visual" --lighting-tris "$genlight" --shadow-tris 200 >/tmp/import.json
            lowkind=$(printf '%s' "$kind"|tr '[:upper:]' '[:lower:]'); out="build/normal-seam/proof-doomguy-$lowkind"; mkdir -p "$out"
            defs="-DROOM_BUNDLE_DOOMGUY_GENERATED -DROOM_BUNDLE_DOOMGUY_SHADE_LEVELS=1 -DROOM_BUNDLE_DOOMGUY_SEAMS -DROOM_BUNDLE_DOOMGUY_SEAM_COMPONENTS=$seams"
            if [ "$lighting" -eq 0 ]; then defs="$defs -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=0"; else defs="$defs -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=1"; fi
            cc -std=c99 -O2 -Wall -Wextra -Wpedantic $defs -Isrc -Itools tools/room_bundle_poc_gen.c tools/polar_baked_composite.c tools/room_mesh_bake.c -lm -o "$out/gen"
            ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=255 ROOM_BUNDLE_CAPTURE_REVIEW=1 "$out/gen" "$out"
          done

      - name: Bake giant bonsai from selected Doomguy settings
        shell: bash
        run: |
          set -euo pipefail
          line=$(cat build/normal-seam/SELECTED-SEAMS.tsv); lighting=$(printf '%s\n' "$line"|cut -f1); seams=$(printf '%s\n' "$line"|cut -f3)
          genlight=$lighting; if [ "$genlight" -eq 0 ]; then genlight=8; fi
          node tools/glb_rmb/convert.mjs "$BONSAI" tools/generated/bonsai_mesh.inc --name bonsai --height 64 --up y --visual-tris 5200 --lighting-tris "$genlight" --shadow-tris 2500 > build/normal-seam/BONSAI-IMPORT.json
          out=build/normal-seam/proof-bonsai; mkdir -p "$out"
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -DROOM_BUNDLE_BONSAI_GENERATED -DROOM_BUNDLE_BONSAI_SEAMS -DROOM_BUNDLE_BONSAI_SEAM_COMPONENTS=$seams \
            -Isrc -Itools tools/room_bundle_poc_gen.c tools/polar_baked_composite.c tools/room_mesh_bake.c -lm -o "$out/gen"
          ROOM_BUNDLE_ONLY=12 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=255 ROOM_BUNDLE_CAPTURE_REVIEW=1 "$out/gen" "$out"

      - name: Install video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Encode proof media
        shell: bash
        run: |
          set -euo pipefail
          for d in build/normal-seam/proof-doomguy-seams build/normal-seam/proof-doomguy-lighting; do
            ffmpeg -y -framerate 30 -i "$d/review-doomguy-detail-%03d.ppm" -c:v libx264 -pix_fmt yuv420p "$d/detail.mp4"
            ffmpeg -y -i "$d/review-doomguy-detail-060.ppm" "$d/detail-mid.png"
          done
          d=build/normal-seam/proof-bonsai
          ffmpeg -y -framerate 30 -i "$d/review-bonsai-detail-%03d.ppm" -c:v libx264 -pix_fmt yuv420p "$d/detail.mp4"
          ffmpeg -y -i "$d/review-bonsai-detail-030.ppm" "$d/base-close.png"
          ffmpeg -y -i "$d/review-bonsai-detail-090.ppm" "$d/outer-orbit.png"

      - name: Upload numerical + visual proof
        uses: actions/upload-artifact@v4
        with:
          name: normal-seam-lighting-and-bonsai-proof
          path: |
            build/normal-seam/*.tsv
            build/normal-seam/*.txt
            build/normal-seam/*SEAMS.json
            build/normal-seam/BONSAI-IMPORT.json
            build/normal-seam/proof-doomguy-seams/*.png
            build/normal-seam/proof-doomguy-seams/*.mp4
            build/normal-seam/proof-doomguy-seams/room_bundle_poc_manifest.txt
            build/normal-seam/proof-doomguy-lighting/*.png
            build/normal-seam/proof-doomguy-lighting/*.mp4
            build/normal-seam/proof-doomguy-lighting/room_bundle_poc_manifest.txt
            build/normal-seam/proof-bonsai/*.png
            build/normal-seam/proof-bonsai/*.mp4
            build/normal-seam/proof-bonsai/room_bundle_poc_manifest.txt
