name: Hero flat sprite LOD lit-room ROM

on:
  push:
    branches:
      - temp/hero-nested-distance-codec-lab
      - temp/hero-lod-shape-objective
      - temp/doomguy-material-form-v2
    paths:
      - ".github/workflows/hero-sprite-lod-flat-room-proof.yml"
      - "src/main_hero_sprite_lod_flat_room_gg.c"
      - "tools/glb_rmb/palette.mjs"
      - "tools/glb_rmb/gg_palette_design.mjs"
      - "tools/build_hierarchical_sprite_lod_pack.py"
      - "tools/analyze_hierarchical_sprite_lod.py"
      - "tools/resident_tile_dictionary.py"
      - "tools/resident_tile_lloyd.py"
      - "tools/shared_resident_lod.py"
  workflow_dispatch:

jobs:
  rom-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # The one asset in the repo that carries a base-colour texture, and
      # therefore the only one a material palette can be derived from. Both
      # ROMs are built from it so the coloured one is the actual object rather
      # than someone else's palette on a different mesh.
      ASSET: assets/gg-hero/hunyuan_diorama_vertical_112-optimized.glb
      FAMILIES: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: |
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Import Doomguy
        run: |
          set -euo pipefail
          mkdir -p build/hero-room-flat/hero-host build/hero-room-flat/room-host \
                   build/hero-room-flat/generated-hero \
                   build/hero-room-flat/generated-hero-colour \
                   build/hero-room-flat/generated-room tools/generated
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --up y --height 12.2 \
            --visual-tris 5200 --shadow-tris 200 --recess-radius 0.5 \
            --hue-families "$FAMILIES" \
            > build/hero-room-flat/import.json

      - name: Bake hero oracle corpus and flat runtime pack
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/hero-room-flat/hero-bake
          ROOM_BUNDLE_HERO_CORPUS=1 \
          HERO_CORPUS_ANGLES=32 \
          HERO_CORPUS_BANDS=24,28,32,36 \
          HERO_CORPUS_PREVIEW_EVERY=0 \
            build/hero-room-flat/hero-bake build/hero-room-flat/hero-host \
            | tee build/hero-room-flat/hero-bake.txt

          # Two vocabularies from the SAME corpus. The greyscale one encodes a
          # hero pixel as the compositor's semantic code; the colour one as
          # 1 + material*5 + position on the brightness ramp, which is what a
          # three-material palette needs.
          #
          # 192 patterns is the largest shared vocabulary this VRAM layout can
          # hold either way: sprite tile id N reads unified pattern tile 256+N,
          # and the name table begins at unified tile 448.
          #
          # Unlike single-hue colour, this is NOT free: a second material is
          # new per-pixel information and the vocabulary has to carry it. What
          # is unchanged is the budget -- both are 192 patterns and 6144 bytes,
          # the same VRAM and the same 32 bytes per tile upload. The cost is
          # paid in reconstruction accuracy, measured in the colour-palette
          # workflow, not in bandwidth.
          python3 tools/build_hierarchical_sprite_lod_pack.py \
            build/hero-room-flat/hero-host/doomguy_dense_corpus.dhc \
            build/hero-room-flat/generated-hero \
            --mode flat --angles 32 --flat-patterns 192 \
            | tee build/hero-room-flat/hero-pack.txt
          grep -q '^HERO_SPRITE_LOD_PACK_PASS$' build/hero-room-flat/hero-pack.txt
          python3 tools/build_hierarchical_sprite_lod_pack.py \
            build/hero-room-flat/hero-host/doomguy_dense_corpus.dhc \
            build/hero-room-flat/generated-hero-colour \
            --mode flat --angles 32 --flat-patterns 192 \
            --families "$FAMILIES" \
            | tee build/hero-room-flat/hero-pack-colour.txt
          grep -q '^HERO_SPRITE_LOD_PACK_PASS$' build/hero-room-flat/hero-pack-colour.txt
          python3 - <<'PY'
          import json
          grey = json.load(open(
              "build/hero-room-flat/generated-hero/hero_sprite_lod_pack.json"))
          col = json.load(open(
              "build/hero-room-flat/generated-hero-colour/hero_sprite_lod_pack.json"))
          for r in (grey, col):
              assert r["flat_patterns"] == 192, r
              assert r["room_background_tile_limit"] == 256, r
          # Same VRAM, same upload bandwidth, different content.
          assert grey["pattern_bytes"] == col["pattern_bytes"] == 6144, (grey, col)
          print("grey mean cost %.1f, colour mean cost %.1f, both 192 patterns "
                "/ %d bytes" % (grey["midfar_mean_cost"], col["midfar_mean_cost"],
                                grey["pattern_bytes"]))
          PY

      - name: Bake lit room with 192 hero patterns reserved
        run: |
          set -euo pipefail
          sed 's/static uint16_t g_hw_tile_limit=HW_TILES;/static uint16_t g_hw_tile_limit=256u;/' \
            tools/polar_baked_composite.c \
            > build/hero-room-flat/polar_baked_composite_256.c
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -Isrc -Itools \
            build/hero-room-flat/polar_baked_composite_256.c \
            tools/room_mesh_bake.c tools/room_bundle_poc_gen.c \
            -lm -o build/hero-room-flat/room-bake
          ROOM_BUNDLE_ONLY=0 \
            build/hero-room-flat/room-bake build/hero-room-flat/room-host \
            | tee build/hero-room-flat/room-bake.txt
          # Even reserving 192 hero patterns the room must stay well below the
          # roughly 48-pattern/VBlank ceiling (measured scheduled_peak=33).
          ! grep -qE 'scheduled_peak=(4[89]|[5-9][0-9]|[0-9]{3,})' \
            build/hero-room-flat/room-bake.txt
          python3 tools/room_bundle_pack_to_c.py \
            build/hero-room-flat/room-host/room_bundle_poc.pack \
            build/hero-room-flat/room-host/room_bundle_poc_canonical.bin \
            build/hero-room-flat/generated-room \
            | tee build/hero-room-flat/room-cgen.txt

      - name: Solve the colour palette
        run: |
          set -euo pipefail
          # Derived from the same import the meshes came from, so the palette
          # and the pack agree on what family each index means.
          node tools/glb_rmb/gg_palette_design.mjs \
            tools/generated/doomguy_mesh_palette.json \
            build/hero-room-flat/generated-hero-colour/generated/hero_colour_palette \
            | tee build/hero-room-flat/palette.json

      - name: Install GBDK 4.5.0
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo 'd7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz' | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Build Game Gear proof ROM
        run: |
          set -euo pipefail
          LCC="$PWD/.toolchain/gbdk/bin/lcc"
          HGEN="$PWD/build/hero-room-flat/generated-hero"
          CGEN="$PWD/build/hero-room-flat/generated-hero-colour"
          RGEN="$PWD/build/hero-room-flat/generated-room"
          FLAGS=(-mz80:gg -debug -autobank -Wb-ext=.rel -Wl-j -Wm-yo256 \
                 -Isrc -I"$HGEN" -I"$RGEN")
          OBJS=()

          "$LCC" "${FLAGS[@]}" -c -o build/hero-room-flat/main.o \
            src/main_hero_sprite_lod_flat_room_gg.c
          "$LCC" "${FLAGS[@]}" -c -o build/hero-room-flat/ntstate.o \
            src/tilesector_polar_ntstate_gg.s
          "$LCC" "${FLAGS[@]}" -c -o build/hero-room-flat/ntupload.o \
            src/tilesector_polar_ntupload_raw_gg.s
          "$LCC" "${FLAGS[@]}" -c -o build/hero-room-flat/hero-pack.o \
            "$HGEN/hero_sprite_lod_pack.c"
          "$LCC" "${FLAGS[@]}" -c -o build/hero-room-flat/room-dispatch.o \
            "$RGEN/room_bundle_poc_dispatch.c"
          OBJS+=(build/hero-room-flat/main.o build/hero-room-flat/ntstate.o \
                 build/hero-room-flat/ntupload.o build/hero-room-flat/hero-pack.o \
                 build/hero-room-flat/room-dispatch.o)

          for src in "$RGEN"/room_bundle_poc_data_bank*.c; do
            base="$(basename "${src%.c}")"
            obj="build/hero-room-flat/${base}.o"
            "$LCC" "${FLAGS[@]}" -c -o "$obj" "$src"
            OBJS+=("$obj")
          done

          "$LCC" "${FLAGS[@]}" -Wm-yS \
            -o build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.gg \
            "${OBJS[@]}"
          wc -c build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.gg \
            | tee build/hero-room-flat/ROM-size.txt

          # Second ROM: three materials plus the temporal palette interleave.
          # main.o and the hero vocabulary are rebuilt (the vocabulary now
          # encodes material as well as shade); the room dispatch and every
          # room data bank are the SAME object files linked into both ROMs, so
          # the room is provably untouched by any of this.
          "$LCC" "${FLAGS[@]}" -I"$CGEN" -DHERO_COLOUR_PALETTE=1 \
            -DHERO_COLOUR_INTERLEAVE=1 \
            -c -o build/hero-room-flat/main-colour.o \
            src/main_hero_sprite_lod_flat_room_gg.c
          "$LCC" "${FLAGS[@]}" -I"$CGEN" -c \
            -o build/hero-room-flat/hero-pack-colour.o \
            "$CGEN/hero_sprite_lod_pack.c"
          # Built explicitly rather than by substituting into OBJS: the two
          # ROMs differ in exactly two objects and saying which ones outright
          # is what makes "the room is the same object files" checkable.
          COLOUR_OBJS=(build/hero-room-flat/main-colour.o
                       build/hero-room-flat/ntstate.o
                       build/hero-room-flat/ntupload.o
                       build/hero-room-flat/hero-pack-colour.o
                       build/hero-room-flat/room-dispatch.o
                       "${OBJS[@]:5}")
          "$LCC" "${FLAGS[@]}" -Wm-yS \
            -o build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room-Colour.gg \
            "${COLOUR_OBJS[@]}"
          wc -c build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room-Colour.gg \
            | tee -a build/hero-room-flat/ROM-size.txt
          python3 - <<'PY'
          import pathlib
          grey = pathlib.Path("build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.gg").stat().st_size
          col = pathlib.Path("build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room-Colour.gg").stat().st_size
          # Both ROMs carry a 192-pattern hero vocabulary and six palette
          # tables against two; bank padding makes this a bound rather than an
          # equality. What matters is that three materials did not change the
          # SIZE of anything -- the vocabulary is the same 6144 bytes, it just
          # spends them differently.
          print(f"grey ROM {grey} bytes, colour+interleave ROM {col} bytes, "
                f"delta {col-grey}")
          assert col - grey < 4096, (grey, col)
          PY
          sha256sum build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.gg \
            | tee build/hero-room-flat/SHA256.txt

          # NOT _move_sprite: on sms/gg GBDK defines move_sprite as an inline
          # in the platform header rather than as a library function, so it is
          # correctly absent and the original form of this check could never
          # have passed on any branch.
          #
          # The hero pack is checked by PREFIX rather than by exact name. Its
          # entry points are BANKED, and which of them reach the .sym depends
          # on how -autobank placed them -- that placement changes with the
          # size of the generated data, so naming one function makes the check
          # a hostage to the asset. What the check is actually for is that the
          # hero vocabulary linked in at all, and any _hero_lod symbol proves
          # that. The names found are recorded so a future failure says what
          # is there instead of only what is missing.
          SYM=build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.sym
          for sym in _main _set_sprite_4bpp_data; do
            tok="$(awk -v s="$sym" '$2==s{print $1; exit}' "$SYM")"
            test -n "$tok"
            printf '%s %s\n' "$sym" "$tok"
          done | tee build/hero-room-flat/SYMBOLS.txt
          # The .sym is a debugger symbol list and does not necessarily carry
          # every BANKED function; the linker MAP does, with its area, so that
          # is where the hero vocabulary's linkage is asserted.
          MAP=build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.map
          grep -o '_hero_lod[A-Za-z0-9_]*' "$MAP" | sort -u \
            | tee -a build/hero-room-flat/SYMBOLS.txt
          test "$(grep -c '_hero_lod_apply_view' "$MAP")" -ge 1

      - name: Run in Gearsystem and capture orbit
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.9.16 \
            https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"
          mkdir -p build/hero-room-flat/captures
          ROM=build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.gg
          SYM=build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.sym
          CORE=.toolchain/Gearsystem/platforms/libretro/gearsystem_libretro.so
          STATUS="$(awk '$2=="_g_hero_lod_room_status"{split($1,a,":");print a[2];exit}' "$SYM")"
          test -n "$STATUS"
          LIBRETRO_CAPTURE_DIR=build/hero-room-flat/captures \
          LIBRETRO_CAPTURE_EVERY=30 \
            ./build/libretro_runner "$CORE" "$ROM" 480 \
            build/hero-room-flat/final.ppm "$STATUS" 8 \
            | tee build/hero-room-flat/emulator.txt
          test "$(find build/hero-room-flat/captures -name 'frame_*.ppm' | wc -l)" -ge 12
          grep -q 'RAM addr=' build/hero-room-flat/emulator.txt

          # Same run against the colour ROM. This is the only place in the
          # repository where the palette is seen through an actual VDP rather
          # than through the host compositor's preview ramp, so it is what
          # confirms the semantic-index mapping is right end to end -- a table
          # written in enum order instead of brightness order would look
          # obviously scrambled here and nowhere earlier.
          mkdir -p build/hero-room-flat/captures-colour
          CROM=build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room-Colour.gg
          CSYM=build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room-Colour.sym
          CSTATUS="$(awk '$2=="_g_hero_lod_room_status"{split($1,a,":");print a[2];exit}' "$CSYM")"
          test -n "$CSTATUS"
          LIBRETRO_CAPTURE_DIR=build/hero-room-flat/captures-colour \
          LIBRETRO_CAPTURE_EVERY=30 \
            ./build/libretro_runner "$CORE" "$CROM" 480 \
            build/hero-room-flat/final-colour.ppm "$CSTATUS" 8 \
            | tee build/hero-room-flat/emulator-colour.txt
          test "$(find build/hero-room-flat/captures-colour -name 'frame_*.ppm' | wc -l)" -ge 12

          # The colour ROM must actually be in colour. The grey palette is
          # neutral-to-cool by construction (its stops have equal or rising
          # R<G<B), so ANY warm pixel can only have come from the sprite
          # palette this change installs -- and their absence would mean the
          # tables were compiled in but never reached the VDP.
          #
          # The bound is small on purpose. What is being tested is that warm
          # pixels exist and that the grey build has none, and the separation
          # there is total: measured 0.0000 against 0.0355. It is deliberately
          # NOT calibrated from the host renders in
          # docs/experiments/HERO_COLOUR_PALETTE.md, which show a different
          # asset filling much more of the screen (0.3083) -- reusing that
          # number as a threshold was the first version of this check and it
          # failed, correctly, on a picture that was perfectly in colour.
          python3 - <<'PY2'
          import pathlib
          def load(path):
              d = pathlib.Path(path).read_bytes()
              assert d[:2] == b"P6", f"{path}: expected a binary PPM, got {d[:2]!r}"
              vals, pos = [], 2
              while len(vals) < 3:
                  while pos < len(d) and d[pos:pos+1].isspace():
                      pos += 1
                  if d[pos:pos+1] == b"#":
                      while d[pos:pos+1] not in (b"\n", b""):
                          pos += 1
                      continue
                  start = pos
                  while pos < len(d) and not d[pos:pos+1].isspace():
                      pos += 1
                  vals.append(int(d[start:pos]))
              w, h, _ = vals
              return w, h, d[pos+1:pos+1+w*h*3]
          def warm(path):
              w, h, px = load(path)
              n = sum(1 for k in range(0, w*h*3, 3)
                      if px[k] > px[k+1] + 24 and px[k] > px[k+2] + 24)
              return n / (w*h)
          g = warm("build/hero-room-flat/final.ppm")
          c = warm("build/hero-room-flat/final-colour.ppm")
          print(f"warm-pixel fraction: grey ROM {g:.4f}, colour ROM {c:.4f}")
          assert g < 0.01, g
          assert c > 0.01, c
          PY2

      - uses: actions/upload-artifact@v4
        with:
          name: hero-flat-sprite-lod-room-proof
          path: |
            build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.gg
            build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room-Colour.gg
            build/hero-room-flat/ROM-size.txt
            build/hero-room-flat/palette.json
            build/hero-room-flat/generated-hero-colour/generated/hero_colour_palette.inc
            build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.sym
            build/hero-room-flat/GG-Hero-Flat-Sprite-LOD-Room.map
            build/hero-room-flat/hero-pack.txt
            build/hero-room-flat/hero-pack-colour.txt
            build/hero-room-flat/generated-hero/hero_sprite_lod_pack.json
            build/hero-room-flat/generated-hero-colour/hero_sprite_lod_pack.json
            build/hero-room-flat/room-bake.txt
            build/hero-room-flat/ROM-size.txt
            build/hero-room-flat/SHA256.txt
            build/hero-room-flat/SYMBOLS.txt
            build/hero-room-flat/emulator-colour.txt
            build/hero-room-flat/final.ppm
            build/hero-room-flat/final-colour.ppm
            build/hero-room-flat/captures-colour/
            build/hero-room-flat/emulator.txt
            build/hero-room-flat/final.ppm
            build/hero-room-flat/captures/**
          if-no-files-found: error
