name: Hero hierarchical sprite LOD

on:
  push:
    branches:
      - temp/hero-nested-distance-codec-lab
      - temp/hero-lod-shape-objective
    paths:
      - ".github/workflows/hero-hierarchical-sprite-lod-fast.yml"
      - "tools/analyze_hierarchical_sprite_lod.py"
      - "tools/diagnose_lod_shade_metric.py"
      - "tools/resident_tile_dictionary.py"
      - "tools/resident_tile_lloyd.py"
      - "tools/shared_resident_lod.py"
      - "tests/test_shade_rank.py"
  workflow_dispatch:

jobs:
  hierarchical-sprite-lod:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ASSET: assets/gg-hero/FullDoomguyclassic-single-notex.glb
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: |
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Import Doomguy
        run: |
          set -euo pipefail
          mkdir -p build/hier-sprite/host tools/generated
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --height 19 --up z \
            --visual-tris 5200 --shadow-tris 200 --recess-radius 0.5 \
            > build/hier-sprite/import.json

      - name: Bake 32-angle corpus
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/hier-sprite/corpus-bake
          ROOM_BUNDLE_HERO_CORPUS=1 \
          HERO_CORPUS_ANGLES=32 \
          HERO_CORPUS_BANDS=24,28,32,36 \
          HERO_CORPUS_PREVIEW_EVERY=0 \
            build/hier-sprite/corpus-bake build/hier-sprite/host \
            | tee build/hier-sprite/bake.txt

      - name: Train the shared flat vocabulary (shipped policy)
        run: |
          set -euo pipefail
          # 192 is the largest vocabulary this VRAM layout can hold (sprite
          # tile id N reads unified pattern tile 256+N; the name table begins
          # at unified tile 448). --assert-far-silhouette-pct guards against
          # the far view regressing back toward the pre-fix blocky-outline
          # result (measured 17.22% at 16 patterns, 8.64% at 192).
          python3 tools/analyze_hierarchical_sprite_lod.py \
            build/hier-sprite/host/doomguy_dense_corpus.dhc \
            --far-band 3 --mid-band 2 \
            --flat-patterns 64,128,192 --core-patterns 0 \
            --lloyd-iterations 4 \
            --summary-json build/hier-sprite/result.json \
            --assert-far-silhouette-pct 10.0 \
            --assert-resident-bytes-max 6144 \
            | tee build/hier-sprite/result.txt
          grep -q '^HIERARCHICAL_SPRITE_LOD_PASS$' build/hier-sprite/result.txt

      - name: Shade ordering guard
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_shade_rank.py' -v
          python3 -m unittest discover -s tests -p 'test_resident_tile*.py'
          python3 -m unittest discover -s tests -p 'test_shared_resident_lod.py'

      - name: Shade metric regression sheets
        run: |
          set -euo pipefail
          # The corrected ordering must keep gross tonal errors -- three or more
          # ramp stops wrong, which is what reads as speckle -- far below what
          # raw index arithmetic produced. This guards the ordering, and is not
          # a quality target for the codebook itself.
          python3 tools/diagnose_lod_shade_metric.py \
            build/hier-sprite/host/doomguy_dense_corpus.dhc \
            build/hier-sprite/metric \
            --band 3 --patterns 16 --angles 8 \
            --assert-gross-error-ratio 5 \
            | tee build/hier-sprite/metric.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hero-hierarchical-sprite-lod
          path: |
            build/hier-sprite/bake.txt
            build/hier-sprite/result.txt
            build/hier-sprite/result.json
            build/hier-sprite/metric.txt
            build/hier-sprite/metric/**
          if-no-files-found: error
