name: Doomguy hybrid lighting sweep

on:
  push:
    branches:
      - experiment/gg-doomguy-glb-import
    paths:
      - ".github/workflows/doomguy-hybrid-lighting-sweep.yml"
  workflow_dispatch:

jobs:
  hybrid-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASSET: assets/gg-hero/FullDoomguyclassic-single-notex.glb
      VISUAL_TRIS: "5200"
      SHADOW_TRIS: "200"
      GG_UPLOAD_CEILING: "48"
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: |
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Sweep coarse lighting proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/doomguy-hybrid tools/generated
          summary=build/doomguy-hybrid/HYBRID-SWEEP.tsv
          printf "lighting_target\tactual_visual\tactual_lighting\tactual_shadow\tbudget_0to1\tbudget_1to0\tmax_budget\tpatch_0to1\tpatch_1to0\ttileloads_0to1\ttileloads_1to0\n" > "$summary"

          for lighting in 8 12 20 32 48 64 80; do
            out="build/doomguy-hybrid/l${lighting}"
            mkdir -p "$out"
            node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
              --name doomguy --height 19 --up z \
              --visual-tris "$VISUAL_TRIS" \
              --lighting-tris "$lighting" \
              --shadow-tris "$SHADOW_TRIS" \
              | tee "$out/IMPORT.json"

            cc -std=c99 -O2 -Wall -Wextra -Wpedantic \
              -DROOM_BUNDLE_DOOMGUY_GENERATED \
              -DROOM_BUNDLE_DOOMGUY_SHADE_LEVELS=1 \
              -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=1 \
              -Isrc -Itools \
              tools/room_bundle_poc_gen.c tools/polar_baked_composite.c tools/room_mesh_bake.c \
              -lm -o "$out/room_bundle_poc_gen"

            ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_SCHEDULER_MAX_UPLOADS=255 \
              "$out/room_bundle_poc_gen" "$out"

            manifest="$out/room_bundle_poc_manifest.txt"
            line01=$(grep '^bundle=11 route=0->1 frames=' "$manifest")
            line10=$(grep '^bundle=11 route=1->0 frames=' "$manifest")
            field() {
              local line="$1" key="$2"
              printf '%s\n' "$line" | tr ' ' '\n' | sed -n "s/^${key}=//p"
            }
            b01=$(field "$line01" scheduled_budget)
            b10=$(field "$line10" scheduled_budget)
            p01=$(field "$line01" patch_bytes)
            p10=$(field "$line10" patch_bytes)
            t01=$(field "$line01" tile_loads)
            t10=$(field "$line10" tile_loads)
            maxb=$(( b01 > b10 ? b01 : b10 ))
            actual_vis=$(node -e "const j=require('./$out/IMPORT.json'); console.log(j.visual.triangles)")
            actual_light=$(node -e "const j=require('./$out/IMPORT.json'); console.log(j.lighting.triangles)")
            actual_shadow=$(node -e "const j=require('./$out/IMPORT.json'); console.log(j.shadow.triangles)")
            printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" \
              "$lighting" "$actual_vis" "$actual_light" "$actual_shadow" \
              "$b01" "$b10" "$maxb" "$p01" "$p10" "$t01" "$t10" | tee -a "$summary"
          done

          best=$(awk -F '\t' -v cap="$GG_UPLOAD_CEILING" '
            NR>1 && $7<=cap && $1>best {best=$1}
            END{print best+0}
          ' "$summary")
          test "$best" -gt 0
          echo "$best" > build/doomguy-hybrid/SELECTED-LIGHTING.txt
          cat "$summary"

      - name: Capture best hybrid
        shell: bash
        run: |
          set -euo pipefail
          lighting=$(cat build/doomguy-hybrid/SELECTED-LIGHTING.txt)
          out=build/doomguy-hybrid/proof
          mkdir -p "$out"
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --height 19 --up z \
            --visual-tris "$VISUAL_TRIS" \
            --lighting-tris "$lighting" \
            --shadow-tris "$SHADOW_TRIS" \
            | tee "$out/IMPORT.json"

          cc -std=c99 -O2 -Wall -Wextra -Wpedantic \
            -DROOM_BUNDLE_DOOMGUY_GENERATED \
            -DROOM_BUNDLE_DOOMGUY_SHADE_LEVELS=1 \
            -DROOM_BUNDLE_DOOMGUY_LIGHTING_PROXY=1 \
            -Isrc -Itools \
            tools/room_bundle_poc_gen.c tools/polar_baked_composite.c tools/room_mesh_bake.c \
            -lm -o "$out/room_bundle_poc_gen"

          ROOM_BUNDLE_ONLY=11 ROOM_BUNDLE_CAPTURE_REVIEW=1 \
            "$out/room_bundle_poc_gen" "$out"
          grep -q '^doomguy_hero_chamber=PASS$' "$out/room_bundle_poc_manifest.txt"
          grep -q '^independent_bundle_replay=PASS$' "$out/room_bundle_poc_manifest.txt"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Encode proof
        run: |
          out=build/doomguy-hybrid/proof
          ffmpeg -y -loglevel error -framerate 30 \
            -i "$out/review-doomguy-detail-%03d.ppm" \
            -vf "scale=640:576:flags=neighbor" \
            -c:v libx264 -crf 15 -preset medium -pix_fmt yuv420p \
            "$out/doomguy-hybrid-orbit.mp4"
          ffmpeg -y -loglevel error -framerate 30 \
            -i "$out/review-doomguy-proxy-%03d.ppm" \
            -vf "scale=640:576:flags=neighbor" \
            -c:v libx264 -crf 15 -preset medium -pix_fmt yuv420p \
            "$out/doomguy-hybrid-route.mp4"
          for spec in "000 left" "020 quarter-left" "040 oblique-a" "060 frontish" "080 oblique-b" "100 quarter-right" "119 right"; do
            set -- $spec
            ffmpeg -y -loglevel error \
              -i "$out/review-doomguy-detail-$1.ppm" \
              -vf "scale=640:576:flags=neighbor" \
              "$out/doomguy-hybrid-$2.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: doomguy-hybrid-lighting-proof
          path: |
            build/doomguy-hybrid/HYBRID-SWEEP.tsv
            build/doomguy-hybrid/SELECTED-LIGHTING.txt
            build/doomguy-hybrid/proof/*.png
            build/doomguy-hybrid/proof/*.mp4
            build/doomguy-hybrid/proof/IMPORT.json
            build/doomguy-hybrid/proof/room_bundle_poc_manifest.txt
          if-no-files-found: error
          retention-days: 30
