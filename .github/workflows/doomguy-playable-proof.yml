name: Doomguy playable chamber proof

on:
  push:
    branches:
      - experiment/gg-doomguy-playable
    paths:
      - ".github/workflows/doomguy-playable-proof.yml"
      - "tools/room_bundle_poc_gen.c"
      - "tools/polar_baked_composite.*"
      - "tools/room_mesh_bake.*"
      - "tools/glb_rmb/**"
      - "tools/doomguy_playable_pack_to_c.py"
      - "src/main_doomguy_playable_gg.c"
  workflow_dispatch:

jobs:
  playable-rom:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ASSET: assets/gg-hero/FullDoomguyclassic-single-notex.glb
    steps:
      - uses: actions/checkout@v4

      - name: Install mesh tools
        run: |
          cd tools/glb_rmb
          npm install --no-audit --no-fund

      - name: Import Doomguy
        run: |
          set -euo pipefail
          mkdir -p build/playable/host build/playable/generated tools/generated
          node tools/glb_rmb/convert.mjs "$ASSET" tools/generated/doomguy_mesh.inc \
            --name doomguy --height 19 --up z \
            --visual-tris 5200 --shadow-tris 200 --recess-radius 0.5 \
            | tee build/playable/IMPORT.json

      - name: Warning-clean host build
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DROOM_BUNDLE_DOOMGUY_GENERATED -Isrc -Itools \
            tools/polar_baked_composite.c tools/room_mesh_bake.c \
            tools/room_bundle_poc_gen.c -lm -o build/playable/doom-play-bake

      - name: Bake random-access camera lattice
        run: |
          set -euo pipefail
          ROOM_BUNDLE_PLAYABLE=1 \
            build/playable/doom-play-bake build/playable/host \
            | tee build/playable/bake.txt
          grep -q '^DOOM_PLAYABLE_PASS positions=40 states=640 ' build/playable/bake.txt
          grep -q '^random_access_double_buffer=PASS$' \
            build/playable/host/doomguy_playable_manifest.txt
          grep -q '^quality_clearance_grid=PASS$' \
            build/playable/host/doomguy_playable_manifest.txt

      - name: Pack playable states into GBDK banks
        run: |
          set -euo pipefail
          python3 tools/doomguy_playable_pack_to_c.py \
            build/playable/host/doomguy_playable.pack \
            build/playable/generated | tee build/playable/c-gen.txt
          grep -q '^DOOM_PLAYABLE_C_PASS states=640 ' build/playable/c-gen.txt

      - name: Install GBDK 4.5.0
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Build 4 MiB playable ROM
        shell: bash
        run: |
          set -euo pipefail
          LCC="$PWD/.toolchain/gbdk/bin/lcc"
          GEN="$PWD/build/playable/generated"
          OUT="$PWD/build/playable"
          FLAGS=(-mz80:gg -debug -autobank -Wb-ext=.rel -Wl-j -Wm-yo256 -Isrc -I"$GEN")
          OBJS=()

          "$LCC" "${FLAGS[@]}" -c -o "$OUT/main.o" src/main_doomguy_playable_gg.c
          "$LCC" "${FLAGS[@]}" -c -o "$OUT/ntstate.o" src/tilesector_polar_ntstate_gg.s
          "$LCC" "${FLAGS[@]}" -c -o "$OUT/ntupload.o" src/tilesector_polar_ntupload_raw_gg.s
          "$LCC" "${FLAGS[@]}" -c -o "$OUT/dispatch.o" "$GEN/doomguy_playable_dispatch.c"
          OBJS+=("$OUT/main.o" "$OUT/ntstate.o" "$OUT/ntupload.o" "$OUT/dispatch.o")

          for src in "$GEN"/doomguy_playable_dispatch_group*.c; do
            base="$(basename "${src%.c}")"
            "$LCC" "${FLAGS[@]}" -c -o "$OUT/${base}.o" "$src"
            OBJS+=("$OUT/${base}.o")
          done

          for src in "$GEN"/doomguy_playable_bank*.c; do
            base="$(basename "${src%.c}")"
            "$LCC" "${FLAGS[@]}" -c -o "$OUT/${base}.o" "$src"
            OBJS+=("$OUT/${base}.o")
          done

          "$LCC" "${FLAGS[@]}" -Wm-yS -o "$OUT/GG-Doomguy-Playable.gg" "${OBJS[@]}"
          test "$(wc -c < "$OUT/GG-Doomguy-Playable.gg")" -eq 4194304
          sha256sum "$OUT/GG-Doomguy-Playable.gg" | tee "$OUT/SHA256.txt"

          for sym in _main _set_palette _set_bkg_4bpp_data; do
            tok="$(awk -v s="$sym" '$2==s{print $1; exit}' "$OUT/GG-Doomguy-Playable.sym")"
            test -n "$tok"
            test "${tok%%:*}" = "00"
            test $((16#${tok##*:})) -lt $((0x4000))
            printf '%s %s PASS\n' "$sym" "$tok"
          done | tee "$OUT/FIXED-BANK-PASS.txt"

      - name: Build Gearsystem runner
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.9.16 \
            https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"

      - name: Prove boot and D-pad control
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/build/playable"
          CORE=.toolchain/Gearsystem/platforms/libretro/gearsystem_libretro.so
          ROM="$OUT/GG-Doomguy-Playable.gg"
          ACT_ADDR="$(awk '$2=="_g_hero_play_actions"{split($1,a,":"); print a[2]; exit}' "$OUT/GG-Doomguy-Playable.sym")"
          STATE_ADDR="$(awk '$2=="_g_hero_play_state"{split($1,a,":"); print a[2]; exit}' "$OUT/GG-Doomguy-Playable.sym")"
          test -n "$ACT_ADDR"
          test -n "$STATE_ADDR"

          ./build/libretro_runner "$CORE" "$ROM" 150 \
            "$OUT/playable-idle.ppm" "$STATE_ADDR" 2 \
            | tee "$OUT/run-idle.txt"

          # Libretro joypad RIGHT is bit seven. Hold it after boot; the ROM must
          # consume input, advance the exposed action counter, and visibly turn.
          LIBRETRO_JOYPAD_MASK=$((1<<7)) LIBRETRO_JOYPAD_AFTER_FRAME=90 \
            ./build/libretro_runner "$CORE" "$ROM" 240 \
            "$OUT/playable-turn.ppm" "$ACT_ADDR" 2 \
            | tee "$OUT/run-turn.txt"
          grep -q 'data=' "$OUT/run-turn.txt"
          ! grep -q 'data=0000' "$OUT/run-turn.txt"
          ! cmp -s "$OUT/playable-idle.ppm" "$OUT/playable-turn.ppm"

      - uses: actions/upload-artifact@v4
        with:
          name: GG-doomguy-playable
          path: |
            build/playable/GG-Doomguy-Playable.gg
            build/playable/GG-Doomguy-Playable.sym
            build/playable/SHA256.txt
            build/playable/FIXED-BANK-PASS.txt
            build/playable/IMPORT.json
            build/playable/bake.txt
            build/playable/c-gen.txt
            build/playable/host/doomguy_playable_manifest.txt
            build/playable/run-idle.txt
            build/playable/run-turn.txt
            build/playable/playable-idle.ppm
            build/playable/playable-turn.ppm
          if-no-files-found: error
          retention-days: 30
