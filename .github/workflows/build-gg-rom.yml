name: Build GG ROM (manual)

on:
  push:
    branches:
      - experiment/gg-polar-portal-penumbra
      - feature/gg-polar-vertical-stairwell
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rom:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate vertical camera and module grammar
        run: make polar-test

      - name: Build host bake generator
        run: make build/polar_demo_patch_gen

      - name: Generate runtime packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/generated/polar_demo_patch
          mkdir -p build/generated/polar_demo_patch
          POLAR_SKIP_PORTAL_PROBES=1 ./build/polar_demo_patch_gen build/generated/polar_demo_patch point | tee build/manual-rom-bake.txt
          touch build/generated/polar_demo_patch/.stamp

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Build 64-bank Game Gear ROM
        id: build64
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PATCH_PROFILE_HOOKS=0 POLAR_PATCH_ROM_BANKS=64 gg-polar-patch-demo

      - name: Package 64-bank ROM
        if: steps.build64.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/manual-artifact
          cp build/gg-polar-patch-demo.gg build/manual-artifact/GG-Polar-Latest.gg
          cp build/gg-polar-patch-demo.sym build/manual-artifact/GG-Polar-Latest.sym
          printf '64-bank / 1 MiB spec build\n' > build/manual-artifact/BUILD-NOTE.txt

      - name: Build oversize 128-bank diagnostic fallback
        if: steps.build64.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/gg-polar-patch-demo.gg build/gg-polar-patch-demo.sym
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PATCH_PROFILE_HOOKS=0 POLAR_PATCH_ROM_BANKS=128 gg-polar-patch-demo
          mkdir -p build/manual-artifact
          cp build/gg-polar-patch-demo.gg build/manual-artifact/GG-Polar-Latest-OVERSIZE-128bank.gg
          cp build/gg-polar-patch-demo.sym build/manual-artifact/GG-Polar-Latest-OVERSIZE-128bank.sym
          printf 'WARNING: 64-bank / 1 MiB spec build overflowed. This is a 128-bank / 2 MiB diagnostic ROM.\n' > build/manual-artifact/BUILD-NOTE.txt

      - name: Add build metadata
        shell: bash
        run: |
          set -euo pipefail
          ROM="$(find build/manual-artifact -maxdepth 1 -name '*.gg' -print -quit)"
          test -n "$ROM"
          sha256sum "$ROM" | tee build/manual-artifact/SHA256.txt
          wc -c "$ROM" | tee build/manual-artifact/ROM-size.txt
          git rev-parse HEAD | tee build/manual-artifact/COMMIT.txt
          cp build/manual-rom-bake.txt build/manual-artifact/bake-metrics.txt

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: GG-ROM
          path: build/manual-artifact/*
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GG-ROM-build-failure
          path: |
            build/manual-rom-bake.txt
            build/generated/polar_demo_patch/polar_demo_patch_manifest.txt
            build/generated/polar_demo_patch/tile_schedule.csv
          if-no-files-found: ignore
          retention-days: 7
