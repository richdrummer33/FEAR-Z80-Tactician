name: GG TileSector demo

on:
  push:
    branches:
      - feature/gg-tilesector-demo
      - feature/gg-tilesector-visibility-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Host checks
        run: make tilesector-test tilesector-host

      - name: Build Game Gear ROM
        run: |
          make GBDK_HOME="$PWD/.toolchain/gbdk" gg-tilesector
          ls -lh build/gg-tilesector-demo.gg build/gg-tilesector-demo.sym

      - name: Capture generated Z80 assembly
        shell: bash
        run: |
          .toolchain/gbdk/bin/lcc -mz80:gg -debug -autobank -Wb-ext=.rel -Wl-j -Wm-yo4 -Isrc -Wf--opt-code-speed \
            -S -o build/tilesector_core_stage7.s src/tilesector_core.c
          grep -n -A260 -B8 '_raster_surface_column' build/tilesector_core_stage7.s \
            > build/raster_surface_column.asm.txt || true
          ls -lh build/tilesector_core_stage7.s build/raster_surface_column.asm.txt

      - name: Build cycle-aware Gearsystem profiler
        shell: bash
        run: |
          git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"

      - name: Profile emulated Z80 phases
        shell: bash
        run: |
          ./build/tilesector_profile_runner build/gg-tilesector-demo.gg build/gg-tilesector-demo.sym 120 8 | tee build/tilesector-profile.txt
          ./build/gearsystem_core_runner build/gg-tilesector-demo.gg 180 build/gg-tilesector-emulator.ppm | tee build/tilesector-emulator.txt

      - name: Host reference frames
        shell: bash
        run: |
          for f in 0 50 70 90 120 150 180 210 250; do
            ./build/tilesector_preview "$f" "build/tilesector-host-${f}.ppm"
          done

      - name: ROM checksum
        run: sha256sum build/gg-tilesector-demo.gg | tee build/gg-tilesector-demo.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gg-tilesector-demo
          path: |
            build/gg-tilesector-demo.gg
            build/gg-tilesector-demo.sym
            build/gg-tilesector-demo.sha256
            build/tilesector-profile.txt
            build/tilesector-emulator.txt
            build/gg-tilesector-emulator.ppm
            build/tilesector-host-*.ppm
            build/tilesector_core_stage7.s
            build/raster_surface_column.asm.txt
          if-no-files-found: error

# Stage 7 col-plus-context ABI/profile + generated-assembly trigger.
