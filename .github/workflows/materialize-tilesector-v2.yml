name: Materialize TileSector visibility v2

on:
  push:
    branches:
      - feature/gg-tilesector-visibility-v2

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize renderer source
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/.tilesector_core.c.gz.b64
          base64 -d tools/.tilesector_core.c.gz.b64 | gzip -d > src/tilesector_core.c
          rm tools/.tilesector_core.c.gz.b64
          rm .github/workflows/materialize-tilesector-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tilesector_core.c tools/.tilesector_core.c.gz.b64 .github/workflows/materialize-tilesector-v2.yml
          git commit -m "renderer: Q4 portal visibility and continuous edges"
          git push origin HEAD:feature/gg-tilesector-visibility-v2
