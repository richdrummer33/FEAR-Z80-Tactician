name: E1M1 exact-Q4 envelope runtime iteration
# Exact-envelope parity, performance, and renderer-bank budget gate.

on:
  push:
    branches:
      - experiment/e1m1-front-envelope-rom
      - experiment/e1m1-vblank-pipeline
      - experiment/e1m1-shared-corner-anchor
      - experiment/e1m1-subcolumn-corner-height
      - experiment/e1m1-corner-edge-vocabulary
      - experiment/e1m1-p99-steep-edges
    paths:
      - src/main_tilesector_polar_gg.c
      - src/tilesector_polar_renderer.c
      - src/tilesector_polar_materialize_gg.s
      - src/tilesector_polar_ntstate_gg.s
      - src/tilesector_polar_ntupload_profiled_gg.s
      - src/tilesector_polar_ntupload_raw_gg.s
      - src/e1env_center_col_gg.s
      - src/e1m1_edge_vocab.h
      - .github/workflows/e1m1-front-envelope-runtime-iter.yml
      - Makefile
      - experiments/adaptive_polar_field/screen_depth_plane_lut.py
      - tools/e1env_runtime_pack.py
      - tools/e1env_bearing_lut.py
      - tools/e1env_depth_edges_bank.py
      - tools/e1env_local_bearing_field.py
      - tools/e1env_plane_meta.py
      - src/e1env_local_bearing_eval_gg.s
      - tools/frame/frame_timeline.cpp
      - tools/frame/mat_census.cpp
      - tools/build_gearsystem_tools.sh
      - .github/actions/gearsystem-tools/action.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  iterate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore proven exact-Q4 ROM tables and baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=build/e1env-iter
          PRE="$ROOT/prebake"
          GEN="$ROOT/generated"
          mkdir -p "$PRE" "$GEN"
          # Orthogonal-only benchmark oracle (30/30 axis-aligned walls,
          # exact-Q4 stable at every legal player position).
          # GitHub artifact storage occasionally returns a transient 503.
          # Retry the immutable prebake download rather than failing a renderer
          # experiment before compilation even starts.
          for attempt in 1 2 3 4; do
            if gh run download 35501744023 \
              -n GG-E1M1-Exact-Q4-FrontEnvelope \
              -D "$PRE"; then
              break
            fi
            test "$attempt" -lt 4
            sleep $((attempt * 3))
          done
          cp "$PRE/generated/optimized_renderer_map_data.inc" "$GEN/"
          cp "$PRE/generated"/e1env_idx_*.c "$GEN/"
          cp "$PRE/generated"/e1env_prog_*.c "$GEN/"
          cp "$PRE/generated/e1env_generated.h" "$GEN/"
          cp "$PRE/generated/e1env_dispatch.c" "$GEN/"
          cp "$PRE/generated/manifest.txt" "$GEN/"
          cp "$PRE/pvs.gg" "$ROOT/pvs.gg"
          cp "$PRE/pvs.noi" "$ROOT/pvs.noi"
          cp "$PRE/pvs.sym" "$ROOT/pvs.sym"
          cp "$PRE/envelope-bake.txt" "$ROOT/envelope-bake.txt"
          test -f "$GEN/e1env_dispatch.c"
          grep -q 'stable_pct=100.00' "$ROOT/envelope-bake.txt"
          python3 tools/e1env_runtime_pack.py --generated-dir "$GEN" | tee "$ROOT/runtime-pack.txt"
          grep -q 'E1ENV_RUNTIME_PACK' "$ROOT/runtime-pack.txt"
          LAST_BANK="$(awk -F= '$1=="bank_last"{print $2}' "$GEN/manifest.txt")"
          test -n "$LAST_BANK"
          BEARING_BASE=$((LAST_BANK+1))
          DEPTH_BASE=$((BEARING_BASE+8))
          LBF_BASE=$((DEPTH_BASE+2))
          LBF_DISPATCH=$((LBF_BASE+56))
          test "$LBF_DISPATCH" -lt 255
          printf 'envelope_last_bank=%s\nbearing_base=%s\ndepth_base=%s\nlbf_base=%s\nlbf_dispatch=%s\n' \
            "$LAST_BANK" "$BEARING_BASE" "$DEPTH_BASE" "$LBF_BASE" "$LBF_DISPATCH" \
            | tee "$ROOT/perf-bank-plan.txt"
          python3 tools/e1env_bearing_lut.py \
            --map-inc "$GEN/optimized_renderer_map_data.inc" \
            --out-dir "$GEN" --bank-base "$BEARING_BASE" | tee "$ROOT/bearing-lut.txt"
          grep -q 'E1ENV_BEARING_LUT' "$ROOT/bearing-lut.txt"
          python3 tools/e1env_depth_edges_bank.py \
            --map-inc "$GEN/optimized_renderer_map_data.inc" \
            --out-dir "$GEN" --bank-base "$DEPTH_BASE" | tee "$ROOT/depth-edges.txt"
          grep -q 'E1ENV_DEPTH_EDGES' "$ROOT/depth-edges.txt"
          python3 tools/e1env_local_bearing_field.py \
            --map-inc "$GEN/optimized_renderer_map_data.inc" \
            --out-dir "$GEN" --bank-base "$LBF_BASE" --dispatch-bank "$LBF_DISPATCH" \
            --threshold 2 | tee "$ROOT/local-bearing-field.txt"
          grep -q 'E1ENV_LOCAL_BEARING_FIELD' "$ROOT/local-bearing-field.txt"
          python3 tools/e1env_plane_meta.py \
            --map-inc "$GEN/optimized_renderer_map_data.inc" \
            --out "$GEN/e1env_plane_meta.h" | tee "$ROOT/plane-meta.txt"
          grep -q 'E1ENV_PLANE_META' "$ROOT/plane-meta.txt"

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Setup cached Gearsystem tools
        uses: ./.github/actions/gearsystem-tools
      - name: Compile exact-Q4 table objects
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/e1env-iter"
          GEN="$ROOT/generated"
          LCC="$PWD/.toolchain/gbdk/bin/lcc"
          : > "$ROOT/env-objs.txt"
          for src in "$GEN"/e1env_dispatch.c "$GEN"/e1env_idx_*.c "$GEN"/e1env_prog_*.c "$GEN"/e1env_bearing_*.c "$GEN"/e1env_depth_edges_*.c "$GEN"/e1env_local_bearing_dispatch.c; do
            base="$(basename "${src%.c}")"
            obj="$ROOT/${base}.o"
            "$LCC" -mz80:gg -c -Wf--opt-code-speed -I"$GEN" -o "$obj" "$src"
            printf '%s ' "$obj" >> "$ROOT/env-objs.txt"
          done

      - name: Generate identical deterministic trace
        shell: bash
        run: |
          python3 tools/frame/gen_traces.py cruise build/frame_trace.c

      - name: Build fixed envelope helpers
        shell: bash
        run: |
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_ROM_BANKS=256 \
            build/e1env_center_col_gg.o build/e1env_local_bearing_eval_gg.o

      - name: Build focused-envelope ROM
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/e1env-iter"
          GEN="$ROOT/generated"
          ENVOBJS="$(cat "$ROOT/env-objs.txt")"
          rm -f build/main_tilesector_polar_gg.o build/tilesector_polar_motion_gg.o \
            build/tilesector_polar_renderer_gg.o build/tilesector_polar_ntstate_gg.o \
            build/tilesector_polar_materialize_gg.o build/tilesector_polar_ntupload_*_gg.o \
            build/frame_trace_gg.o build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" \
            POLAR_PROFILE_HOOKS=1 POLAR_LOCAL_PROJECTION=0 POLAR_SCREEN_DEPTH_PLANE=0 \
            POLAR_PROJ_GEN_DIR="$GEN" POLAR_ROM_BANKS=256 \
            POLAR_EXTRA_OBJS="build/frame_trace_gg.o build/e1env_center_col_gg.o build/e1env_local_bearing_eval_gg.o $ENVOBJS" \
            TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_OPTIMIZED_MAP=1 -DTSPF_E1M1_FULL_ONLY=1 -DTSPF_E1M1_FRONT_ENVELOPE=1 -DTSPF_E1M1_FRONT_ENVELOPE_EXACT=1 -DTSPF_E1M1_BEARING_LUT=1 -DTSPF_E1M1_DEPTH_EDGE_LUT=1 -DTSPF_E1M1_LOCAL_BEARING_FIELD=1 -DTSPF_E1M1_PLANE_META=1 -DTSPF_E1M1_P99_EDGE_VOCAB=1 -DTSPF_DEFAULT_APPEARANCE=0u -DTSPF_TRACE_INPUT=1" \
            gg-tilesector-polar 2>&1 | tee "$ROOT/build.txt"
          cp build/gg-tilesector-polar.gg "$ROOT/focused.gg"
          cp build/gg-tilesector-polar.noi "$ROOT/focused.noi"
          cp build/gg-tilesector-polar.sym "$ROOT/focused.sym"
          cp build/gg-tilesector-polar.map "$ROOT/focused.map"

      - name: Measure PVS baseline and focused envelope
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/e1env-iter
          ./build/frame_timeline "$ROOT/pvs.gg" "$ROOT/pvs.noi" "$ROOT/pvs.csv" 180 8 "$ROOT/pvs-map.bin" \
            | tee "$ROOT/pvs-timeline.txt"
          ./build/frame_timeline "$ROOT/focused.gg" "$ROOT/focused.noi" "$ROOT/focused.csv" 180 8 "$ROOT/focused-map.bin" \
            | tee "$ROOT/focused-timeline.txt"

      - name: Census edge plus vertical-border vocabulary
        shell: bash
        run: |
          set -euo pipefail
          GEAR="$PWD/.toolchain/Gearsystem"
          g++ -std=c++17 -O2 -Wall -Wextra             -I"$GEAR/src" -I"$GEAR/platforms/shared/dependencies/miniz"             tools/frame/mat_census.cpp build/coredbg/libgearsystem_core.a -lm             -o build/mat_census
          ./build/mat_census             build/e1env-iter/focused.gg build/e1env-iter/focused.noi cruise 180 8             | tee build/e1env-iter/edge-border-census.txt

      - name: Update-aligned parity and T-state comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/e1env-iter/summary.txt
          import csv,statistics
          from pathlib import Path
          root=Path("build/e1env-iter")
          a=list(csv.DictReader((root/"pvs.csv").open()))
          b=list(csv.DictReader((root/"focused.csv").open()))
          n=min(len(a),len(b))
          def vals(rows,k): return [int(r[k]) for r in rows[:n]]
          def mean(x): return statistics.fmean(x)
          def pct(x,p):
              q=sorted(x); return q[int((len(q)-1)*p)]
          state=lambda r:(r["x_q4"],r["y_q4"],r["z_q4"],r["yaw"])
          state_same=sum(state(x)==state(y) for x,y in zip(a[:n],b[:n]))
          map_same=sum(x["map_fnv64"]==y["map_fnv64"] for x,y in zip(a[:n],b[:n]))
          bad=[i for i,(x,y) in enumerate(zip(a[:n],b[:n])) if x["map_fnv64"]!=y["map_fnv64"]]
          at,bt=vals(a,"total"),vals(b,"total")
          ar,br=vals(a,"render"),vals(b,"render")
          clock=3579545.0
          print("E1ENV_FOCUS_AB")
          print(f"updates={n} state_equal={state_same}/{n} map_equal={map_same}/{n} mismatches={n-map_same}")
          print("first_mismatch_updates="+",".join(map(str,bad[:30])))
          # Cell-level parity autopsy. Each logical update contributes the raw
          # 20x18 name table (little-endian 16-bit words). This tells us whether
          # a hash mismatch is a one/two-cell corner-border convention or a
          # genuine missing/incorrect wall region.
          from collections import Counter
          cols,rows=20,18
          frame_bytes=cols*rows*2
          pa=(root/"pvs-map.bin").read_bytes()
          pb=(root/"focused-map.bin").read_bytes()
          assert len(pa)>=n*frame_bytes and len(pb)>=n*frame_bytes
          FULL_BASE=3
          FULL_END=3+3*3*4
          TILE_MASK=0x01ff
          def rd(buf,fi,ci):
              o=fi*frame_bytes+ci*2
              return buf[o] | (buf[o+1]<<8)
          EDGE_BASE=FULL_END
          EDGE_END=EDGE_BASE+3*16*8
          STATIC_END=3
          def border_only(wa,wb):
              ta,tb=wa&TILE_MASK,wb&TILE_MASK
              if not (FULL_BASE<=ta<FULL_END and FULL_BASE<=tb<FULL_END): return False
              if (wa&~TILE_MASK)!=(wb&~TILE_MASK): return False
              return ((ta-FULL_BASE)//4)==((tb-FULL_BASE)//4)
          def tile_family(w):
              t=w&TILE_MASK
              if t<STATIC_END: return ("static",t)
              if FULL_BASE<=t<FULL_END:
                  q=t-FULL_BASE
                  return ("full",(q//12,(q//4)%3,q%4))
              if EDGE_BASE<=t<EDGE_END:
                  q=t-EDGE_BASE
                  return ("edge",(q//128,(q//8)%16,q%8))
              return ("other",t)
          heat=[0]*(cols*rows)
          nonborder_heat=[0]*(cols*rows)
          pairs=Counter()
          family_pairs=Counter()
          semantic_pairs=Counter()
          attr_pairs=Counter()
          nonborder_by_frame=Counter()
          total_diff=total_border=0
          detail=[]
          for fi in bad:
              ds=[]; bo=0
              for ci in range(cols*rows):
                  wa,wb=rd(pa,fi,ci),rd(pb,fi,ci)
                  if wa==wb: continue
                  ds.append(ci); heat[ci]+=1; pairs[(wa,wb)]+=1
                  if border_only(wa,wb):
                      bo+=1
                  else:
                      nonborder_heat[ci]+=1
                      nonborder_by_frame[fi]+=1
                      fa,sa=tile_family(wa); fb,sb=tile_family(wb)
                      family_pairs[(fa,fb)]+=1
                      semantic_pairs[(fa,sa,fb,sb)]+=1
                      aa=wa&~TILE_MASK; ab=wb&~TILE_MASK
                      if aa!=ab: attr_pairs[(aa,ab)]+=1
              total_diff+=len(ds); total_border+=bo
              if ds:
                  rs=[ci//cols for ci in ds]; cs=[ci%cols for ci in ds]
                  detail.append((fi,len(ds),bo,min(cs),max(cs),min(rs),max(rs)))
          print(f"map_diff_cells_total={total_diff} border_variant_only={total_border} "
                f"border_share={(100*total_border/total_diff if total_diff else 0):.1f}%")
          for fi,cells,bo,c0,c1,r0,r1 in detail[:16]:
              print(f"mismatch_detail update={fi} cells={cells} border_only={bo} "
                    f"bbox=col{c0}..{c1},row{r0}..{r1}")
          topheat=sorted(((v,i) for i,v in enumerate(heat) if v),reverse=True)[:20]
          print("mismatch_hot_cells="+",".join(f"r{i//cols}c{i%cols}:{v}" for v,i in topheat))
          top_nonborder=sorted(((v,i) for i,v in enumerate(nonborder_heat) if v),reverse=True)[:20]
          print("nonborder_hot_cells="+",".join(f"r{i//cols}c{i%cols}:{v}" for v,i in top_nonborder))
          print("top_word_pairs="+",".join(
              f"{a:04x}->{b:04x}:{cnt}" for (a,b),cnt in pairs.most_common(20)))
          print("nonborder_family_pairs="+",".join(
              f"{a}->{b}:{cnt}" for (a,b),cnt in family_pairs.most_common()))
          print("nonborder_top_semantics="+",".join(
              f"{fa}:{sa}->{fb}:{sb}:{cnt}" for (fa,sa,fb,sb),cnt in semantic_pairs.most_common(30)))
          print("nonborder_attr_pairs="+(",".join(
              f"{a:04x}->{b:04x}:{cnt}" for (a,b),cnt in attr_pairs.most_common(12)) or "none"))
          print("nonborder_heavy_updates="+",".join(
              f"{fi}:{cnt}" for fi,cnt in nonborder_by_frame.most_common(20)))
          # Structural guard: an approximate edge/height difference is tolerable
          # here, but a reference frame containing walls must never collapse to
          # a completely static ceiling/horizon/floor map.
          catastrophic=[]
          for fi in range(n):
              pw=fw=0
              for ci in range(cols*rows):
                  ta=rd(pa,fi,ci)&TILE_MASK
                  tb=rd(pb,fi,ci)&TILE_MASK
                  pw += int(ta>=FULL_BASE)
                  fw += int(tb>=FULL_BASE)
              if pw and not fw: catastrophic.append(fi)
          print("catastrophic_blank_updates="+(",".join(map(str,catastrophic)) if catastrophic else "none"))
          assert not catastrophic, f"focused envelope blanked wall-bearing updates: {catastrophic}"
          # Bank 255 is emitted by this linker as _CODE_1. Keep the actual
          # headroom visible because the next optimization rung previously
          # missed the 16 KiB ceiling by only tens of bytes.
          bank_bytes=None
          for line in (root/"focused.map").read_text().splitlines():
              if line.startswith("_CODE_1 "):
                  bank_bytes=int(line.split()[2],16)
                  break
          if bank_bytes is not None:
              print(f"RENDERER_BANK_BYTES used={bank_bytes} headroom={16384-bank_bytes}")
          print(f"PVS total mean={mean(at):.0f} p50={pct(at,.5)} p95={pct(at,.95)} fps={clock/mean(at):.2f}")
          print(f"FOCUS total mean={mean(bt):.0f} p50={pct(bt,.5)} p95={pct(bt,.95)} fps={clock/mean(bt):.2f}")
          p95b=pct(bt,.95); worstb=max(bt); budget10=clock/10.0
          print(f"FOCUS_10FPS_MARGIN p95={budget10-p95b:+.0f}T worst={budget10-worstb:+.0f}T budget={budget10:.0f}T")
          print(f"delta total={mean(bt)-mean(at):+.0f} ({100*(mean(bt)/mean(at)-1):+.1f}%)")
          print(f"PVS render mean={mean(ar):.0f} p95={pct(ar,.95)}")
          print(f"FOCUS render mean={mean(br):.0f} p95={pct(br,.95)}")
          print(f"delta render={mean(br)-mean(ar):+.0f} ({100*(mean(br)/mean(ar)-1):+.1f}%)")
          for k in ("projection/setup","geometry walk","materializer","retained gate","boundary patch","nametable/VRAM","arith helpers","other render",
                    "env_fetch","env_focus","env_walk","env_draw","env_ret_end","env_nt_end"):
              if k in a[0] and k in b[0]:
                  av,bv=vals(a,k),vals(b,k)
                  print(f"group {k}: PVS={mean(av):.0f} FOCUS={mean(bv):.0f} delta={mean(bv)-mean(av):+.0f}")
          top=sorted(range(n),key=lambda i:at[i],reverse=True)[:12]
          print("baseline_heavy_updates="+",".join(f"{i}:{at[i]}->{bt[i]}({bt[i]-at[i]:+d})" for i in top))
          PY

      - name: Bottom-up focused-envelope profile
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/e1env-iter
          ./build/polar_function_profile_runner \
            "$ROOT/focused.gg" "$ROOT/focused.sym" "$ROOT/focused.noi" 60 8 \
            | tee "$ROOT/focused-functions.txt"

      - name: Build zero-hook interactive playable
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/e1env-iter"
          GEN="$ROOT/generated"
          ENVOBJS="$(cat "$ROOT/env-objs.txt")"
          rm -f build/main_tilesector_polar_gg.o build/tilesector_polar_motion_gg.o \
            build/tilesector_polar_renderer_gg.o build/tilesector_polar_ntstate_gg.o \
            build/tilesector_polar_materialize_gg.o build/tilesector_polar_ntupload_*_gg.o \
            build/frame_trace_gg.o build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" \
            POLAR_PROFILE_HOOKS=0 POLAR_LOCAL_PROJECTION=0 POLAR_SCREEN_DEPTH_PLANE=0 \
            POLAR_PROJ_GEN_DIR="$GEN" POLAR_DEPTHPLANE_MAP_INC="$GEN/optimized_renderer_map_data.inc" POLAR_DEPTHPLANE_BANK=243 POLAR_ROM_BANKS=256 \
            POLAR_EXTRA_OBJS="build/e1env_center_col_gg.o build/e1env_local_bearing_eval_gg.o $ENVOBJS" \
            TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_OPTIMIZED_MAP=1 -DTSPF_E1M1_FULL_ONLY=1 -DTSPF_E1M1_FRONT_ENVELOPE=1 -DTSPF_E1M1_FRONT_ENVELOPE_EXACT=1 -DTSPF_E1M1_BEARING_LUT=1 -DTSPF_E1M1_DEPTH_EDGE_LUT=1 -DTSPF_E1M1_LOCAL_BEARING_FIELD=1 -DTSPF_E1M1_PLANE_META=1 -DTSPF_E1M1_P99_EDGE_VOCAB=1 -DTSPF_DEFAULT_APPEARANCE=0u" \
            gg-tilesector-polar 2>&1 | tee "$ROOT/clean-build.txt"
          cp build/gg-tilesector-polar.gg "$ROOT/GG-E1M1-Exact-Q4-Focused-Envelope.gg"
          cp build/gg-tilesector-polar.sym "$ROOT/GG-E1M1-Exact-Q4-Focused-Envelope.sym"
          cp build/gg-tilesector-polar.map "$ROOT/GG-E1M1-Exact-Q4-Focused-Envelope.map"
          cp "$ROOT/focused.gg" "$ROOT/GG-E1M1-Exact-Q4-Focused-Envelope-PROFILED.gg"
          stat -c 'clean_rom_bytes=%s' "$ROOT/GG-E1M1-Exact-Q4-Focused-Envelope.gg" | tee "$ROOT/clean-ROM-size.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GG-E1M1-Exact-Q4-FocusedEnvelope
          path: build/e1env-iter/
          if-no-files-found: warn
          retention-days: 30
