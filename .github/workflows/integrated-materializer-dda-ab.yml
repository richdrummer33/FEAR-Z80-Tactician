name: Integrated materializer target census

on:
  push:
    branches:
      - validation/integrated-materializer-ab-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-census:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain build/target-census
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Build exact baseline then proven carry-border ROM
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/main_tilesector_polar_gg.o build/tilesector_polar_motion_gg.o build/tilesector_polar_renderer_gg.o \
            build/tilesector_polar_ntstate_gg.o build/tilesector_polar_materialize_gg.o build/tilesector_polar_ntupload_*_gg.o \
            build/tilesector_polar_projection_gg.o build/tilesector_polar_proj_bank*.o build/tilesector_polar_depthplane_gg.o \
            build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PROFILE_HOOKS=1 POLAR_LOCAL_PROJECTION=1 \
            POLAR_SCREEN_DEPTH_PLANE=1 POLAR_PROJ_THRESHOLD=4 POLAR_PROJ_ROWS_PER_BANK=4 POLAR_PROJ_BANK_COUNT=6 \
            POLAR_ROM_BANKS=8 TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_DEFAULT_APPEARANCE=2u" gg-tilesector-polar
          BASE_SHA="$(sha256sum build/gg-tilesector-polar.gg | cut -d' ' -f1)"
          echo "baseline sha256=$BASE_SHA"
          test "$BASE_SHA" = "6e742ee43220285fecdcc4078616bb10ee1ba9f3ffd48a6a9c7d075938c4637c"

          python3 tools/apply_integrated_materializer_rung.py
          rm -f build/tilesector_polar_materialize_gg.o build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PROFILE_HOOKS=1 POLAR_LOCAL_PROJECTION=1 \
            POLAR_SCREEN_DEPTH_PLANE=1 POLAR_PROJ_THRESHOLD=4 POLAR_PROJ_ROWS_PER_BANK=4 POLAR_PROJ_BANK_COUNT=6 \
            POLAR_ROM_BANKS=8 TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_DEFAULT_APPEARANCE=2u" gg-tilesector-polar
          cp build/gg-tilesector-polar.gg build/target-census/carry.gg
          cp build/gg-tilesector-polar.sym build/target-census/carry.sym
          cp build/gg-tilesector-polar.noi build/target-census/carry.noi
          sha256sum build/target-census/carry.gg | tee build/target-census/carry.sha256

      - name: Make bottom-up profiler mode/scenario aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/polar_function_profile_runner.cpp')
          s=p.read_text()
          anchor='int main(int argc,char**argv) {'
          helper=r'''static bool press_scenario(GearsystemCore& core,const std::string& s) {
              if(s=="roomA-turn") core.KeyPressed(Joypad_1,Key_Right);
              else if(s=="roomA-forward") core.KeyPressed(Joypad_1,Key_Up);
              else if(s=="static") return true;
              else return false;
              return true;
          }

          int main(int argc,char**argv) {'''
          assert s.count(anchor)==1
          s=s.replace(anchor,helper,1)
          old=r'''    if(argc<4) {
                  std::fprintf(stderr,"usage: %s rom.gg rom.sym rom.noi [updates=60] [warmup=8]\n",argv[0]);
                  return 2;
              }
              const char* rom=argv[1];
              const char* sym=argv[2];
              const char* noi=argv[3];
              unsigned target=(argc>4)?(unsigned)std::strtoul(argv[4],nullptr,0):60u;
              unsigned warmup=(argc>5)?(unsigned)std::strtoul(argv[5],nullptr,0):8u;
          '''
          new=r'''    if(argc<6) {
                  std::fprintf(stderr,"usage: %s rom.gg rom.sym rom.noi mode scenario [updates=60] [warmup=8]\n",argv[0]);
                  return 2;
              }
              const char* rom=argv[1];
              const char* sym=argv[2];
              const char* noi=argv[3];
              unsigned wanted_mode=(unsigned)std::strtoul(argv[4],nullptr,0);
              const std::string scenario=argv[5];
              unsigned target=(argc>6)?(unsigned)std::strtoul(argv[6],nullptr,0):60u;
              unsigned warmup=(argc>7)?(unsigned)std::strtoul(argv[7],nullptr,0):8u;
              if(wanted_mode>2u) return 2;
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old=r'''    u16 phase_addr=0;
              if(!find_symbol(sym,"_g_ts_prof_phase",phase_addr)&&!find_symbol(sym,"g_ts_prof_phase",phase_addr)) {
                  std::fprintf(stderr,"phase symbol missing\n"); return 3;
              }
          '''
          new=r'''    u16 phase_addr=0,mode_addr=0;
              if(!find_symbol(sym,"_g_ts_prof_phase",phase_addr)&&!find_symbol(sym,"g_ts_prof_phase",phase_addr)) {
                  std::fprintf(stderr,"phase symbol missing\n"); return 3;
              }
              if(!find_symbol(sym,"_g_tspf_appearance_mode",mode_addr)&&!find_symbol(sym,"g_tspf_appearance_mode",mode_addr)) {
                  std::fprintf(stderr,"mode symbol missing\n"); return 3;
              }
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='''    unsigned loops=0,measured=0;
              uint8_t last_phase=mem->DebugRetrieve(phase_addr);
          '''
          new='''    unsigned loops=0,measured=0;
              bool armed=false;
              uint8_t last_phase=mem->DebugRetrieve(phase_addr);
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old=r'''        if(p!=last_phase) {
                  if(p==1u) {
                      if(loops>=warmup) ++measured;
                      ++loops;
                  }
                  last_phase=p;
              }
          '''
          new=r'''        if(p!=last_phase) {
                  if(p==1u) {
                      if(!armed) {
                          mem->Write(mode_addr,(uint8_t)wanted_mode);
                          if(mem->DebugRetrieve(mode_addr)!=(uint8_t)wanted_mode) {
                              std::fprintf(stderr,"mode write failed\n"); return 6;
                          }
                          if(!press_scenario(core,scenario)) {
                              std::fprintf(stderr,"bad scenario\n"); return 2;
                          }
                          armed=true; loops=0; measured=0;
                      } else {
                          if(loops>=warmup) ++measured;
                          ++loops;
                      }
                  }
                  last_phase=p;
              }
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='''    std::printf("Polar render PC profile: measured_updates=%u render_cycles=%llu render_instructions=%llu\\n",
                          measured,(unsigned long long)total_render_cycles,(unsigned long long)total_render_ins);
          '''
          new='''    std::printf("Polar render PC profile: mode=%u scenario=%s measured_updates=%u render_cycles=%llu render_instructions=%llu\\n",
                          wanted_mode,scenario.c_str(),measured,(unsigned long long)total_render_cycles,(unsigned long long)total_render_ins);
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)
          print('patched target-aware bottom-up profiler')
          PY

      - name: Build only the target-aware Gearsystem profiler
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          ROOT="$PWD/.toolchain/Gearsystem"
          INC=(-I"$ROOT/src" -I"$ROOT/platforms/shared/dependencies/miniz")
          mkdir -p build/coredbg
          gcc -std=gnu99 -O2 "${INC[@]}" -c "$ROOT/src/audio/emu2413/emu2413.c" -o build/coredbg/emu2413.o
          gcc -std=gnu99 -O2 "${INC[@]}" -c "$ROOT/platforms/shared/dependencies/miniz/miniz.c" -o build/coredbg/miniz.o
          SRCS=(Audio.cpp Cartridge.cpp CodemastersMemoryRule.cpp GameGearIOPorts.cpp GearsystemCore.cpp Input.cpp
            KoreanMemoryRule.cpp KoreanMSXSMS8000MemoryRule.cpp KoreanSMS32KB2000MemoryRule.cpp KoreanMSX32KB2000MemoryRule.cpp
            Korean2000XOR1FMemoryRule.cpp KoreanMSX8KB0300MemoryRule.cpp Korean0000XORFFMemoryRule.cpp KoreanFFFFHiComMemoryRule.cpp
            KoreanFFFEMemoryRule.cpp KoreanBFFCMemoryRule.cpp KoreanFFF3FFFCMemoryRule.cpp KoreanMDFFF5MemoryRule.cpp KoreanMDFFF0MemoryRule.cpp
            Multi4PAKAllActionMemoryRule.cpp IratahackMemoryRule.cpp JumboDahjeeMemoryRule.cpp Eeprom93C46MemoryRule.cpp
            Memory.cpp MemoryRule.cpp MSXMemoryRule.cpp opcodes.cpp opcodes_cb.cpp opcodes_ed.cpp Processor.cpp RomOnlyMemoryRule.cpp
            SegaMemoryRule.cpp SG1000MemoryRule.cpp SmsIOPorts.cpp Video.cpp BootromMemoryRule.cpp JanggunMemoryRule.cpp YM2413.cpp
            VgmRecorder.cpp TraceLogger.cpp audio/Blip_Buffer.cpp audio/Sms_Apu.cpp audio/Stereo_Buffer.cpp)
          ARGS=(); for x in "${SRCS[@]}"; do ARGS+=("$ROOT/src/$x"); done
          g++ -std=c++17 -O2 -Wall -Wextra "${INC[@]}" tools/polar_function_profile_runner.cpp "${ARGS[@]}" \
            build/coredbg/emu2413.o build/coredbg/miniz.o -lm -o build/polar_target_census

      - name: Census exact mode-0 turn and forward workloads
        shell: bash
        run: |
          set -euo pipefail
          R=build/target-census
          ./build/polar_target_census "$R/carry.gg" "$R/carry.sym" "$R/carry.noi" 0 roomA-turn 48 6 | tee "$R/turn.txt"
          ./build/polar_target_census "$R/carry.gg" "$R/carry.sym" "$R/carry.noi" 0 roomA-forward 96 6 | tee "$R/forward.txt"
          echo '=== KEY ROW CENSUS ===' | tee "$R/summary.txt"
          grep -E 'Polar render PC profile|surface_column|run_geometry|whole-span|generic-edge-row|generic-cap-row|interior-row|sym-top-row|sym-bottom-row|unassigned' "$R/turn.txt" | tee -a "$R/summary.txt"
          grep -E 'Polar render PC profile|surface_column|run_geometry|whole-span|generic-edge-row|generic-cap-row|interior-row|sym-top-row|sym-bottom-row|unassigned' "$R/forward.txt" | tee -a "$R/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-materializer-target-census
          path: build/target-census/
          if-no-files-found: warn
          retention-days: 30
