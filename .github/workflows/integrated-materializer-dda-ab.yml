name: Integrated materializer DDA A-B

on:
  push:
    branches:
      - validation/integrated-materializer-ab-20260914
  pull_request:
    branches:
      - validation/playable-latest-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dda-ab:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain build/dda-ab
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Build exact baseline ROM
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/main_tilesector_polar_gg.o build/tilesector_polar_motion_gg.o build/tilesector_polar_renderer_gg.o \
            build/tilesector_polar_ntstate_gg.o build/tilesector_polar_materialize_gg.o build/tilesector_polar_ntupload_*_gg.o \
            build/tilesector_polar_projection_gg.o build/tilesector_polar_proj_bank*.o build/tilesector_polar_depthplane_gg.o \
            build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PROFILE_HOOKS=1 POLAR_LOCAL_PROJECTION=1 \
            POLAR_SCREEN_DEPTH_PLANE=1 POLAR_PROJ_THRESHOLD=4 POLAR_PROJ_ROWS_PER_BANK=4 POLAR_PROJ_BANK_COUNT=6 \
            POLAR_ROM_BANKS=8 TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_DEFAULT_APPEARANCE=2u" gg-tilesector-polar
          cp build/gg-tilesector-polar.gg build/dda-ab/baseline.gg
          cp build/gg-tilesector-polar.sym build/dda-ab/baseline.sym
          BASE_SHA="$(sha256sum build/dda-ab/baseline.gg | cut -d' ' -f1)"
          echo "baseline sha256=$BASE_SHA" | tee build/dda-ab/hashes.txt
          test "$BASE_SHA" = "6e742ee43220285fecdcc4078616bb10ee1ba9f3ffd48a6a9c7d075938c4637c"

      - name: Build carry-border ROM
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_integrated_materializer_rung.py
          rm -f build/tilesector_polar_materialize_gg.o build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PROFILE_HOOKS=1 POLAR_LOCAL_PROJECTION=1 \
            POLAR_SCREEN_DEPTH_PLANE=1 POLAR_PROJ_THRESHOLD=4 POLAR_PROJ_ROWS_PER_BANK=4 POLAR_PROJ_BANK_COUNT=6 \
            POLAR_ROM_BANKS=8 TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_DEFAULT_APPEARANCE=2u" gg-tilesector-polar
          cp build/gg-tilesector-polar.gg build/dda-ab/carry.gg
          cp build/gg-tilesector-polar.sym build/dda-ab/carry.sym
          echo "carry sha256=$(sha256sum build/dda-ab/carry.gg | cut -d' ' -f1)" | tee -a build/dda-ab/hashes.txt

      - name: Build carry-border plus DDA-local ROM
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_edge_local_dda_rung.py
          git diff -- src/tilesector_polar_materialize_gg.s > build/dda-ab/integration.patch
          rm -f build/tilesector_polar_materialize_gg.o build/gg-tilesector-polar.*
          make GBDK_HOME="$PWD/.toolchain/gbdk" POLAR_PROFILE_HOOKS=1 POLAR_LOCAL_PROJECTION=1 \
            POLAR_SCREEN_DEPTH_PLANE=1 POLAR_PROJ_THRESHOLD=4 POLAR_PROJ_ROWS_PER_BANK=4 POLAR_PROJ_BANK_COUNT=6 \
            POLAR_ROM_BANKS=8 TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_DEFAULT_APPEARANCE=2u" gg-tilesector-polar
          cp build/gg-tilesector-polar.gg build/dda-ab/dda.gg
          cp build/gg-tilesector-polar.sym build/dda-ab/dda.sym
          echo "dda sha256=$(sha256sum build/dda-ab/dda.gg | cut -d' ' -f1)" | tee -a build/dda-ab/hashes.txt

      - name: Build Gearsystem tools
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"
          ROOT="$PWD/.toolchain/Gearsystem"
          INC=(-I"$ROOT/src" -I"$ROOT/platforms/shared/dependencies/miniz")
          SRCS=(Audio.cpp Cartridge.cpp CodemastersMemoryRule.cpp GameGearIOPorts.cpp GearsystemCore.cpp Input.cpp
            KoreanMemoryRule.cpp KoreanMSXSMS8000MemoryRule.cpp KoreanSMS32KB2000MemoryRule.cpp KoreanMSX32KB2000MemoryRule.cpp
            Korean2000XOR1FMemoryRule.cpp KoreanMSX8KB0300MemoryRule.cpp Korean0000XORFFMemoryRule.cpp KoreanFFFFHiComMemoryRule.cpp
            KoreanFFFEMemoryRule.cpp KoreanBFFCMemoryRule.cpp KoreanFFF3FFFCMemoryRule.cpp KoreanMDFFF5MemoryRule.cpp KoreanMDFFF0MemoryRule.cpp
            Multi4PAKAllActionMemoryRule.cpp IratahackMemoryRule.cpp JumboDahjeeMemoryRule.cpp Eeprom93C46MemoryRule.cpp
            Memory.cpp MemoryRule.cpp MSXMemoryRule.cpp opcodes.cpp opcodes_cb.cpp opcodes_ed.cpp Processor.cpp RomOnlyMemoryRule.cpp
            SegaMemoryRule.cpp SG1000MemoryRule.cpp SmsIOPorts.cpp Video.cpp BootromMemoryRule.cpp JanggunMemoryRule.cpp YM2413.cpp
            VgmRecorder.cpp TraceLogger.cpp audio/Blip_Buffer.cpp audio/Sms_Apu.cpp audio/Stereo_Buffer.cpp)
          ARGS=(); for s in "${SRCS[@]}"; do ARGS+=("$ROOT/src/$s"); done
          g++ -std=c++17 -O2 -Wall -Wextra "${INC[@]}" tools/polar_ab_profile.cpp "${ARGS[@]}" \
            build/coredbg/emu2413.o build/coredbg/miniz.o -lm -o build/polar_ab_profile

      - name: Exact update traces for all three ROMs
        shell: bash
        run: |
          set -euo pipefail
          R=build/dda-ab
          for scenario in roomA-turn roomA-forward; do
            loops=48; [[ "$scenario" == roomA-forward ]] && loops=96
            for variant in baseline carry dda; do
              ./build/polar_ab_profile "$R/${variant}.gg" "$R/${variant}.sym" 0 "$scenario" "$loops" 6 "$R/${variant}-${scenario}.csv"
            done
          done
          python3 - <<'PY' | tee "$R/exactness.txt"
          import csv
          from pathlib import Path
          R=Path('build/dda-ab')
          for sc in ('roomA-turn','roomA-forward'):
              base=list(csv.DictReader(open(R/f'baseline-{sc}.csv')))
              for v in ('carry','dda'):
                  cur=list(csv.DictReader(open(R/f'{v}-{sc}.csv')))
                  assert len(base)==len(cur)
                  bad=[]
                  for i,(a,b) in enumerate(zip(base,cur)):
                      for k in ('x_q4','y_q4','yaw','map_fnv64'):
                          if a[k]!=b[k]: bad.append((i,k,a[k],b[k]))
                  if bad:
                      print(f'EXACTNESS_FAIL {v} {sc} mismatches={len(bad)} first={bad[0]}'); raise SystemExit(1)
                  print(f'EXACTNESS_PASS {v} {sc} logical_updates={len(base)} map/state identical')
          PY

      - name: Full phase reconciliation and transfer report
        shell: bash
        run: |
          set -euo pipefail
          R=build/dda-ab
          for variant in baseline carry dda; do
            ./build/polar_mode_cycle_profile "$R/${variant}.gg" "$R/${variant}.sym" 0 48 6 roomA-turn "$R/${variant}-turn-phases.csv" | tee "$R/${variant}-turn-phases.txt"
            ./build/polar_mode_cycle_profile "$R/${variant}.gg" "$R/${variant}.sym" 0 96 6 roomA-forward "$R/${variant}-forward-phases.csv" | tee "$R/${variant}-forward-phases.txt"
          done
          python3 - <<'PY' | tee "$R/summary.txt"
          import csv,statistics
          from pathlib import Path
          R=Path('build/dda-ab')
          print('=== EXACT-ROM MATERIALIZER DDA TRANSFER ===')
          print(open(R/'hashes.txt').read().strip())
          for sc,short in [('roomA-turn','turn'),('roomA-forward','forward')]:
              vals={}
              for v in ('baseline','carry','dda'):
                  rows=list(csv.DictReader(open(R/f'{v}-{short}-phases.csv')))
                  m=lambda k:statistics.mean(int(r[k]) for r in rows)
                  vals[v]={'loop':m('loop_T'),'render':m('p2_render_T')}
                  print(f'{sc} {v:8}: loop={vals[v]["loop"]:.1f}T render={vals[v]["render"]:.1f}T hz={3579545/vals[v]["loop"]:.2f}')
              b,c,d=vals['baseline'],vals['carry'],vals['dda']
              print(f'  baseline->DDA loop saving {b["loop"]-d["loop"]:.1f}T ({(1-d["loop"]/b["loop"])*100:.2f}%), render saving {b["render"]-d["render"]:.1f}T ({(1-d["render"]/b["render"])*100:.2f}%)')
              print(f'  DDA incremental over carry: loop {c["loop"]-d["loop"]:.1f}T, render {c["render"]-d["render"]:.1f}T')
          print(open(R/'exactness.txt').read().strip())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-materializer-dda-ab
          path: build/dda-ab/
          if-no-files-found: warn
          retention-days: 30
