name: GG PROGJOIN playable FULL live rung

on:
  push:
    branches: [validation/parity-enforcement-20260914]
    paths:
      - 'src/tilesector_polar_progjoin_runtime.c'
      - 'src/tilesector_polar_progjoin_runtime.h'
      - 'src/tilesector_polar_renderer.c'
      - 'src/tilesector_polar_materialize_gg.s'
      - 'tools/build_parity_materializer.py'
      - 'tools/apply_progjoin_full_live_rung.py'
      - 'tools/gg_progjoin_emit_assets.py'
      - 'tools/gg_progjoin_corpus_census.py'
      - 'tools/gg_progjoin_sparse_direct.py'
      - 'tools/edge_progjoin_bake.c'
      - 'tools/polar_ab_profile.cpp'
      - 'tools/build_gearsystem_tools.sh'
      - 'tools/build_progjoin_live_rom.sh'
      - 'tools/progjoin_live_ab.py'
      - 'tools/progjoin_shape_canon.py'
      - 'Makefile'
      - '.github/workflows/gg-progjoin-live-rung.yml'
  pull_request:
    paths:
      - 'src/tilesector_polar_progjoin_runtime.c'
      - 'src/tilesector_polar_progjoin_runtime.h'
      - 'src/tilesector_polar_renderer.c'
      - 'src/tilesector_polar_materialize_gg.s'
      - 'tools/build_parity_materializer.py'
      - 'tools/apply_progjoin_full_live_rung.py'
      - 'tools/gg_progjoin_emit_assets.py'
      - 'tools/gg_progjoin_corpus_census.py'
      - 'tools/gg_progjoin_sparse_direct.py'
      - 'tools/edge_progjoin_bake.c'
      - 'tools/polar_ab_profile.cpp'
      - 'tools/build_gearsystem_tools.sh'
      - 'tools/build_progjoin_live_rom.sh'
      - 'tools/progjoin_live_ab.py'
      - 'tools/progjoin_shape_canon.py'
      - 'Makefile'
      - '.github/workflows/gg-progjoin-live-rung.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-live-rung:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Build exact FULL corpus and sparse assets
        shell: bash
        run: |
          set -euo pipefail
          make coverage-potential
          mkdir -p build/progjoin_live/windows build/progjoin_live/packed build/progjoin_live/gen
          cc -O2 -Wall -Wextra -Isrc tools/edge_progjoin_bake.c src/tilesector_polar_motion.c -o build/edge_progjoin_bake
          python3 tools/gg_progjoin_corpus_census.py \
            build/coverage_pose_oracle.txt build/edge_progjoin_bake build/progjoin_live/windows --window 40 \
            | tee build/progjoin_live/census.txt
          python3 tools/gg_progjoin_sparse_direct.py build/progjoin_live/windows build/progjoin_live/packed \
            | tee build/progjoin_live/pack.txt
          python3 tools/gg_progjoin_emit_assets.py build/progjoin_live/packed build/progjoin_live/gen --base-bank 48 \
            | tee build/progjoin_live/assets.txt

      - name: Closed-form shape gate
        shell: bash
        run: |
          set -euo pipefail
          # The closed form is analytic and has no training set, so every pose is
          # held out from it. Guards the result that FULL-edge raster geometry is
          # computable from (step, fam, want, iq) with no corpus at all, which is
          # what makes the 40,672 B of dispatch tables removable.
          python3 tools/progjoin_shape_canon.py verify \
            build/coverage_pose_oracle.txt build/edge_progjoin_bake build/progjoin_live/shape_canon \
            | tee build/progjoin_live/shape-canon.txt
          grep -q SHAPE_CANON_EXACT build/progjoin_live/shape-canon.txt
          python3 tools/progjoin_shape_canon.py cost | tee build/progjoin_live/shape-canon-cost.txt

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Generate parity materializer and live splice
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_parity_materializer.py
          cp src/tilesector_polar_renderer.c build/progjoin_live/renderer.baseline.c
          cp src/tilesector_polar_materialize_gg.s build/progjoin_live/materializer.canonical.s
          cp build/parity/tilesector_polar_materialize_gg.generated.s src/tilesector_polar_materialize_gg.s
          cp src/tilesector_polar_materialize_gg.s build/progjoin_live/materializer.parity.s
          python3 tools/apply_progjoin_full_live_rung.py
          cp src/tilesector_polar_renderer.c build/progjoin_live/renderer.live.c
          cp src/tilesector_polar_materialize_gg.s build/progjoin_live/materializer.live.s

      - name: Build baseline, PROGJOIN and instrumented ROM variants
        shell: bash
        run: |
          set -euo pipefail
          export GBDK_HOME="$PWD/.toolchain/gbdk"
          G="$PWD/build/progjoin_live/gen"
          : > build/progjoin_live/rom-sha256.txt
          # Like-for-like: identical parity materializer, live splice, ROM size,
          # bank count, appearance mode and linked PROGJOIN assets. Only the
          # compiled finite-program path differs.
          for variant in baseline progjoin progjoin-stats; do
            tools/build_progjoin_live_rom.sh "$variant" build/progjoin_live "$G" \
              | tee -a build/progjoin_live/rom-sha256.txt
          done
          # The three ROMs must be genuinely different builds.
          test "$(cut -d' ' -f1 build/progjoin_live/rom-sha256.txt | sort -u | wc -l)" -eq 3

      - name: Build Gearsystem exactness profiler
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"
          ROOT="$PWD/.toolchain/Gearsystem"
          INC=(-I"$ROOT/src" -I"$ROOT/platforms/shared/dependencies/miniz")
          SRCS=(
            Audio.cpp Cartridge.cpp CodemastersMemoryRule.cpp GameGearIOPorts.cpp GearsystemCore.cpp Input.cpp
            KoreanMemoryRule.cpp KoreanMSXSMS8000MemoryRule.cpp KoreanSMS32KB2000MemoryRule.cpp KoreanMSX32KB2000MemoryRule.cpp
            Korean2000XOR1FMemoryRule.cpp KoreanMSX8KB0300MemoryRule.cpp Korean0000XORFFMemoryRule.cpp KoreanFFFFHiComMemoryRule.cpp
            KoreanFFFEMemoryRule.cpp KoreanBFFCMemoryRule.cpp KoreanFFF3FFFCMemoryRule.cpp KoreanMDFFF5MemoryRule.cpp KoreanMDFFF0MemoryRule.cpp
            Multi4PAKAllActionMemoryRule.cpp IratahackMemoryRule.cpp JumboDahjeeMemoryRule.cpp Eeprom93C46MemoryRule.cpp
            Memory.cpp MemoryRule.cpp MSXMemoryRule.cpp opcodes.cpp opcodes_cb.cpp opcodes_ed.cpp Processor.cpp RomOnlyMemoryRule.cpp
            SegaMemoryRule.cpp SG1000MemoryRule.cpp SmsIOPorts.cpp Video.cpp BootromMemoryRule.cpp JanggunMemoryRule.cpp YM2413.cpp
            VgmRecorder.cpp TraceLogger.cpp audio/Blip_Buffer.cpp audio/Sms_Apu.cpp audio/Stereo_Buffer.cpp
          )
          ARGS=()
          for s in "${SRCS[@]}"; do ARGS+=("$ROOT/src/$s"); done
          g++ -std=c++17 -O2 -Wall -Wextra "${INC[@]}" tools/polar_ab_profile.cpp "${ARGS[@]}" \
            build/coredbg/emu2413.o build/coredbg/miniz.o -lm -o build/polar_ab_profile

      - name: Run playable A/B exactness, coverage and cycle gate
        shell: bash
        run: |
          set -euo pipefail
          R=build/progjoin_live
          for variant in baseline progjoin progjoin-stats; do
            ./build/polar_ab_profile "$R/$variant.gg" "$R/$variant.sym" 0 roomA-turn    48 6 "$R/$variant-roomA-turn.csv"
            ./build/polar_ab_profile "$R/$variant.gg" "$R/$variant.sym" 0 roomA-forward 96 6 "$R/$variant-roomA-forward.csv"
          done
          # Exactness and the no-perturbation control are hard gates. Coverage
          # and cycles are reported: they are results about the executor, and
          # the thresholds that will graduate it are not yet met.
          python3 tools/progjoin_live_ab.py "$R" | tee "$R/live-ab.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-progjoin-playable-live-rung
          path: |
            build/progjoin_live/baseline.gg
            build/progjoin_live/progjoin.gg
            build/progjoin_live/progjoin-stats.gg
            build/progjoin_live/*.noi
            build/progjoin_live/*.sym
            build/progjoin_live/*.map
            build/progjoin_live/*.txt
            build/progjoin_live/*.json
            build/progjoin_live/*.sha256
            build/progjoin_live/*.csv
            build/progjoin_live/renderer.*.c
            build/progjoin_live/materializer.*.s
          retention-days: 30
