name: Materialize TileSector stage7 optimizations

on:
  push:
    branches:
      - feature/gg-tilesector-visibility-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate optimization patch
        run: |
          python3 tools/stage7_opt_patch.py
          make tilesector-test tilesector-host
      - name: Commit materialized renderer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-stage7-opt.yml tools/stage7_opt_patch.py
          git add src/tilesector_core.c
          git commit -m 'renderer: cache spans and bound portal raster work'
          git push
