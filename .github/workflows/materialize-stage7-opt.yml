name: Materialize TileSector stage7 optimizations

on:
  push:
    branches:
      - feature/gg-tilesector-visibility-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize portal traversal and raster hot loops
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/tilesector_core.c')
          s=p.read_text()

          def repl(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'pattern not found: {label}')
              s=s.replace(old,new,1)

          repl('''static const TSPortal k_portals[TS_PORTALS] = {\n    {0u,1u,14u,TS_NO_WALL},\n    {1u,2u,15u,16u}\n};\n''','''static const TSPortal k_portals[TS_PORTALS] = {\n    {0u,1u,14u,TS_NO_WALL},\n    {1u,2u,15u,16u}\n};\n\n/* Direct sector -> portal adjacency avoids rescanning every portal at every\n * recursion level. The demo topology is a chain: room A <-> connector <-> room B. */\nstatic const uint8_t k_sector_portal_count[TS_SECTORS] = {1u,2u,1u};\nstatic const uint8_t k_sector_portals[TS_SECTORS][2] = {\n    {0u,TS_NO_PORTAL}, {0u,1u}, {1u,TS_NO_PORTAL}\n};\n''','portal adjacency')

          repl('''static int16_t g_cam_x_q4[TS_VERTICES];\nstatic int16_t g_cam_z_q4[TS_VERTICES];\n\n/* Per-sector nearest solid candidate for each 8px screen column. This replaces\n * the old 20x18 generalized Z field: no vertical-cell depth disputes. */\nstatic uint8_t g_best_seg[TS_COLS];\nstatic uint8_t g_best_border[TS_COLS];\nstatic int16_t g_best_inv_l_q6[TS_COLS];\nstatic int16_t g_best_inv_r_q6[TS_COLS];\n''','''static int16_t g_cam_x_q4[TS_VERTICES];\nstatic int16_t g_cam_z_q4[TS_VERTICES];\n\n/* Projection is invariant for a world segment during one rendered frame. Cache\n * the 17 tiny spans so portals/candidate passes never redo clipping, reciprocal\n * interpolation and perspective projection for the same segment. */\nstatic TSProjectedSpan g_span_cache[TS_SEGMENTS];\nstatic uint8_t g_span_state[TS_SEGMENTS]; /* 0 unknown, 1 rejected, 2 visible */\n\n/* Per-sector nearest solid candidate for each 8px screen column. This replaces\n * the old 20x18 generalized Z field: no vertical-cell depth disputes. */\nstatic uint8_t g_best_seg[TS_COLS];\nstatic uint8_t g_best_inv[TS_COLS];\nstatic uint8_t g_best_border[TS_COLS];\nstatic int16_t g_best_inv_l_q6[TS_COLS];\nstatic int16_t g_best_inv_r_q6[TS_COLS];\n''','projection cache arrays')

          repl('''static uint8_t project_segment_span(uint8_t seg_id, TSProjectedSpan *p) {\n''','''static uint8_t project_segment_span_uncached(uint8_t seg_id, TSProjectedSpan *p) {\n''','rename projector')

          marker='''    p->c0 = c0;\n    p->c1 = c1;\n    return 1u;\n}\n\n/* ----- tile edge/fill raster ----- */\n'''
          repl(marker,'''    p->c0 = c0;\n    p->c1 = c1;\n    return 1u;\n}\n\nstatic const TSProjectedSpan *project_segment_span(uint8_t seg_id) {\n    uint8_t state=g_span_state[seg_id];\n    if (state==0u) {\n        state=project_segment_span_uncached(seg_id,&g_span_cache[seg_id]) ? 2u : 1u;\n        g_span_state[seg_id]=state;\n    }\n    return state==2u ? &g_span_cache[seg_id] : (const TSProjectedSpan *)0;\n}\n\n/* ----- tile edge/fill raster ----- */\n''','cache wrapper')

          # Remove put_tile and tighten full/edge row writers.
          start=s.index('static void put_tile(')
          end=s.index('/* Raster one already-visible surface column.', start)
          s=s[:start]+'''static void draw_full_rows(uint16_t out_map[TS_MAP_CELLS], uint8_t col,\n                           int8_t first, int8_t last, uint8_t shade, uint8_t border,\n                           uint8_t cap_first, uint8_t cap_last,\n                           uint8_t clip_first, uint8_t clip_last) {\n    int8_t r,plain_last;\n    uint16_t idx,plain;\n    if (first < (int8_t)clip_first) first = (int8_t)clip_first;\n    if (last > (int8_t)clip_last) last = (int8_t)clip_last;\n    if (first > last) return;\n    idx=(uint16_t)(k_row_base[(uint8_t)first]+col);\n\n    /* Interior rows are overwhelmingly the common case. Compute that tile ID\n     * once, then make the hot loop one store + one constant stride. */\n    plain=TS_TILE_FULL(shade,TS_CAP_NONE,border);\n    if (first==last) {\n        uint8_t cap=cap_last ? TS_CAP_BOTTOM : (cap_first ? TS_CAP_TOP : TS_CAP_NONE);\n        out_map[idx]=cap==TS_CAP_NONE ? plain : TS_TILE_FULL(shade,cap,border);\n        return;\n    }\n    if (cap_first) {\n        out_map[idx]=TS_TILE_FULL(shade,TS_CAP_TOP,border);\n        idx=(uint16_t)(idx+TS_COLS);\n        ++first;\n    }\n    plain_last=cap_last ? (int8_t)(last-1) : last;\n    for (r=first;r<=plain_last;++r) {\n        out_map[idx]=plain;\n        idx=(uint16_t)(idx+TS_COLS);\n    }\n    if (cap_last) out_map[idx]=TS_TILE_FULL(shade,TS_CAP_BOTTOM,border);\n}\n\nstatic void draw_edge_rows(uint16_t out_map[TS_MAP_CELLS], uint8_t col,\n                           int16_t left_y, int16_t right_y, uint8_t shade, uint8_t bottom,\n                           uint8_t clip_first, uint8_t clip_last) {\n    int8_t slope=clamp_s8((int16_t)(right_y-left_y),-7,7);\n    int8_t r0=row_floor(left_y<right_y?left_y:right_y);\n    int8_t r1=row_floor(left_y>right_y?left_y:right_y);\n    int8_t r;\n    if (r0 < (int8_t)clip_first) r0=(int8_t)clip_first;\n    if (r1 > (int8_t)clip_last) r1=(int8_t)clip_last;\n    if (r0<0) r0=0;\n    if (r1>=(int8_t)TS_ROWS) r1=(int8_t)(TS_ROWS-1u);\n    for (r=r0;r<=r1;++r) {\n        int16_t local=(int16_t)(left_y-((int16_t)r<<3));\n        out_map[k_row_base[(uint8_t)r]+col]=edge_entry(shade,local,slope,bottom);\n    }\n}\n\n'''+s[end:]

          # Compile diagnostic TSColumn metadata out of actual SDCC ROM.
          old='''    /* TSColumn is only diagnostic/host-observable nearest-wall metadata. */\n    {\n        uint8_t inv = (uint8_t)(((inv_l_q6 + inv_r_q6) >> 1) >> 6);\n        if (inv > cols[col].invz) {\n            cols[col].invz = inv;\n            cols[col].wall_id = seg_id;\n            cols[col].shade = shade;\n            cols[col].top = clamp_u8(top_l,143u);\n            cols[col].bottom = clamp_u8(bot_l,143u);\n            cols[col].top_step = clamp_s8((int16_t)(top_r-top_l),-7,7);\n            cols[col].bottom_step = clamp_s8((int16_t)(bot_r-bot_l),-7,7);\n        }\n    }\n'''
          new='''    /* Host tests expose nearest-wall diagnostics, but the Game Gear display never\n     * consumes TSColumn. Do not pay these 16-bit comparisons/stores on SDCC. */\n#ifndef __SDCC\n    {\n        uint8_t inv = (uint8_t)(((inv_l_q6 + inv_r_q6) >> 1) >> 6);\n        if (inv > cols[col].invz) {\n            cols[col].invz = inv;\n            cols[col].wall_id = seg_id;\n            cols[col].shade = shade;\n            cols[col].top = clamp_u8(top_l,143u);\n            cols[col].bottom = clamp_u8(bot_l,143u);\n            cols[col].top_step = clamp_s8((int16_t)(top_r-top_l),-7,7);\n            cols[col].bottom_step = clamp_s8((int16_t)(bot_r-bot_l),-7,7);\n        }\n    }\n#else\n    (void)cols;\n#endif\n'''
          repl(old,new,'diagnostics guard')

          # Replace candidate/portal/sector traversal block wholesale.
          start=s.index('static void candidate_reset(')
          end=s.index('static uint8_t current_sector(', start)
          newblock=r'''static void candidate_reset(uint8_t view_c0,uint8_t view_c1) {
    uint8_t c;
    for (c=view_c0;c<=view_c1;++c) g_best_seg[c]=TS_NO_WALL;
}

static void candidate_add_segment(uint8_t seg_id,uint8_t view_c0,uint8_t view_c1) {
    const TSProjectedSpan *p=project_segment_span(seg_id);
    int8_t c,c0,c1;
    int16_t inv_q6;
    if (!p) return;
    c0=p->c0;
    c1=p->c1;
    inv_q6=p->inv_q6;
    while (c0<(int8_t)view_c0) { inv_q6=(int16_t)(inv_q6+p->step_q6); ++c0; }
    if (c1>(int8_t)view_c1) c1=(int8_t)view_c1;
    if (c0>c1) return;
    for (c=c0;c<=c1;++c) {
        uint8_t uc=(uint8_t)c;
        int16_t next_q6=(int16_t)(inv_q6+p->step_q6);
        uint8_t inv=(uint8_t)(((inv_q6+next_q6)>>1)>>6);
        if (g_best_seg[uc]==TS_NO_WALL || inv>g_best_inv[uc]) {
            uint8_t border=0u;
            if (c==p->original_c0 && p->original_c0>=0) border|=1u;
            if (c==p->original_c1 && p->original_c1<(int8_t)TS_COLS) border|=2u;
            g_best_seg[uc]=seg_id;
            g_best_inv[uc]=inv;
            g_best_border[uc]=border;
            g_best_inv_l_q6[uc]=inv_q6;
            g_best_inv_r_q6[uc]=next_q6;
        }
        inv_q6=next_q6;
    }
}

static void build_sector_candidates(uint8_t sector,uint8_t view_c0,uint8_t view_c1) {
    uint8_t i;
    candidate_reset(view_c0,view_c1);
    for (i=0u;i<k_sector_count[sector];++i)
        candidate_add_segment(k_sector_segments[sector][i],view_c0,view_c1);
}

static void render_sector_candidates(uint8_t depth,uint8_t view_c0,uint8_t view_c1,
                                     uint16_t out_map[TS_MAP_CELLS], TSColumn cols[TS_COLS]) {
    uint8_t c;
    uint8_t prev_seg=TS_NO_WALL;
    int16_t carry_top=0,carry_bottom=0;

    for (c=view_c0;c<=view_c1;++c) {
        uint8_t seg_id=g_best_seg[c];
        int16_t tlq,trq,blq,brq;
        int16_t top_l,top_target,top_r,bot_l,bot_target,bot_r;
        uint8_t stl,sbl,str,sbr;
        if (seg_id==TS_NO_WALL || g_clip_top[depth][c]>g_clip_bottom[depth][c]) {
            prev_seg=TS_NO_WALL;
            continue;
        }
        profile_y_q6(k_segments[seg_id].profile,g_best_inv_l_q6[c],&tlq,&blq,&stl,&sbl);
        profile_y_q6(k_segments[seg_id].profile,g_best_inv_r_q6[c],&trq,&brq,&str,&sbr);
        if (stl||str) {
            top_l=(int16_t)((q6_round_px(tlq)+4)&~7);
            top_target=(int16_t)((q6_round_px(trq)+4)&~7);
        } else { top_l=q6_round_px(tlq); top_target=q6_round_px(trq); }
        if (sbl||sbr) {
            bot_l=(int16_t)(((q6_round_px(blq)+4)&~7)-1);
            bot_target=(int16_t)(((q6_round_px(brq)+4)&~7)-1);
        } else { bot_l=q6_round_px(blq); bot_target=q6_round_px(brq); }
        if (prev_seg==seg_id) { top_l=carry_top; bot_l=carry_bottom; }
        top_r=connected_end(top_l,top_target);
        bot_r=connected_end(bot_l,bot_target);
        carry_top=top_r; carry_bottom=bot_r; prev_seg=seg_id;
        raster_surface_column(out_map,cols,c,seg_id,
                              g_best_inv_l_q6[c],g_best_inv_r_q6[c],
                              top_l,top_r,bot_l,bot_r,
                              (uint8_t)(stl||str),(uint8_t)(sbl||sbr),g_best_border[c],
                              &g_clip_top[depth][c],&g_clip_bottom[depth][c],1u);
    }
}

static uint8_t portal_other_sector(uint8_t portal,uint8_t sector) {
    return k_portals[portal].sector_a==sector ? k_portals[portal].sector_b : k_portals[portal].sector_a;
}

static void raster_portal_face(uint8_t seg_id,const TSProjectedSpan *p,uint8_t depth,
                               uint8_t view_c0,uint8_t view_c1,
                               uint16_t out_map[TS_MAP_CELLS],TSColumn cols[TS_COLS]) {
    int8_t c,c0=p->c0,c1=p->c1;
    int16_t inv_q6=p->inv_q6;
    int16_t carry_top=0,carry_bottom=0;
    uint8_t have_carry=0u;
    if (seg_id==TS_NO_WALL) return;
    while (c0<(int8_t)view_c0) { inv_q6=(int16_t)(inv_q6+p->step_q6); ++c0; }
    if (c1>(int8_t)view_c1) c1=(int8_t)view_c1;
    for (c=c0;c<=c1;++c) {
        int16_t next_q6=(int16_t)(inv_q6+p->step_q6);
        int16_t tlq,trq,blq,brq;
        int16_t top_l,top_target,top_r,bot_l,bot_target,bot_r;
        uint8_t stl,sbl,str,sbr,border=0u;
        uint8_t uc=(uint8_t)c;
        if (g_clip_top[depth][uc]<=g_clip_bottom[depth][uc]) {
            profile_y_q6(k_segments[seg_id].profile,inv_q6,&tlq,&blq,&stl,&sbl);
            profile_y_q6(k_segments[seg_id].profile,next_q6,&trq,&brq,&str,&sbr);
            if (stl||str) {
                top_l=(int16_t)((q6_round_px(tlq)+4)&~7);
                top_target=(int16_t)((q6_round_px(trq)+4)&~7);
            } else { top_l=q6_round_px(tlq); top_target=q6_round_px(trq); }
            if (sbl||sbr) {
                bot_l=(int16_t)(((q6_round_px(blq)+4)&~7)-1);
                bot_target=(int16_t)(((q6_round_px(brq)+4)&~7)-1);
            } else { bot_l=q6_round_px(blq); bot_target=q6_round_px(brq); }
            if (have_carry) { top_l=carry_top; bot_l=carry_bottom; }
            top_r=connected_end(top_l,top_target);
            bot_r=connected_end(bot_l,bot_target);
            carry_top=top_r; carry_bottom=bot_r; have_carry=1u;
            if (c==p->original_c0&&p->original_c0>=0) border|=1u;
            if (c==p->original_c1&&p->original_c1<(int8_t)TS_COLS) border|=2u;
            raster_surface_column(out_map,cols,uc,seg_id,inv_q6,next_q6,
                                  top_l,top_r,bot_l,bot_r,
                                  (uint8_t)(stl||str),(uint8_t)(sbl||sbr),border,
                                  &g_clip_top[depth][uc],&g_clip_bottom[depth][uc],1u);
        } else have_carry=0u;
        inv_q6=next_q6;
    }
}

static void render_sector(uint8_t sector,uint8_t parent_portal,uint8_t depth,
                          uint8_t view_c0,uint8_t view_c1,
                          uint16_t out_map[TS_MAP_CELLS],TSColumn cols[TS_COLS]);

static void render_portal(uint8_t portal,uint8_t sector,uint8_t depth,
                          uint8_t view_c0,uint8_t view_c1,
                          uint16_t out_map[TS_MAP_CELLS],TSColumn cols[TS_COLS]) {
    const TSProjectedSpan *p=project_segment_span(k_portals[portal].lintel_seg);
    uint8_t child_depth=(uint8_t)(depth+1u),child_sector,c,child_c0,child_c1;
    uint8_t found=0u;
    if (child_depth>=TS_MAX_PORTAL_DEPTH || !p) return;
    child_c0=(uint8_t)(p->c0>(int8_t)view_c0?p->c0:(int8_t)view_c0);
    child_c1=(uint8_t)(p->c1<(int8_t)view_c1?p->c1:(int8_t)view_c1);
    if (child_c0>child_c1) return;

    /* Initialize only the horizontal interval that the child traversal will
     * actually inspect. Closed parent columns are copied as closed; no 20-column reset. */
    for (c=child_c0;c<=child_c1;++c) {
        g_clip_top[child_depth][c]=g_clip_top[depth][c];
        g_clip_bottom[child_depth][c]=g_clip_bottom[depth][c];
        if (g_clip_top[child_depth][c]<=g_clip_bottom[child_depth][c]) found=1u;
    }
    if (!found) return;

    /* Lintel and riser share portal endpoints, so the one cached projected span
     * drives both faces instead of projecting the opening two or three times. */
    g_ts_render_stage=6u;
    raster_portal_face(k_portals[portal].lintel_seg,p,child_depth,child_c0,child_c1,out_map,cols);
    if (k_portals[portal].riser_seg!=TS_NO_WALL)
        raster_portal_face(k_portals[portal].riser_seg,p,child_depth,child_c0,child_c1,out_map,cols);

    g_ts_render_stage=5u;
    child_sector=portal_other_sector(portal,sector);
    render_sector(child_sector,portal,child_depth,child_c0,child_c1,out_map,cols);
}

static void render_sector(uint8_t sector,uint8_t parent_portal,uint8_t depth,
                          uint8_t view_c0,uint8_t view_c1,
                          uint16_t out_map[TS_MAP_CELLS],TSColumn cols[TS_COLS]) {
    uint8_t i,portal;
    g_ts_render_stage=3u;
    build_sector_candidates(sector,view_c0,view_c1);
    g_ts_render_stage=4u;
    render_sector_candidates(depth,view_c0,view_c1,out_map,cols);
    g_ts_render_stage=5u;
    for (i=0u;i<k_sector_portal_count[sector];++i) {
        portal=k_sector_portals[sector][i];
        if (portal==parent_portal) continue;
        render_portal(portal,sector,depth,view_c0,view_c1,out_map,cols);
        g_ts_render_stage=5u;
    }
}

'''
          s=s[:start]+newblock+s[end:]

          # Reset projection cache once/frame and pass root active column range.
          repl('''    g_ts_render_stage=2u;\n    transform_vertices_q4(s);\n\n    g_ts_render_stage=3u;\n    sector=current_sector(s);\n    render_sector(sector,TS_NO_PORTAL,0u,out_map,cols);\n''','''    g_ts_render_stage=2u;\n    transform_vertices_q4(s);\n    memset(g_span_state,0,sizeof(g_span_state));\n\n    g_ts_render_stage=3u;\n    sector=current_sector(s);\n    render_sector(sector,TS_NO_PORTAL,0u,0u,(uint8_t)(TS_COLS-1u),out_map,cols);\n''','root render range')

          p.write_text(s)
          PY
          make tilesector-test tilesector-host
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-stage7-opt.yml
          git add src/tilesector_core.c
          git commit -m 'renderer: cache spans and bound portal raster work'
          git push
