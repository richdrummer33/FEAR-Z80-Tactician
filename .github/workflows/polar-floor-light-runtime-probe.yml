name: Polar floor light runtime probe

on:
  push:
    branches:
      - experiment/gg-polar-lattice-lighting-fusion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-light:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Force true manual control and mature name-table placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main_tilesector_polar_gg.c')
          s=p.read_text()
          old='tsp_reset(&g_state);tsp_polar_renderer_reset();g_tspf_appearance_mode=TSPF_DEFAULT_APPEARANCE;'
          new='tsp_reset(&g_state);g_state.manual=1u;tsp_polar_renderer_reset();g_tspf_appearance_mode=TSPF_DEFAULT_APPEARANCE;'
          if s.count(old)!=1: raise SystemExit('manual boot anchor missing/ambiguous')
          s=s.replace(old,new)
          old2='DISPLAY_OFF;HIDE_SPRITES;'
          new2='DISPLAY_OFF;__WRITE_VDP_REG(VDP_R2,R2_MAP_0x3800);HIDE_SPRITES;'
          if old2 in s:s=s.replace(old2,new2,1)
          elif 'R2_MAP_0x3800' not in s:raise SystemExit('name table anchor missing')
          p.write_text(s)
          PY

      - name: Host Polar acceptance
        shell: bash
        run: |
          set -euo pipefail
          make polar-test | tee build/runtime-light-host-test.txt

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Build baseline then zero-pattern lit ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/runtime-light
          clean_polar() {
            rm -f build/main_tilesector_polar_gg.o build/tilesector_polar_motion_gg.o \
                  build/tilesector_polar_renderer_gg.o build/tilesector_polar_floor_light_runtime_gg.o \
                  build/tilesector_polar_projection_gg.o build/tilesector_polar_proj_bank*.o \
                  build/tilesector_polar_depthplane_gg.o build/tilesector_polar_ntstate_gg.o \
                  build/tilesector_polar_materialize_gg.o build/tilesector_polar_ntupload_raw_gg.o \
                  build/tilesector_polar_ntupload_profiled_gg.o build/gg-tilesector-polar.*
          }
          build_rom() {
            make GBDK_HOME="$PWD/.toolchain/gbdk" \
              POLAR_PROFILE_HOOKS=1 \
              POLAR_LOCAL_PROJECTION=1 POLAR_SCREEN_DEPTH_PLANE=1 \
              POLAR_PROJ_THRESHOLD=4 POLAR_PROJ_ROWS_PER_BANK=4 POLAR_PROJ_BANK_COUNT=6 \
              POLAR_ROM_BANKS=8 \
              TILESECTOR_FASTFLAGS="-Wf--opt-code-speed -DTSPF_DEFAULT_APPEARANCE=0u" \
              gg-tilesector-polar
          }

          clean_polar
          build_rom 2>&1 | tee build/runtime-light/build-baseline.txt
          cp build/gg-tilesector-polar.gg build/runtime-light/baseline.gg
          cp build/gg-tilesector-polar.sym build/runtime-light/baseline.sym
          [ ! -f build/gg-tilesector-polar.map ] || cp build/gg-tilesector-polar.map build/runtime-light/baseline.map

          python3 tools/apply_lattice_floor_light_runtime.py | tee build/runtime-light/runtime-patch.txt
          cp src/tilesector_polar_floor_light_runtime.c build/runtime-light/runtime-floor-light.c
          git diff -- src/tilesector_polar_renderer.c src/main_tilesector_polar_gg.c Makefile \
            > build/runtime-light/runtime-source.patch
          if git diff -- src/tilesector_polar.h | grep -q .; then
            echo 'FAIL: tile-count header changed; zero-new-pattern invariant violated' >&2
            exit 1
          fi

          clean_polar
          build_rom 2>&1 | tee build/runtime-light/build-lit.txt
          cp build/gg-tilesector-polar.gg build/runtime-light/lit.gg
          cp build/gg-tilesector-polar.sym build/runtime-light/lit.sym
          [ ! -f build/gg-tilesector-polar.map ] || cp build/gg-tilesector-polar.map build/runtime-light/lit.map

          sha256sum build/runtime-light/baseline.gg build/runtime-light/lit.gg | tee build/runtime-light/rom-sha256.txt
          wc -c build/runtime-light/baseline.gg build/runtime-light/lit.gg | tee build/runtime-light/rom-bytes.txt

      - name: Extend profiler with true player input scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/tilesector_profile_runner.cpp');s=p.read_text()
          old='if(scenario!="demo" && scenario!="roomA-turn") {'
          new='if(scenario!="demo" && scenario!="roomA-turn" && scenario!="roomA-forward" && scenario!="roomA-back" && scenario!="roomA-button1" && scenario!="roomA-button2") {'
          if s.count(old)!=1: raise SystemExit('scenario allow-list anchor missing')
          s=s.replace(old,new)
          old2='if(scenario=="roomA-turn")\n        core.KeyPressed(Joypad_1,Key_Right);'
          new2='''if(scenario=="roomA-turn") core.KeyPressed(Joypad_1,Key_Right);\n    else if(scenario=="roomA-forward") core.KeyPressed(Joypad_1,Key_Up);\n    else if(scenario=="roomA-back") core.KeyPressed(Joypad_1,Key_Down);\n    else if(scenario=="roomA-button1") core.KeyPressed(Joypad_1,Key_1);\n    else if(scenario=="roomA-button2") core.KeyPressed(Joypad_1,Key_2);'''
          if s.count(old2)!=1: raise SystemExit('input injection anchor missing')
          p.write_text(s.replace(old2,new2))
          PY

      - name: Build Gearsystem profiler and capture tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"

      - name: Verify lit ROM remains real-player controlled
        shell: bash
        run: |
          set -euo pipefail
          ROM=build/runtime-light/lit.gg
          SYM=build/runtime-light/lit.sym
          mkdir -p build/runtime-light/input-proof
          for scenario in demo roomA-forward roomA-back roomA-turn roomA-button1 roomA-button2; do
            ./build/tilesector_profile_runner "$ROM" "$SYM" 28 2 "$scenario" \
              | tee "build/runtime-light/input-proof/${scenario}.txt"
          done
          python3 - <<'PY' | tee build/runtime-light/input-proof-summary.txt
          from pathlib import Path
          import re
          root=Path('build/runtime-light/input-proof')
          def motion(name):
              t=(root/f'{name}.txt').read_text()
              a=re.search(r'motion start x=([-0-9.]+) y=([-0-9.]+) yaw=(\d+)',t)
              b=re.search(r'motion last\s+x=([-0-9.]+) y=([-0-9.]+) yaw=(\d+)',t)
              if not a or not b: raise SystemExit(f'missing motion records for {name}')
              return tuple(map(float,a.groups()[:2]))+(int(a.group(3)),),tuple(map(float,b.groups()[:2]))+(int(b.group(3)),)
          def moved(a,b):return abs(a[0]-b[0])>.01 or abs(a[1]-b[1])>.01
          pairs={n:motion(n) for n in ('demo','roomA-forward','roomA-back','roomA-turn','roomA-button1','roomA-button2')}
          a,b=pairs['demo']
          if moved(a,b) or a[2]!=b[2]:raise SystemExit('FAIL scripted rail active')
          for n in ('roomA-forward','roomA-back','roomA-button1','roomA-button2'):
              a,b=pairs[n]
              if not moved(a,b):raise SystemExit(f'FAIL {n} did not move')
          a,b=pairs['roomA-turn']
          if a[2]==b[2]:raise SystemExit('FAIL turn did not rotate')
          print('LIT_TRUE_PLAYER_CONTROL=PASS')
          for n,(a,b) in pairs.items():print(n,a,b)
          PY

      - name: Cycle profile baseline versus runtime light
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline lit; do
            for scenario in roomA-turn roomA-forward roomA-button1; do
              ./build/tilesector_profile_runner \
                "build/runtime-light/${variant}.gg" "build/runtime-light/${variant}.sym" \
                120 8 "$scenario" | tee "build/runtime-light/${variant}-${scenario}.txt"
            done
          done

          python3 - <<'PY' | tee build/runtime-light/performance-summary.txt
          from pathlib import Path
          import csv,json,re,statistics
          names=('roomA-turn','roomA-forward','roomA-button1')
          def read(v,n):
              t=Path(f'build/runtime-light/{v}-{n}.txt').read_text()
              def one(p,required=True):
                  m=re.search(p,t)
                  if not m:
                      if required: raise SystemExit(f'missing metric {v} {n}: {p}')
                      return None
                  return float(m.group(1))
              d={
                'loop_T':one(r'loop\s+avg=\s*([0-9.]+) T'),
                'updates_per_s':one(r'->\s*([0-9.]+) updates/s'),
                'render_T':one(r'render/build avg=\s*([0-9.]+) T'),
                'vram_T':one(r'VRAM-upload\s+avg=\s*([0-9.]+) T'),
                'dirty_words':one(r'dirty words\s+avg=\s*([0-9.]+)'),
                'map_hash':re.search(r'map-hash\s+frames=\d+ fnv64=([0-9A-F]+)',t).group(1),
              }
              if v=='lit':
                  d['light_projection_clip_T']=one(r'portal-control\s+total=.*?avg-chunk=\s*([0-9.]+) T')
                  d['light_cast_edges_T']=one(r'portal-face\s+total=.*?avg-chunk=\s*([0-9.]+) T')
                  d['light_fill_T']=one(r'retained-life\s+total=.*?avg-chunk=\s*([0-9.]+) T')
              return d
          records=[]
          for n in names:
              b=read('baseline',n);l=read('lit',n)
              dt=l['loop_T']-b['loop_T'];pct=100*dt/b['loop_T'];du=l['updates_per_s']-b['updates_per_s']
              rec={'scenario':n,'baseline':b,'lit':l,'delta':{'loop_T':dt,'loop_pct':pct,'updates_per_s':du,
                   'render_T':l['render_T']-b['render_T'],'vram_T':l['vram_T']-b['vram_T'],
                   'dirty_words':l['dirty_words']-b['dirty_words']}}
              records.append(rec)
              print(f'{n}: baseline={b["updates_per_s"]:.3f} upd/s lit={l["updates_per_s"]:.3f} upd/s loop_delta={dt:+.1f} T ({pct:+.2f}%) ups_delta={du:+.3f}')
              print(f'  render_delta={rec["delta"]["render_T"]:+.1f} T vram_delta={rec["delta"]["vram_T"]:+.1f} T dirty_delta={rec["delta"]["dirty_words"]:+.1f} words')
              print(f'  light_split projection_clip={l["light_projection_clip_T"]:.1f} T cast_edges={l["light_cast_edges_T"]:.1f} T fill={l["light_fill_T"]:.1f} T')
          bm=statistics.mean(r['baseline']['updates_per_s'] for r in records);lm=statistics.mean(r['lit']['updates_per_s'] for r in records)
          bt=statistics.mean(r['baseline']['loop_T'] for r in records);lt=statistics.mean(r['lit']['loop_T'] for r in records)
          split={k:statistics.mean(r['lit'][k] for r in records) for k in ('light_projection_clip_T','light_cast_edges_T','light_fill_T')}
          aggregate={'baseline_mean_updates_per_s':bm,'lit_mean_updates_per_s':lm,
                     'mean_loop_delta_T':lt-bt,'mean_loop_delta_pct':100*(lt-bt)/bt,
                     'mean_light_stage_T':split,'new_vram_patterns':0}
          print(f'representative_baseline_mean_updates_per_s={bm:.3f}')
          print(f'representative_lit_mean_updates_per_s={lm:.3f}')
          print(f'representative_mean_loop_delta_T={lt-bt:+.1f}')
          print(f'representative_mean_loop_delta_pct={100*(lt-bt)/bt:+.3f}')
          print(f'mean_light_projection_clip_T={split["light_projection_clip_T"]:.1f}')
          print(f'mean_light_cast_edges_T={split["light_cast_edges_T"]:.1f}')
          print(f'mean_light_fill_T={split["light_fill_T"]:.1f}')
          print('NEW_VRAM_PATTERNS=0')
          Path('build/runtime-light/performance-summary.json').write_text(json.dumps({'scenarios':records,'aggregate':aggregate},indent=2)+'\n')
          with Path('build/runtime-light/performance-summary.csv').open('w',newline='') as f:
              w=csv.writer(f);w.writerow(['scenario','baseline_updates_per_s','lit_updates_per_s','loop_delta_T','loop_delta_pct','light_projection_clip_T','light_cast_edges_T','light_fill_T','baseline_map_hash','lit_map_hash'])
              for r in records:
                  w.writerow([r['scenario'],r['baseline']['updates_per_s'],r['lit']['updates_per_s'],r['delta']['loop_T'],r['delta']['loop_pct'],r['lit']['light_projection_clip_T'],r['lit']['light_cast_edges_T'],r['lit']['light_fill_T'],r['baseline']['map_hash'],r['lit']['map_hash']])
          PY

      - name: Capture real-time motion video images and state data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install --user --disable-pip-version-check pillow
          ROOT=build/runtime-light/capture
          mkdir -p "$ROOT"
          for scenario in roomA-turn roomA-forward; do
            for variant in baseline lit; do
              D="$ROOT/${variant}-${scenario}"
              mkdir -p "$D/frames"
              ./build/tilesector_state_capture \
                "build/runtime-light/${variant}.gg" "build/runtime-light/${variant}.sym" \
                --vblank-sequence "$scenario" 180 30 "$D/frames/frame" "$D/state.csv" \
                | tee "$D/capture.txt"
              ffmpeg -y -loglevel error -framerate 60 -i "$D/frames/frame-%04d.ppm" \
                -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
                "$D/${variant}-${scenario}.mp4"
            done
            ffmpeg -y -loglevel error \
              -i "$ROOT/baseline-${scenario}/baseline-${scenario}.mp4" \
              -i "$ROOT/lit-${scenario}/lit-${scenario}.mp4" \
              -filter_complex '[0:v][1:v]hstack=inputs=2[v]' -map '[v]' \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
              "$ROOT/baseline-vs-lit-${scenario}.mp4"
          done

          python3 - <<'PY' | tee build/runtime-light/capture/capture-summary.txt
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          import csv,json
          root=Path('build/runtime-light/capture')
          scenarios=('roomA-turn','roomA-forward')
          picks=(0,59,119,179)
          manifest={'capture_kind':'real emulated display VBlank','display_fps':60,'frames':180,'warmup_vblanks':30,'scenarios':{}}
          for scenario in scenarios:
              rows=[]
              for variant in ('baseline','lit'):
                  d=root/f'{variant}-{scenario}'
                  imgs=[]
                  for idx in picks:
                      im=Image.open(d/'frames'/f'frame-{idx:04d}.ppm').convert('RGB')
                      im.save(d/f'frame-{idx:04d}.png')
                      imgs.append(im)
                  rows.append(imgs)
                  data=list(csv.DictReader((d/'state.csv').open()))
                  distinct_loops=len({r['loop_count'] for r in data})
                  distinct_maps=len({r['map_fnv64'] for r in data})
                  manifest['scenarios'].setdefault(scenario,{})[variant]={
                      'start':{k:data[0][k] for k in ('x','y','yaw','loop_count','map_fnv64')},
                      'end':{k:data[-1][k] for k in ('x','y','yaw','loop_count','map_fnv64')},
                      'distinct_loop_counts':distinct_loops,'distinct_map_hashes':distinct_maps,
                      'video':f'{variant}-{scenario}/{variant}-{scenario}.mp4','state_csv':f'{variant}-{scenario}/state.csv'}
                  print(f'{scenario} {variant}: start=({data[0]["x"]},{data[0]["y"]},yaw {data[0]["yaw"]}) end=({data[-1]["x"]},{data[-1]["y"]},yaw {data[-1]["yaw"]}) distinct_loops={distinct_loops} distinct_maps={distinct_maps}')
              w,h=rows[0][0].size; header=16
              sheet=Image.new('RGB',(w*len(picks),h*2+header*2),(0,0,0));draw=ImageDraw.Draw(sheet)
              for ri,label in enumerate(('BASELINE','RUNTIME FLOOR LIGHT')):
                  y=ri*(h+header);draw.text((3,y+2),label,fill=(255,255,255))
                  for ci,im in enumerate(rows[ri]):sheet.paste(im,(ci*w,y+header))
              sheet.save(root/f'baseline-vs-lit-{scenario}-contact-sheet.png')
              diff=ImageChops.difference(rows[0][-1],rows[1][-1]);diff.save(root/f'baseline-vs-lit-{scenario}-final-diff.png')
              manifest['scenarios'][scenario]['comparison_video']=f'baseline-vs-lit-{scenario}.mp4'
              manifest['scenarios'][scenario]['contact_sheet']=f'baseline-vs-lit-{scenario}-contact-sheet.png'
          (root/'capture-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('VIDEO_CAPTURE=PASS')
          print('videos=baseline-vs-lit-roomA-turn.mp4,baseline-vs-lit-roomA-forward.mp4 plus individual baseline/lit MP4s')
          print('images=4 representative PNG frames per variant/scenario plus A/B contact sheets and final diffs')
          print('data=per-VBlank state.csv files + capture-manifest.json')
          PY
          find "$ROOT" -type d -name frames -prune -exec rm -rf {} +

      - name: Summarize runtime floor light probe
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== POLAR ZERO-PATTERN RUNTIME FLOOR LIGHT ==='
            echo 'shadow representation=4 static world-space convex polygons + 4 internal cast edges'
            echo 'runtime placement=separate BANKED translation unit; one banked call/rendered update'
            echo 'partial-edge vocabulary=repurposed existing shade-0 edge family'
            echo 'full-shadow tile=ordinary floor tile + palette 1'
            echo 'new VRAM patterns=0'
            echo
            cat build/runtime-light/rom-bytes.txt
            cat build/runtime-light/rom-sha256.txt
            echo
            cat build/runtime-light/input-proof-summary.txt
            echo
            cat build/runtime-light/performance-summary.txt
            echo
            cat build/runtime-light/capture/capture-summary.txt
            echo
            echo 'machine-readable performance=performance-summary.json, performance-summary.csv'
            echo 'motion evidence=capture/*.mp4, capture/*.png, capture/*/state.csv, capture/capture-manifest.json'
          } | tee build/runtime-light/SUMMARY.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polar-floor-light-runtime-probe
          path: |
            build/runtime-light/
            build/runtime-light-host-test.txt
          retention-days: 30
