name: Profile Stage 28 runtime repair

on:
  push:
    branches:
      - feature/gg-tilesector-stage28-runtime-repair
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply Stage 10 transform LUT
        run: python3 tools/apply_stage10_vertex_rot_lut.py

      - name: Apply Stage 12 compact run bridge
        run: python3 tools/apply_stage12_nametable_runs.py

      - name: Generate Stage 12 run kernel
        shell: bash
        run: |
          python3 tools/gen_stage12_run_asm.py
          sed -i 's/        jr      /        jp      /g' src/tilesector_run_gg.s

      - name: Apply Stage 13 authoritative state
        run: python3 tools/apply_stage13_ntstate.py

      - name: Apply Stage 14 change-only stores
        run: python3 tools/apply_stage14_span_dirty.py

      - name: Apply Stage 18 column-major lifetime
        run: python3 tools/apply_stage18_column_lifetime.py

      - name: Apply Stage 18 direct opaque materializer
        run: python3 tools/apply_stage18_direct_opaque.py

      - name: Apply Stage 19 horizontal VDP row bursts
        run: python3 tools/apply_stage19_row_burst_upload.py

      - name: Apply Stage 20 row dirty extents
        run: python3 tools/apply_stage20_row_extents.py

      - name: Verify Stage 21 mirror identity
        run: python3 tools/test_stage21_full_symmetry.py

      - name: Apply Stage 21 symmetric FULL fast path
        run: python3 tools/apply_stage21_full_symmetry.py

      - name: Apply Stage 22 retained FULL descriptors
        run: python3 tools/apply_stage22_retained_full.py

      - name: Verify Stage 23 edge-delta semantics
        run: python3 tools/test_stage23_edge_delta.py

      - name: Apply Stage 23 edge-delta materializer
        run: python3 tools/apply_stage23_edge_delta.py

      - name: Link Stage 23+ kernels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile')
          s=p.read_text()
          old='TILESECTOR_GG_OBJS := build/main_tilesector_gg.o build/tilesector_core_gg.o build/tilesector_vram_gg.o build/tilesector_raster_gg.o'
          new='TILESECTOR_GG_OBJS := build/main_tilesector_gg.o build/tilesector_core_gg.o build/tilesector_raster_gg.o build/tilesector_candidate_lite_gg.o build/tilesector_run_gg.o build/tilesector_ntstate_gg.o build/tilesector_opaque_gg.o build/tilesector_symfull_gg.o'
          if old not in s: raise SystemExit('TileSector object list pattern not found')
          s=s.replace(old,new,1)
          anchor='''\nbuild/tilesector_raster_gg.o: src/tilesector_raster_gg.s | build\n\t$(LCC) $(GGFLAGS) -c -o $@ $<\n'''
          rules='''\nbuild/tilesector_candidate_lite_gg.o: src/tilesector_candidate_lite_gg.s | build\n\t$(LCC) $(GGFLAGS) -c -o $@ $<\n\nbuild/tilesector_run_gg.o: src/tilesector_run_gg.s | build\n\t$(LCC) $(GGFLAGS) -c -o $@ $<\n\nbuild/tilesector_ntstate_gg.o: src/tilesector_ntstate_gg.s | build\n\t$(LCC) $(GGFLAGS) -c -o $@ $<\n\nbuild/tilesector_opaque_gg.o: src/tilesector_opaque_gg.s | build\n\t$(LCC) $(GGFLAGS) -c -o $@ $<\n\nbuild/tilesector_symfull_gg.o: src/tilesector_symfull_gg.s | build\n\t$(LCC) $(GGFLAGS) -c -o $@ $<\n'''
          if anchor not in s: raise SystemExit('raster rule pattern not found')
          s=s.replace(anchor,anchor+rules,1)
          p.write_text(s)
          PY

      - name: Verify Stage 23 control representation
        shell: bash
        run: |
          grep -q 'STAGE22_RETAINED_FULL' src/tilesector_symfull_gg.s
          grep -q 'STAGE23_EDGE_DELTA' src/tilesector_symfull_gg.s
          grep -q 'STAGE20_ROW_EXTENTS' src/tilesector_ntstate_gg.s
          grep -q '_g_nt_cov_cur::    .ds 60' src/tilesector_ntstate_gg.s

      - name: Install GBDK 4.5.0
        shell: bash
        run: |
          mkdir -p .toolchain
          curl -L --fail --retry 3 -o .toolchain/gbdk-linux64.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  .toolchain/gbdk-linux64.tar.gz" | sha256sum -c -
          tar -xzf .toolchain/gbdk-linux64.tar.gz -C .toolchain

      - name: Host acceptance — control
        run: make tilesector-test tilesector-host

      - name: Build cycle profiler
        shell: bash
        run: |
          git clone --depth 1 --branch 3.9.16 https://github.com/drhelius/Gearsystem.git .toolchain/Gearsystem
          tools/build_gearsystem_tools.sh "$PWD/.toolchain/Gearsystem"

      - name: Build Stage 23 control ROM
        run: |
          make GBDK_HOME="$PWD/.toolchain/gbdk" gg-tilesector
          cp build/gg-tilesector-demo.gg build/control-stage23.gg
          cp build/gg-tilesector-demo.sym build/control-stage23.sym
          cp src/tilesector_core.c build/stage23-source-core.c
          cp src/tilesector_run_gg.s build/stage23-source-run.s
          cp src/tilesector_symfull_gg.s build/stage23-source-symfull.s
          cp src/tilesector_ntstate_gg.s build/stage23-source-ntstate.s

      - name: Profile Stage 23 control matrix
        shell: bash
        run: |
          ./build/tilesector_profile_runner build/control-stage23.gg build/control-stage23.sym 120 8 demo build/control-A-forward.bin build/control-A-forward.states | tee build/control-A-forward.txt
          ./build/tilesector_profile_runner build/control-stage23.gg build/control-stage23.sym 80 145 demo build/control-B-turn.bin build/control-B-turn.states | tee build/control-B-turn.txt
          ./build/tilesector_profile_runner build/control-stage23.gg build/control-stage23.sym 48 225  | tee build/control-C-late.txt
          ./build/tilesector_profile_runner build/control-stage23.gg build/control-stage23.sym 60 320  | tee build/control-D-static.txt
          ./build/tilesector_profile_runner build/control-stage23.gg build/control-stage23.sym 240 8   | tee build/control-E-mixed.txt
          ./build/tilesector_profile_runner build/control-stage23.gg build/control-stage23.sym 80 16 roomA-turn build/control-F-roomA-turn.bin build/control-F-roomA-turn.states | tee build/control-F-roomA-turn.txt

      - name: Verify retained-lifetime algorithms
        run: |
          python3 tools/test_stage24_retained_lifetime.py
          python3 tools/test_stage25_active_mask.py
          python3 tools/test_stage28_exception_sparse.py
          python3 tools/test_stage28d_deferred_reconcile.py

      - name: Define lifetime bisect builder
        shell: bash
        run: |
          cat > build_stage_variant.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tag="$1"
          rm -f build/main_tilesector_gg.o build/tilesector_core_gg.o build/tilesector_raster_gg.o \
                build/tilesector_candidate_lite_gg.o build/tilesector_run_gg.o \
                build/tilesector_ntstate_gg.o build/tilesector_opaque_gg.o \
                build/tilesector_symfull_gg.o build/gg-tilesector-demo.gg build/gg-tilesector-demo.sym
          make GBDK_HOME="$PWD/.toolchain/gbdk" gg-tilesector
          cp build/gg-tilesector-demo.gg "build/bisect-${tag}.gg"
          cp build/gg-tilesector-demo.sym "build/bisect-${tag}.sym"
          SH
          chmod +x build_stage_variant.sh

      - name: Apply Stage 24 retained FULL lifetime
        run: python3 tools/apply_stage24_retained_lifetime.py

      - name: Build bisect Stage24
        run: ./build_stage_variant.sh stage24

      - name: Audit Stage 23/24 RAM and ABI layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def symbols(path):
              out={}
              for raw in Path(path).read_text().splitlines():
                  parts=raw.split()
                  if len(parts)<2 or ':' not in parts[0]:
                      continue
                  bank,addr=parts[0].split(':',1)
                  try: out[parts[1]]=int(addr,16)
                  except ValueError: pass
              return out

          c=symbols('build/control-stage23.sym')
          s=symbols('build/bisect-stage24.sym')
          stable=['_g_state','_g_map','_g_ts_render_stage','_g_name_run_ctx','_g_raster_ctx']
          for name in stable:
              print(f'{name}: stage23={c.get(name,0):04X} stage24={s.get(name,0):04X}')
              assert c.get(name)==s.get(name), f'{name} moved between Stage23 and Stage24'
          for label,x in [('stage23',c),('stage24',s)]:
              heap=x['s__HEAP_END']; stack=x['.STACK']
              print(f'{label}: heap_end={heap:04X} stack={stack:04X} free_gap={stack-heap} bytes')
              assert 0xC000 <= heap < 0xDFF0
              assert stack == 0xDFF0
              assert heap < stack
          print('Stage23/24 RAM-layout stability and stack-gap audit: PASS')
          PY

      - name: Trace first divergent Game Gear RAM writes
        shell: bash
        run: |
          ./build/tilesector_write_trace build/control-stage23.gg build/control-stage23.sym 8 demo 3 19 256 | tee build/trace-control-A-r03c19.txt
          ./build/tilesector_write_trace build/bisect-stage24.gg build/bisect-stage24.sym 8 demo 3 19 256 | tee build/trace-stage24-A-r03c19.txt
          ./build/tilesector_write_trace build/control-stage23.gg build/control-stage23.sym 16 roomA-turn 3 11 256 | tee build/trace-control-F-r03c11.txt
          ./build/tilesector_write_trace build/bisect-stage24.gg build/bisect-stage24.sym 16 roomA-turn 3 11 256 | tee build/trace-stage24-F-r03c11.txt
          ./build/tilesector_write_trace build/control-stage23.gg build/control-stage23.sym 145 demo 3 0 0 | tee build/trace-control-B-marks.txt
          ./build/tilesector_write_trace build/bisect-stage24.gg build/bisect-stage24.sym 145 demo 3 0 0 | tee build/trace-stage24-B-marks.txt

      - name: Focused trace stop
        if: contains(github.event.head_commit.message, '[trace-fast]')
        run: |
          echo "Focused trace complete; intentionally stop before the long Stage25-28 matrix."
          exit 1

      - name: Build Stage24 lifetime sub-bisect variants
        shell: bash
        run: |
          cp src/tilesector_core.c build/stage24-base-core.c
          cp src/tilesector_run_gg.s build/stage24-base-run.s
          cp src/tilesector_symfull_gg.s build/stage24-base-symfull.s
          cp src/tilesector_ntstate_gg.s build/stage24-base-ntstate.s

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          python3 tools/apply_stage24_diag_mode.py no-finalizer
          ./build_stage_variant.sh stage24-nofinal

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          python3 tools/apply_stage24_diag_mode.py no-oldstale
          ./build_stage_variant.sh stage24-nooldstale

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          python3 tools/apply_stage24_diag_mode.py legacy-lifetime
          ./build_stage_variant.sh stage24-legacy-life

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          python3 tools/apply_stage24_diag_mode.py retention-off
          ./build_stage_variant.sh stage24-retention-off

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          python3 tools/apply_stage24_diag_mode.py legacy-no-exact
          ./build_stage_variant.sh stage24-noexact

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          python3 tools/apply_stage24_diag_mode.py legacy-no-edge
          ./build_stage_variant.sh stage24-noedge

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s
          python3 tools/apply_stage24_diag_mode.py stage23-ret5
          ./build_stage_variant.sh stage24-ret5

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s
          python3 tools/apply_stage24_diag_mode.py stage23-ret7-nocov
          ./build_stage_variant.sh stage24-ret7-nocov

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s
          python3 tools/apply_stage24_diag_mode.py stage23-ret7-cov
          ./build_stage_variant.sh stage24-ret7-cov

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s
          python3 tools/apply_stage24_diag_mode.py stage23-behavior
          echo "===== GENERATED DIFF: Stage23 -> Stage24-stage23beh core ====="
          diff -u build/stage23-source-core.c src/tilesector_core.c | tee build/diff-stage23beh-core.txt || true
          echo "===== GENERATED DIFF: Stage23 -> Stage24-stage23beh run ====="
          diff -u build/stage23-source-run.s src/tilesector_run_gg.s | tee build/diff-stage23beh-run.txt || true
          echo "===== GENERATED DIFF: Stage23 -> Stage24-stage23beh symfull ====="
          diff -u build/stage23-source-symfull.s src/tilesector_symfull_gg.s | tee build/diff-stage23beh-symfull.txt || true
          echo "===== GENERATED DIFF: Stage23 -> Stage24-stage23beh ntstate ====="
          diff -u build/stage23-source-ntstate.s src/tilesector_ntstate_gg.s | tee build/diff-stage23beh-ntstate.txt || true
          ./build_stage_variant.sh stage24-stage23beh

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s
          python3 tools/apply_stage24_diag_mode.py stage23-plus-owner
          ./build_stage_variant.sh stage24-plus-owner

          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s
          python3 tools/apply_stage24_diag_mode.py stage23-plus-eager
          ./build_stage_variant.sh stage24-plus-eager

          # Restore canonical generated Stage24 before applying Stage25.
          cp build/stage24-base-core.c src/tilesector_core.c
          cp build/stage24-base-run.s src/tilesector_run_gg.s
          cp build/stage24-base-symfull.s src/tilesector_symfull_gg.s
          cp build/stage24-base-ntstate.s src/tilesector_ntstate_gg.s

      - name: Apply Stage 25 retained active mask
        run: python3 tools/apply_stage25_active_mask.py

      - name: Build bisect Stage25
        run: ./build_stage_variant.sh stage25

      - name: Save Stage25 dense exception state
        run: cp src/tilesector_ntstate_gg.s build/stage25-base-ntstate.s

      - name: Apply Stage 29 zero-exception dense gate
        run: python3 tools/apply_stage29_exception_any_gate.py

      - name: Build bisect Stage29 candidate
        run: ./build_stage_variant.sh stage29

      - name: Profile Stage29 candidate matrix
        shell: bash
        run: |
          ./build/tilesector_profile_runner build/bisect-stage29.gg build/bisect-stage29.sym 120 8 demo build/stage29-A-forward.bin build/stage29-A-forward.states | tee build/stage29-A-forward.txt
          ./build/tilesector_profile_runner build/bisect-stage29.gg build/bisect-stage29.sym 80 145 demo build/stage29-B-turn.bin build/stage29-B-turn.states | tee build/stage29-B-turn.txt
          ./build/tilesector_profile_runner build/bisect-stage29.gg build/bisect-stage29.sym 48 225 | tee build/stage29-C-late.txt
          ./build/tilesector_profile_runner build/bisect-stage29.gg build/bisect-stage29.sym 60 320 | tee build/stage29-D-static.txt
          ./build/tilesector_profile_runner build/bisect-stage29.gg build/bisect-stage29.sym 240 8 | tee build/stage29-E-mixed.txt
          ./build/tilesector_profile_runner build/bisect-stage29.gg build/bisect-stage29.sym 80 16 roomA-turn build/stage29-F-roomA-turn.bin build/stage29-F-roomA-turn.states | tee build/stage29-F-roomA-turn.txt
          python3 tools/compare_map_dumps.py stage29-A build/control-A-forward.bin build/stage29-A-forward.bin
          python3 tools/compare_map_dumps.py stage29-B build/control-B-turn.bin build/stage29-B-turn.bin
          python3 tools/compare_map_dumps.py stage29-F build/control-F-roomA-turn.bin build/stage29-F-roomA-turn.bin
          python3 tools/compare_profile_matrix.py \
            A-forward build/control-A-forward.txt build/stage29-A-forward.txt \
            B-turn build/control-B-turn.txt build/stage29-B-turn.txt \
            C-late build/control-C-late.txt build/stage29-C-late.txt \
            D-static build/control-D-static.txt build/stage29-D-static.txt \
            E-mixed build/control-E-mixed.txt build/stage29-E-mixed.txt \
            F-roomA-turn build/control-F-roomA-turn.txt build/stage29-F-roomA-turn.txt \
            | tee build/stage29-ab-matrix.txt

      - name: Apply Stage 30 mark-sentinel gate
        run: python3 tools/apply_stage30_exception_sentinel.py

      - name: Build bisect Stage30 candidate
        run: ./build_stage_variant.sh stage30

      - name: Profile Stage30 candidate matrix
        shell: bash
        run: |
          ./build/tilesector_profile_runner build/bisect-stage30.gg build/bisect-stage30.sym 120 8 demo build/stage30-A-forward.bin build/stage30-A-forward.states | tee build/stage30-A-forward.txt
          ./build/tilesector_profile_runner build/bisect-stage30.gg build/bisect-stage30.sym 80 145 demo build/stage30-B-turn.bin build/stage30-B-turn.states | tee build/stage30-B-turn.txt
          ./build/tilesector_profile_runner build/bisect-stage30.gg build/bisect-stage30.sym 48 225 | tee build/stage30-C-late.txt
          ./build/tilesector_profile_runner build/bisect-stage30.gg build/bisect-stage30.sym 60 320 | tee build/stage30-D-static.txt
          ./build/tilesector_profile_runner build/bisect-stage30.gg build/bisect-stage30.sym 240 8 | tee build/stage30-E-mixed.txt
          ./build/tilesector_profile_runner build/bisect-stage30.gg build/bisect-stage30.sym 80 16 roomA-turn build/stage30-F-roomA-turn.bin build/stage30-F-roomA-turn.states | tee build/stage30-F-roomA-turn.txt
          python3 tools/compare_map_dumps.py stage30-A build/control-A-forward.bin build/stage30-A-forward.bin
          python3 tools/compare_map_dumps.py stage30-B build/control-B-turn.bin build/stage30-B-turn.bin
          python3 tools/compare_map_dumps.py stage30-F build/control-F-roomA-turn.bin build/stage30-F-roomA-turn.bin
          python3 tools/compare_profile_matrix.py \
            A-forward build/control-A-forward.txt build/stage30-A-forward.txt \
            B-turn build/control-B-turn.txt build/stage30-B-turn.txt \
            C-late build/control-C-late.txt build/stage30-C-late.txt \
            D-static build/control-D-static.txt build/stage30-D-static.txt \
            E-mixed build/control-E-mixed.txt build/stage30-E-mixed.txt \
            F-roomA-turn build/control-F-roomA-turn.txt build/stage30-F-roomA-turn.txt \
            | tee build/stage30-ab-matrix.txt

      - name: Apply Stage 31 retained global gates
        run: python3 tools/apply_stage28b_retained_gates.py

      - name: Build bisect Stage31 candidate
        run: ./build_stage_variant.sh stage31

      - name: Profile Stage31 candidate matrix
        shell: bash
        run: |
          ./build/tilesector_profile_runner build/bisect-stage31.gg build/bisect-stage31.sym 120 8 demo build/stage31-A-forward.bin build/stage31-A-forward.states | tee build/stage31-A-forward.txt
          ./build/tilesector_profile_runner build/bisect-stage31.gg build/bisect-stage31.sym 80 145 demo build/stage31-B-turn.bin build/stage31-B-turn.states | tee build/stage31-B-turn.txt
          ./build/tilesector_profile_runner build/bisect-stage31.gg build/bisect-stage31.sym 48 225 | tee build/stage31-C-late.txt
          ./build/tilesector_profile_runner build/bisect-stage31.gg build/bisect-stage31.sym 60 320 | tee build/stage31-D-static.txt
          ./build/tilesector_profile_runner build/bisect-stage31.gg build/bisect-stage31.sym 240 8 | tee build/stage31-E-mixed.txt
          ./build/tilesector_profile_runner build/bisect-stage31.gg build/bisect-stage31.sym 80 16 roomA-turn build/stage31-F-roomA-turn.bin build/stage31-F-roomA-turn.states | tee build/stage31-F-roomA-turn.txt
          python3 tools/compare_map_dumps.py stage31-A build/control-A-forward.bin build/stage31-A-forward.bin
          python3 tools/compare_map_dumps.py stage31-B build/control-B-turn.bin build/stage31-B-turn.bin
          python3 tools/compare_map_dumps.py stage31-F build/control-F-roomA-turn.bin build/stage31-F-roomA-turn.bin
          python3 tools/compare_profile_matrix.py \
            A-forward build/control-A-forward.txt build/stage31-A-forward.txt \
            B-turn build/control-B-turn.txt build/stage31-B-turn.txt \
            C-late build/control-C-late.txt build/stage31-C-late.txt \
            D-static build/control-D-static.txt build/stage31-D-static.txt \
            E-mixed build/control-E-mixed.txt build/stage31-E-mixed.txt \
            F-roomA-turn build/control-F-roomA-turn.txt build/stage31-F-roomA-turn.txt \
            | tee build/stage31-ab-matrix.txt

      - name: Focused Stage31 timing stop
        if: contains(github.event.head_commit.message, '[stage31-fast]')
        run: |
          echo "Stage31 split timing captured; intentionally stop before Stage28 matrix."
          exit 1

      - name: Restore Stage25 before Stage28 experiments
        run: cp build/stage25-base-ntstate.s src/tilesector_ntstate_gg.s

      - name: Apply Stage 28 sparse exception-only lifetime
        run: python3 tools/apply_stage28_exception_sparse.py

      - name: Build bisect Stage28A sparse
        run: ./build_stage_variant.sh stage28a

      - name: Apply Stage 28B retained hot-path gates
        run: python3 tools/apply_stage28b_retained_gates.py

      - name: Build bisect Stage28B gates
        run: ./build_stage_variant.sh stage28b

      - name: Apply Stage 28C stale ownership gate
        run: python3 tools/apply_stage28c_ownership_gate.py

      - name: Build bisect Stage28C ownership
        run: ./build_stage_variant.sh stage28c

      - name: Apply Stage 28D deferred final reconcile
        run: python3 tools/apply_stage28d_deferred_reconcile.py

      - name: Build bisect Stage28D deferred
        run: ./build_stage_variant.sh stage28d

      - name: Verify Stage 28 forward representation
        shell: bash
        run: |
          grep -q 'STAGE24_RETAINED_LIFETIME' src/tilesector_symfull_gg.s
          grep -q 'STAGE25_ACTIVE_MASK' src/tilesector_symfull_gg.s
          grep -q 'STAGE28_EXCEPTION_SPARSE_LIFETIME' src/tilesector_ntstate_gg.s
          grep -q 'STAGE28B_RETAINED_FAST_GATES' src/tilesector_symfull_gg.s
          grep -q 'STAGE28C_OWNERSHIP_GATE' src/tilesector_ntstate_gg.s
          grep -q 'STAGE28D_DEFERRED_FINAL_RECONCILE' src/tilesector_symfull_gg.s
          grep -q 'STAGE28D_DEFERRED_FINAL_RECONCILE' src/tilesector_ntstate_gg.s
          grep -Fq '_ts_nt_exception_owns_cell::' src/tilesector_ntstate_gg.s
          python3 tools/test_stage28_restore_abi.py
          grep -Fq '_g_ts_ret_full_prev_any:: .ds 1' src/tilesector_symfull_gg.s
          grep -Fq '_g_nt_exc_prev_active:: .ds 3' src/tilesector_ntstate_gg.s
          grep -Fq '_g_nt_exc_cur_active::  .ds 3' src/tilesector_ntstate_gg.s
          grep -Fq 'nte_exc_group_loop$:' src/tilesector_ntstate_gg.s
          grep -Fq 'nte_exc_slot$:' src/tilesector_ntstate_gg.s
          grep -Fq '_ts_retained_full_finalize_unseen::' src/tilesector_symfull_gg.s
          grep -q '_g_nt_cov_cur::    .ds 60' src/tilesector_ntstate_gg.s
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/tilesector_ntstate_gg.s').read_text()
          a=s.index('_ts_nt_begin_frame::')
          b=s.index('; Coverage ABI inherited from Stage 14:',a)
          assert 'ldir' not in s[a:b], 'legacy 60-byte begin clear still active'
          a=s.index('_ts_nt_end_frame::')
          b=s.index('_ts_nt_upload_dirty::',a)
          assert '_g_nt_exc_prev_active' in s[a:b]
          assert 'nte_col_loop$:' not in s[a:b], 'legacy unconditional 20-column end scan still active'
          print('Stage28 legacy common-path clear/scan removed: PASS')
          PY

      - name: Inspect transformed core warning context
        shell: bash
        run: |
          echo "=== transformed tilesector_core.c lines 645-670 ==="
          nl -ba src/tilesector_core.c | sed -n '645,670p'

      - name: Host acceptance — repaired
        run: make tilesector-test tilesector-host

      - name: Rebuild Stage 28 repaired ROM
        shell: bash
        run: |
          rm -f build/main_tilesector_gg.o build/tilesector_core_gg.o build/tilesector_raster_gg.o \
                build/tilesector_candidate_lite_gg.o build/tilesector_run_gg.o \
                build/tilesector_ntstate_gg.o build/tilesector_opaque_gg.o \
                build/tilesector_symfull_gg.o build/gg-tilesector-demo.gg build/gg-tilesector-demo.sym
          make GBDK_HOME="$PWD/.toolchain/gbdk" gg-tilesector
          cp build/gg-tilesector-demo.gg build/repair-stage28.gg
          cp build/gg-tilesector-demo.sym build/repair-stage28.sym

      - name: Profile Stage 28 repair matrix
        shell: bash
        run: |
          ./build/tilesector_profile_runner build/repair-stage28.gg build/repair-stage28.sym 120 8 demo build/repair-A-forward.bin build/repair-A-forward.states | tee build/repair-A-forward.txt
          ./build/tilesector_profile_runner build/repair-stage28.gg build/repair-stage28.sym 80 145 demo build/repair-B-turn.bin build/repair-B-turn.states | tee build/repair-B-turn.txt
          ./build/tilesector_profile_runner build/repair-stage28.gg build/repair-stage28.sym 48 225  | tee build/repair-C-late.txt
          ./build/tilesector_profile_runner build/repair-stage28.gg build/repair-stage28.sym 60 320  | tee build/repair-D-static.txt
          ./build/tilesector_profile_runner build/repair-stage28.gg build/repair-stage28.sym 240 8   | tee build/repair-E-mixed.txt
          ./build/tilesector_profile_runner build/repair-stage28.gg build/repair-stage28.sym 80 16 roomA-turn build/repair-F-roomA-turn.bin build/repair-F-roomA-turn.states | tee build/repair-F-roomA-turn.txt

      - name: Lifetime stage hardware-output bisect
        shell: bash
        run: |
          set +e
          for tag in stage24 stage24-nofinal stage24-nooldstale stage24-legacy-life stage24-retention-off stage24-noexact stage24-noedge stage24-ret5 stage24-ret7-nocov stage24-ret7-cov stage24-stage23beh stage24-plus-owner stage24-plus-eager stage25 stage28a stage28b stage28c stage28d; do
            echo "===== ${tag} / A-forward ====="
            ./build/tilesector_profile_runner "build/bisect-${tag}.gg" "build/bisect-${tag}.sym" 24 8 demo "build/bisect-${tag}-A.bin" > "build/bisect-${tag}-A.txt"
            python3 tools/compare_map_dumps.py "${tag}-A" <(head -c $((24*720)) build/control-A-forward.bin) "build/bisect-${tag}-A.bin"
            echo "===== ${tag} / F-roomA-turn ====="
            ./build/tilesector_profile_runner "build/bisect-${tag}.gg" "build/bisect-${tag}.sym" 24 16 roomA-turn "build/bisect-${tag}-F.bin" > "build/bisect-${tag}-F.txt"
            python3 tools/compare_map_dumps.py "${tag}-F" <(head -c $((24*720)) build/control-F-roomA-turn.bin) "build/bisect-${tag}-F.bin"
          done
          exit 0

      - name: Build native reference replay
        shell: bash
        run: |
          gcc -O2 -std=c11 -Isrc src/tilesector_core.c tools/tilesector_reference_replay.c -o build/tilesector_reference_replay

      - name: Reference-oracle map checks
        shell: bash
        continue-on-error: true
        run: |
          status=0
          cmp build/control-A-forward.states build/repair-A-forward.states || { echo "A-forward state sequence differs"; status=1; }
          cmp build/control-B-turn.states build/repair-B-turn.states || { echo "B-turn state sequence differs"; status=1; }
          cmp build/control-F-roomA-turn.states build/repair-F-roomA-turn.states || { echo "F-roomA-turn state sequence differs"; status=1; }

          ./build/tilesector_reference_replay build/control-A-forward.states build/reference-A-forward.bin
          ./build/tilesector_reference_replay build/control-B-turn.states build/reference-B-turn.bin
          ./build/tilesector_reference_replay build/control-F-roomA-turn.states build/reference-F-roomA-turn.bin

          python3 tools/compare_map_dumps.py REF-A-vs-control build/reference-A-forward.bin build/control-A-forward.bin || status=1
          python3 tools/compare_map_dumps.py REF-A-vs-repair build/reference-A-forward.bin build/repair-A-forward.bin || status=1
          python3 tools/compare_map_dumps.py REF-B-vs-control build/reference-B-turn.bin build/control-B-turn.bin || status=1
          python3 tools/compare_map_dumps.py REF-B-vs-repair build/reference-B-turn.bin build/repair-B-turn.bin || status=1
          python3 tools/compare_map_dumps.py REF-F-vs-control build/reference-F-roomA-turn.bin build/control-F-roomA-turn.bin || status=1
          python3 tools/compare_map_dumps.py REF-F-vs-repair build/reference-F-roomA-turn.bin build/repair-F-roomA-turn.bin || status=1
          exit $status

      - name: Diagnose map divergence
        shell: bash
        continue-on-error: true
        run: |
          python3 tools/compare_map_dumps.py A-forward build/control-A-forward.bin build/repair-A-forward.bin || true
          python3 tools/compare_map_dumps.py B-turn build/control-B-turn.bin build/repair-B-turn.bin || true
          python3 tools/compare_map_dumps.py F-roomA-turn build/control-F-roomA-turn.bin build/repair-F-roomA-turn.bin || true

      - name: Compare control vs repair
        shell: bash
        run: |
          python3 tools/compare_profile_matrix.py \
            A-forward build/control-A-forward.txt build/repair-A-forward.txt \
            B-turn    build/control-B-turn.txt    build/repair-B-turn.txt \
            C-late    build/control-C-late.txt    build/repair-C-late.txt \
            D-static  build/control-D-static.txt  build/repair-D-static.txt \
            E-mixed   build/control-E-mixed.txt   build/repair-E-mixed.txt \
            F-roomA-turn build/control-F-roomA-turn.txt build/repair-F-roomA-turn.txt \
            | tee build/stage28-ab-matrix.txt

      - name: Hash ROMs
        run: |
          sha256sum build/control-stage23.gg build/repair-stage28.gg | tee build/stage28-roms.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-tilesector-stage28-runtime-repair
          path: |
            build/control-stage23.gg
            build/control-stage23.sym
            build/repair-stage28.gg
            build/repair-stage28.sym
            build/control-*.txt
            build/repair-*.txt
            build/control-*.bin
            build/repair-*.bin
            build/control-*.states
            build/repair-*.states
            build/reference-*.bin
            build/bisect-*.gg
            build/bisect-*.sym
            build/bisect-*.txt
            build/bisect-*.bin
            build/diff-stage23beh-*.txt
            build/tilesector_profile_runner
            build/gearsystem_core_runner
            build/tilesector_write_trace
            build/trace-*.txt
            build/stage29-*.txt
            build/stage29-*.bin
            build/stage29-*.states
            build/stage29-ab-matrix.txt
            build/stage30-*.txt
            build/stage30-*.bin
            build/stage30-*.states
            build/stage30-ab-matrix.txt
            build/stage31-*.txt
            build/stage31-*.bin
            build/stage31-*.states
            build/stage31-ab-matrix.txt
            build/stage28-ab-matrix.txt
            build/stage28-roms.sha256
            src/tilesector_ntstate_gg.s
            src/tilesector_raster_gg.s
            src/tilesector_run_gg.s
            src/tilesector_opaque_gg.s
            src/tilesector_symfull_gg.s
            src/tilesector_core.c
            src/main_tilesector_gg.c
          if-no-files-found: error
