name: Polar baked light field probe

on:
  push:
    branches:
      - experiment/gg-polar-baked-light-field
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baked-light-field:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis packages
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check numpy matplotlib pillow

      - name: Run topology-closed exact-line field oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baked-light-field/exact
          python3 experiments/adaptive_polar_field/floor_shadow_edge_field_poc_v2.py \
            --out build/baked-light-field/exact \
            --step 8 --yaw-step 16 --bearing-threshold 4 --min-q4 8 \
            | tee build/baked-light-field/exact/run.txt

      - name: Run GG integer-depth field oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baked-light-field/ggdepth
          python3 experiments/adaptive_polar_field/floor_shadow_edge_field_poc_v3_ggdepth.py \
            --out build/baked-light-field/ggdepth \
            --step 8 --yaw-step 16 --bearing-threshold 4 --min-q4 8 \
            | tee build/baked-light-field/ggdepth/run.txt

      - name: Sanity-check and expose representation metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(name):return json.loads(Path(f'build/baked-light-field/{name}/summary.json').read_text())
          exact=load('exact');gg=load('ggdepth')
          for name,d in [('exact',exact),('ggdepth',gg)]:
              assert d['positions'] >= 300, (name,d['positions'])
              assert d['poses'] >= 4800, (name,d['poses'])
              assert d['ordinary_poses'] == d['poses'], (name,d['ordinary_poses'],d['poses'])
              assert d['topology_fallback_poses'] == 0, (name,d['topology_fallback_poses'])
              assert d['existing_shadow_vertices_reused'] == 9
              assert d['new_shadow_vertices'] == 4
              assert d['yaw_representation'].startswith('absolute Q12 bearing field')
              assert d['penumbra']['new_mixed_tiles_total'] == 0
              assert d['new_vertex_field']['estimated_bytes'] < 65536
          assert exact['ordinary_pose_hard_shadow_error_pct']['mean'] < 0.5
          # Do not prematurely bless the cheap GG depth model: report it first.
          for title,d in [('Exact edge field',exact),('GG depth edge field',gg)]:
              raw=d['ordinary_pose_hard_shadow_error_pct'];quant=d['ordinary_pose_existing_edge_quantized_error_pct']
              nf=d['new_vertex_field'];pen=d['penumbra']
              msg=(f"poses={d['poses']} topology_fb={d['topology_fallback_poses']} "
                   f"raw_mean={raw['mean']:.6f}% raw_p95={raw['p95']:.6f}% raw_max={raw['max']:.6f}% "
                   f"edge_mean={quant['mean']:.6f}% edge_p95={quant['p95']:.6f}% edge_max={quant['max']:.6f}% "
                   f"new_field_bytes={nf['estimated_bytes']} leaves={nf['affine_leaves']} field_fb={nf['fallback_records']} "
                   f"pen_new_mixed={pen['new_mixed_tiles_total']}")
              print(title+': '+msg)
              print(f'::notice title={title}::{msg}')
          print('BAKED_LIGHT_FIELD_REPRESENTATION_SANITY=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polar-baked-light-field-probe
          path: |
            build/baked-light-field/
          retention-days: 30
