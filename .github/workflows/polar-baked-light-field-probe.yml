name: Polar baked light field probe

on:
  push:
    branches:
      - experiment/gg-polar-baked-light-field
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baked-light-field:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis packages
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check numpy matplotlib pillow

      - name: Run topology-closed exact-line field oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baked-light-field/exact
          python3 experiments/adaptive_polar_field/floor_shadow_edge_field_poc_v2.py \
            --out build/baked-light-field/exact \
            --step 8 --yaw-step 16 --bearing-threshold 4 --min-q4 8 \
            | tee build/baked-light-field/exact/run.txt

      - name: Run GG 8-bit depth field oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baked-light-field/gg8
          python3 experiments/adaptive_polar_field/floor_shadow_edge_field_poc_v3_ggdepth.py \
            --out build/baked-light-field/gg8 \
            --step 8 --yaw-step 16 --bearing-threshold 4 --min-q4 8 \
            | tee build/baked-light-field/gg8/run.txt

      - name: Run GG wide-reciprocal depth field oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baked-light-field/gg16
          python3 experiments/adaptive_polar_field/floor_shadow_edge_field_poc_v4_widerecip.py \
            --out build/baked-light-field/gg16 \
            --step 8 --yaw-step 16 --bearing-threshold 4 --min-q4 8 \
            | tee build/baked-light-field/gg16/run.txt

      - name: Sanity-check and expose representation metrics
        id: metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          def load(name):return json.loads(Path(f'build/baked-light-field/{name}/summary.json').read_text())
          runs={name:load(name) for name in ('exact','gg8','gg16')}
          for name,d in runs.items():
              assert d['positions'] >= 300, (name,d['positions'])
              assert d['poses'] >= 4800, (name,d['poses'])
              assert d['ordinary_poses'] == d['poses'], (name,d['ordinary_poses'],d['poses'])
              assert d['topology_fallback_poses'] == 0, (name,d['topology_fallback_poses'])
              assert d['existing_shadow_vertices_reused'] == 9
              assert d['new_shadow_vertices'] == 4
              assert d['yaw_representation'].startswith('absolute Q12 bearing field')
              assert d['penumbra']['new_mixed_tiles_total'] == 0
              assert d['new_vertex_field']['estimated_bytes'] < 65536
          assert runs['exact']['ordinary_pose_hard_shadow_error_pct']['mean'] < 0.5
          for title,name in [('Exact edge field','exact'),('GG 8-bit edge field','gg8'),('GG wide edge field','gg16')]:
              d=runs[name];raw=d['ordinary_pose_hard_shadow_error_pct'];quant=d['ordinary_pose_existing_edge_quantized_error_pct']
              nf=d['new_vertex_field'];pen=d['penumbra']
              msg=(f"poses={d['poses']} topology_fb={d['topology_fallback_poses']} "
                   f"raw_mean={raw['mean']:.6f}% raw_p95={raw['p95']:.6f}% raw_max={raw['max']:.6f}% "
                   f"edge_mean={quant['mean']:.6f}% edge_p95={quant['p95']:.6f}% edge_max={quant['max']:.6f}% "
                   f"new_field_bytes={nf['estimated_bytes']} leaves={nf['affine_leaves']} field_fb={nf['fallback_records']} "
                   f"pen_new_mixed={pen['new_mixed_tiles_total']}")
              print(title+': '+msg);print(f'::notice title={title}::{msg}')
          er=runs['exact']['ordinary_pose_hard_shadow_error_pct'];g8=runs['gg8']['ordinary_pose_hard_shadow_error_pct'];g16=runs['gg16']['ordinary_pose_hard_shadow_error_pct'];nf=runs['exact']['new_vertex_field']
          tag=(f"em{er['mean']:.4f}-ep{er['p95']:.4f}-g8m{g8['mean']:.4f}-"
               f"g16m{g16['mean']:.4f}-g16p{g16['p95']:.4f}-b{nf['estimated_bytes']}-fb{nf['fallback_records']}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tag='+tag+'\n')
          print('BAKED_LIGHT_FIELD_REPRESENTATION_SANITY=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polar-baked-light-field-${{ steps.metrics.outputs.tag }}
          path: |
            build/baked-light-field/
          retention-days: 30
