name: IBM hardware v1 transpile

on:
  push:
    branches:
      - experiment/qiskit-hardware-v1
    paths:
      - tools/ibm_hardware_v1_transpile.py
      - .github/workflows/ibm-hardware-v1-transpile.yml
  workflow_dispatch:

jobs:
  transpile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qiskit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "qiskit==2.5.2" "qiskit-ibm-runtime==0.47.0"
      - name: Transpile hardware ladder
        run: |
          python tools/ibm_hardware_v1_transpile.py | tee ibm_hardware_v1_qiskit.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ibm-hardware-v1-qiskit
          path: |
            ibm_hardware_v1_qiskit_results.json
            ibm_hardware_v1_qiskit.log
