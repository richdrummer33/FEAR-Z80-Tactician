name: export-vfx-source
on:
  push:
    branches: [tmp-vfx-export5]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: tar --exclude=.git -czf /tmp/vfx-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vfx-source
          path: /tmp/vfx-source.tar.gz
