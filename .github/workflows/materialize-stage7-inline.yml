name: Materialize TileSector inline hot path

on:
  push:
    branches:
      - feature/gg-tilesector-visibility-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inline short hot-path functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/tilesector_core.c')
          s=p.read_text()
          names=[
            ('static int8_t screen_col_floor(', 'static inline int8_t screen_col_floor('),
            ('static int8_t row_floor(', 'static inline int8_t row_floor('),
            ('static uint8_t shade_for(', 'static inline uint8_t shade_for('),
            ('static int16_t q6_round_px(', 'static inline int16_t q6_round_px('),
            ('static void profile_y_q6(', 'static inline void profile_y_q6('),
            ('static uint16_t edge_entry(', 'static inline uint16_t edge_entry('),
            ('static void draw_full_rows(', 'static inline void draw_full_rows('),
            ('static void draw_edge_rows(', 'static inline void draw_edge_rows('),
            ('static void raster_surface_column(', 'static inline void raster_surface_column('),
            ('static int16_t connected_end(', 'static inline int16_t connected_end('),
          ]
          for old,new in names:
              if old not in s:
                  raise SystemExit('missing '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          make tilesector-test tilesector-host
      - name: Commit materialized renderer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-stage7-inline.yml
          git add src/tilesector_core.c
          git commit -m 'renderer: inline TileSector raster hot path'
          git push
